# Full dev stack: app + databases + observability.
# Prod uses this same file with a prebuilt image instead of building in place.

# Where the stores are, for every application container. .env names them at localhost,
# which is right for `dev` mode on the host and wrong inside a container, where localhost
# is the container itself: the worker died on RabbitMQ and the api's readiness said 503.
# `environment:` outranks `env_file:`, so these win. The passwords come from the same .env.
x-stores: &stores
  DATABASE_URL: postgresql://${POSTGRES_USER:-mycel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mycel}
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-mycel}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
  REDIS_URL: redis://redis:6379/0
  REDIS_CACHE_URL: redis://redis:6379/1
  QDRANT_URL: http://qdrant:6333
  S3_ENDPOINT_URL: http://minio:9000
  LITELLM_BASE_URL: http://litellm:4000

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mycel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mycel}
    # 5433 on the host, not 5432: a machine that already runs Postgres for something else
    # keeps the default, and this stack does not fight it for the port. DATABASE_URL in
    # .env names the same number — the two have to agree or nothing connects.
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mycel}"]
      interval: 5s
      retries: 10

  # In development the API runs on the host (`uvicorn --reload`), so it stays out of the
  # default `up`: docker compose --profile api up -d builds and runs it like prod does.
  api:
    build: {context: ., target: app}
    profiles: [api]
    # `--factory`: there is no module-level `app`. `create_app()` is a factory on purpose,
    # so configuration is chosen at call time rather than frozen at import.
    command: uvicorn --factory mycel.api.app:create_app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      <<: *stores
      # /metrics on its own port (9103), reachable on the compose network and not
      # published: only 8000 is.
      METRICS_HOST: "0.0.0.0"
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}

  # Ticks `domains/sync.py` every SYNC_INTERVAL_SECONDS: Jira -> bronze -> silver -> gold.
  # Its own process because its failure mode is its own: a tick that overruns or dies
  # must not take a request with it.
  # Two replicas are safe: the tick takes a Postgres advisory lock and the loser skips.
  # Out of the default `up` for the same reason as `api`: these are the application, not
  # the infrastructure a dev machine wants in the background. The scheduler ticks every
  # SYNC_INTERVAL_SECONDS and writes gold, which is not something to start by surprise
  # while the tables are being changed. docker compose --profile app up -d
  scheduler:
    build: {context: ., target: app}
    profiles: [app]
    command: python -m mycel.scheduler
    env_file: .env
    # /metrics has no authentication, so what it binds to is what keeps it private.
    # Inside a container all interfaces means "the compose network"; the port is not
    # published, so nothing outside that network can reach it.
    environment:
      <<: *stores
      METRICS_HOST: "0.0.0.0"
    depends_on:
      postgres: {condition: service_healthy}

  # Runs background jobs: sync, transform, report generation.
  # --scale worker=N works without a ceiling here: RabbitMQ hands each message to one
  # consumer, so workers share a queue rather than being capped by a partition count.
  worker:
    build: {context: ., target: app}
    profiles: [app]
    command: python -m mycel.queue.consumer
    env_file: .env
    environment:
      <<: *stores
      METRICS_HOST: "0.0.0.0"
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}

  # Parses and embeds uploaded documents. One replica: docling needs ~3-4 GB of RAM.
  # It exits after ingest_worker_max_jobs documents; `restart` brings it back.
  ingest:
    build: {context: ., target: ingest}
    profiles: [app]
    env_file: .env
    environment:
      <<: *stores
      METRICS_HOST: "0.0.0.0"
    restart: unless-stopped
    mem_limit: 5g
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      minio: {condition: service_healthy}

  # --- Job queue ---
  # RabbitMQ rather than Kafka: a few reports an hour do not need a JVM, a partitioned
  # log or replay. What they do need is one consumer per message, redelivery on crash and
  # a dead-letter queue, which is exactly what a broker gives. Retry/backoff is a
  # dead-letter exchange with a TTL, not a chain of retry topics.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-mycel}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set it in .env}
    ports: ["5672:5672", "15672:15672"]   # AMQP, management UI
    volumes: ["rabbitdata:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  # --- Event stream ---
  # Carries agent events to the browser, which is a different job from the queue above:
  # every open tab wants every event, keyed per run, and nothing needs to be kept once the
  # run is old. Redis Streams gives per-run keys, replay from an id after an F5, and a TTL
  # that cleans up on its own. Not durable state — losing it costs a reload, nothing more.
  #
  # `noeviction`, not `allkeys-lru`: the same instance holds job budgets, and an evicted
  # budget reads back as an untouched ceiling — a silent refund that lets a job spend
  # twice. Every key here carries a TTL, so memory is bounded by expiry rather than by
  # eviction, and a write that would not fit fails loudly instead.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10

  # --- Durable stores ---

  # The one gateway every model call goes through. Models and keys: config/litellm/.
  # The app speaks OpenAI Chat Completions to it; the provider keys never reach the app.
  litellm:
    image: ghcr.io/berriai/litellm@sha256:625981c83410a3ea68eb0697590a57ec1d764d634514d54fa5db0591077ee839
    entrypoint: ["/app/entrypoint.sh"]
    # Only the provider keys, not the whole .env: DATABASE_URL there would make LiteLLM
    # try to use the app's Postgres as its own store, and it needs none.
    environment:
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
      CLAUDE_API_KEYS: ${CLAUDE_API_KEYS:-}
      CLAUDE_PROXY_BASE_URL: ${CLAUDE_PROXY_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_API_KEY:-sk-mycel-dev}
    volumes:
      - ./config/litellm/config.yaml:/app/config.yaml:ro
      - ./config/litellm/models.yaml:/app/models.yaml:ro
      - ./config/litellm/entrypoint.sh:/app/entrypoint.sh:ro
      - ./config/litellm/mycel_callbacks.py:/app/mycel_callbacks.py:ro
    ports: ["4000:4000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 10s
      retries: 12

  # Vector store. Postgres holds the truth, Qdrant holds embeddings.
  qdrant:
    image: qdrant/qdrant:latest
    volumes: ["qdrantdata:/qdrant/storage"]
    ports: ["6333:6333"]   # HTTP + dashboard
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      retries: 10

  # Original uploaded files. S3 API, so real S3 is an endpoint change.
  # Chainguard's build: MinIO stopped publishing images and deleted minio/minio in 2026-09.
  # Pinned by digest: `latest` moves, and a deleted tag is how minio/minio broke last time.
  minio:
    image: cgr.dev/chainguard/minio@sha256:4cf4831a2bbcf13ddca09c1cbcc9faff716dd3c4247e0babc32864b8ee8e0034
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-mycel}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-mycel-dev-secret}
    volumes: ["miniodata:/data"]
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      retries: 10

  # --- Local inference (optional) ---
  # Only runs with the profile enabled: docker compose --profile local-llm up -d
  # Without it, every LLM call goes to the cloud.

  vllm:
    image: vllm/vllm-openai:latest
    profiles: [local-llm]
    command: >
      --model Qwen/Qwen2.5-3B-Instruct-AWQ
      --quantization awq
      --dtype float16
      --max-model-len 4096
      --gpu-memory-utilization 0.85
    ports: ["8001:8000"]
    volumes: ["hfcache:/root/.cache/huggingface"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]

  # --- Observability (optional) ---
  # Traces are not here. The app exports OTLP straight to Langfuse Cloud, which is the
  # backend that actually gets read: it renders an agent run as a tree of calls with their
  # prompts, tokens and cost. A collector would only forward spans, and there is one
  # backend to forward them to.
  #
  # What remains answers different questions — metrics over time, logs across several
  # machines — so it sits behind a profile: docker compose --profile monitoring up -d
  #
  # Every container here has a mem_limit. None of the application services do, and that is
  # deliberate: a leak in one of these is a leak in something watching, and without a
  # ceiling the OOM killer picks a victim by size, which is postgres rather than whatever
  # actually leaked.
  prometheus:
    image: prom/prometheus:latest
    profiles: [monitoring]
    # Fifteen days of samples is the default and more than a dev box has questions for.
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.retention.time=7d"
    volumes: ["./deploy/otel:/etc/prometheus", "promdata:/prometheus"]
    ports: ["9090:9090"]
    mem_limit: 1g

  # Prometheus answers "is something broken" and Loki "why". "Where" is Langfuse's
  # question now, and it is not part of this stack.
  loki:
    image: grafana/loki:latest
    profiles: [monitoring]
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes: ["./deploy/otel:/etc/loki", "lokidata:/loki"]
    ports: ["3100:3100"]
    mem_limit: 512m

  # Collects container stdout and ships it to Loki. The app only prints JSON logs to
  # stdout and sends them nowhere itself.
  promtail:
    image: grafana/promtail:latest
    profiles: [monitoring]
    command: ["-config.file=/etc/promtail/promtail.yaml"]
    volumes:
      - ./deploy/otel:/etc/promtail
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: [loki]
    mem_limit: 128m

  grafana:
    image: grafana/grafana:latest
    profiles: [monitoring]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes: ["./deploy/grafana:/etc/grafana/provisioning"]
    ports: ["3000:3000"]
    depends_on: [prometheus, loki]
    # 512m, not 256m: measured at 196 MiB idle with one dashboard, which leaves no room
    # for a second browser tab. Grafana is the one here that holds rendered state.
    mem_limit: 512m

# pgdata and rabbitdata already exist, filled by containers started by hand before this
# file was usable. Named `external` so compose adopts them rather than creating
# `mycel_pgdata` beside `mycel-pgdata` and starting from an empty database.
volumes:
  pgdata:
    external: true
    name: mycel-pgdata
  rabbitdata:
    external: true
    name: mycel-rabbitdata
  qdrantdata:
  miniodata:
  lokidata:
  promdata:
  hfcache:
