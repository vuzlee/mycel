# Stack dev đầy đủ: app + database + observability.
# Prod dùng cùng file này với image đã build sẵn thay vì build tại chỗ.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mycel
      POSTGRES_PASSWORD: mycel
      POSTGRES_DB: mycel
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mycel"]
      interval: 5s
      retries: 10

  api:
    build: .
    command: uvicorn mycel.api.app:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      minio: {condition: service_healthy}

  scheduler:
    build: .
    command: python -m mycel.scheduler
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}

  # Chạy job nền: sync, transform, sinh báo cáo.
  # --scale worker=N chỉ có tác dụng tới số partition của topic: 3 partition thì
  # worker thứ 4 ngồi không.
  worker:
    build: .
    command: python -m mycel.queue.consumer
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      minio: {condition: service_healthy}

  # --- Hàng đợi job ---
  # KRaft mode: không cần Zookeeper.
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Sinh báo cáo mất vài phút. Mặc định 5 phút là quá ngắn — quá hạn thì
      # Kafka coi worker đã chết, rebalance, và job chạy lại từ đầu.
      KAFKA_MAX_POLL_INTERVAL_MS: 1800000
      # Số partition mặc định = mức scale worker tối đa. Tăng được nhưng không
      # giảm, và tăng thì phá thứ tự theo key.
      KAFKA_NUM_PARTITIONS: 6
    volumes: ["kafkadata:/var/lib/kafka/data"]
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      retries: 10

  # --- Lưu trữ ---

  # Vector store cho tìm kiếm knowledge base. Postgres giữ state giao dịch,
  # Qdrant giữ embedding — hai việc khác nhau, đừng nhét chung.
  qdrant:
    image: qdrant/qdrant:latest
    volumes: ["qdrantdata:/qdrant/storage"]
    ports: ["6333:6333"]   # HTTP + dashboard
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      retries: 10

  # File lớn (PDF nguồn, báo cáo đã render) không nằm trong Postgres:
  # database phình, backup chậm, và mỗi lần đọc phải kéo cả blob qua connection.
  # S3 API nên đổi sang S3 thật sau này chỉ là đổi endpoint.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mycel
      MINIO_ROOT_PASSWORD: mycel-dev-only
    volumes: ["miniodata:/data"]
    ports: ["9000:9000", "9001:9001"]   # API, console
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      retries: 10

  # --- Inference local (tuỳ chọn) ---
  # Chỉ chạy khi bật profile: docker compose --profile local-llm up -d
  # Không bật thì mọi lượt gọi LLM đi cloud.

  vllm:
    image: vllm/vllm-openai:latest
    profiles: [local-llm]
    command: >
      --model Qwen/Qwen2.5-3B-Instruct-AWQ
      --quantization awq
      --dtype float16
      --max-model-len 4096
      --gpu-memory-utilization 0.85
    ports: ["8001:8000"]
    volumes: ["hfcache:/root/.cache/huggingface"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]

  # --- Observability ---

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel/collector.yaml"]
    volumes: ["./deploy/otel:/etc/otel"]
    ports: ["4317:4317"]   # OTLP gRPC

  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes: ["./deploy/otel:/etc/tempo", "tempodata:/var/tempo"]

  prometheus:
    image: prom/prometheus:latest
    command: ["--config.file=/etc/prometheus/prometheus.yaml"]
    volumes: ["./deploy/otel:/etc/prometheus", "promdata:/prometheus"]
    ports: ["9090:9090"]

  # Prometheus trả lời "có đang hỏng không", Tempo "hỏng ở đâu",
  # Loki "hỏng vì sao" — đọc đúng dòng log của trace đó.
  loki:
    image: grafana/loki:latest
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes: ["./deploy/otel:/etc/loki", "lokidata:/loki"]
    ports: ["3100:3100"]

  # Gom log stdout của container rồi đẩy sang Loki. App chỉ cần in log JSON
  # ra stdout, không tự gửi đi đâu cả.
  promtail:
    image: grafana/promtail:latest
    command: ["-config.file=/etc/promtail/promtail.yaml"]
    volumes:
      - ./deploy/otel:/etc/promtail
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: [loki]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes: ["./deploy/grafana:/etc/grafana/provisioning"]
    ports: ["3000:3000"]
    depends_on: [prometheus, tempo, loki]

volumes:
  pgdata:
  kafkadata:
  qdrantdata:
  miniodata:
  lokidata:
  tempodata:
  promdata:
  hfcache:
