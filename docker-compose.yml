# Full dev stack. App services build in place; published images come from release.yml.

# Store addresses inside the compose network; `environment:` outranks the .env localhost ones.
x-stores: &stores
  DATABASE_URL: postgresql://${POSTGRES_USER:-mycel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mycel}
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-mycel}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
  REDIS_URL: redis://redis:6379/0
  REDIS_CACHE_URL: redis://redis:6379/1
  QDRANT_URL: http://qdrant:6333
  S3_ENDPOINT_URL: http://minio:9000
  LITELLM_BASE_URL: http://litellm:4000

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mycel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mycel}
    # 5433 on the host so a local Postgres keeps 5432; DATABASE_URL must agree.
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mycel}"]
      interval: 5s
      retries: 10

  # In dev the API runs on the host; `--profile api` runs it in a container.
  api:
    build: {context: ., target: app}
    profiles: [api]
    # `--factory`: create_app() reads config at call time.
    command: uvicorn --factory mycel.api.app:create_app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      <<: *stores
      # /metrics on 9103, on the compose network only.
      METRICS_HOST: "0.0.0.0"
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}

  # Jira -> bronze -> silver -> gold. An advisory lock makes a second replica skip.
  scheduler:
    build: {context: ., target: app}
    profiles: [app]
    command: python -m mycel.scheduler
    env_file: .env
    # /metrics has no authentication, so what it binds to is what keeps it private.
    environment:
      <<: *stores
      METRICS_HOST: "0.0.0.0"
    depends_on:
      postgres: {condition: service_healthy}

  # Chat jobs. Scales with --scale worker=N.
  worker:
    build: {context: ., target: app}
    profiles: [app]
    command: python -m mycel.queue.consumer
    env_file: .env
    environment:
      <<: *stores
      METRICS_HOST: "0.0.0.0"
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}

  # Parses and embeds uploads. One replica: docling needs 3-4 GB; restarts after N jobs.
  ingest:
    build: {context: ., target: ingest}
    profiles: [app]
    env_file: .env
    environment:
      <<: *stores
      METRICS_HOST: "0.0.0.0"
    restart: unless-stopped
    mem_limit: 5g
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      minio: {condition: service_healthy}

  # --- Job queue ---
  # RabbitMQ rather than Kafka: a few chat turns an hour do not need a JVM, a partitioned
  # log or replay. What they do need is one consumer per message, redelivery on crash and
  # a dead-letter queue, which is exactly what a broker gives. Retry/backoff is a
  # dead-letter exchange with a TTL, not a chain of retry topics.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-mycel}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set it in .env}
    ports: ["5672:5672", "15672:15672"]   # AMQP, management UI
    volumes: ["rabbitdata:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  # --- Event stream ---
  # Carries agent events to the browser, which is a different job from the queue above:
  # every open tab wants every event, keyed per run, and nothing needs to be kept once the
  # run is old. Redis Streams gives per-run keys, replay from an id after an F5, and a TTL
  # that cleans up on its own. Not durable state — losing it costs a reload, nothing more.
  #
  # `noeviction`, not `allkeys-lru`: the same instance holds job budgets, and an evicted
  # budget reads back as an untouched ceiling — a silent refund that lets a job spend
  # twice. Every key here carries a TTL, so memory is bounded by expiry rather than by
  # eviction, and a write that would not fit fails loudly instead.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10

  # --- Stores and gateway ---

  # Every model call goes through here; provider keys never reach the app.
  litellm:
    image: ghcr.io/berriai/litellm@sha256:625981c83410a3ea68eb0697590a57ec1d764d634514d54fa5db0591077ee839
    entrypoint: ["/app/entrypoint.sh"]
    # Provider keys only: DATABASE_URL would make LiteLLM use the app's Postgres.
    environment:
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
      CLAUDE_API_KEYS: ${CLAUDE_API_KEYS:-}
      LITELLM_MASTER_KEY: ${LITELLM_API_KEY:-sk-mycel-dev}
    volumes:
      - ./config/litellm/config.yaml:/app/config.yaml:ro
      - ./config/litellm/models.yaml:/app/models.yaml:ro
      - ./config/litellm/entrypoint.sh:/app/entrypoint.sh:ro
      - ./config/litellm/mycel_callbacks.py:/app/mycel_callbacks.py:ro
    ports: ["4000:4000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 10s
      retries: 12

  # Embeddings; Postgres holds the truth.
  qdrant:
    image: qdrant/qdrant:v1.19.1
    volumes: ["qdrantdata:/qdrant/storage"]
    ports: ["6333:6333"]   # HTTP + dashboard
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      retries: 10

  # Uploaded files, S3 API. Chainguard build pinned by digest: minio/minio images were removed.
  minio:
    image: cgr.dev/chainguard/minio@sha256:4cf4831a2bbcf13ddca09c1cbcc9faff716dd3c4247e0babc32864b8ee8e0034
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-mycel}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-mycel-dev-secret}
    volumes: ["miniodata:/data"]
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      retries: 10

  # --- Local inference (optional) ---
  # Only runs with the profile enabled: docker compose --profile local-llm up -d
  # Without it, every LLM call goes to the cloud.

  vllm:
    image: vllm/vllm-openai:v0.8.5
    profiles: [local-llm]
    command: >
      --model Qwen/Qwen2.5-3B-Instruct-AWQ
      --quantization awq
      --dtype float16
      --max-model-len 4096
      --gpu-memory-utilization 0.85
    ports: ["8001:8000"]
    volumes: ["hfcache:/root/.cache/huggingface"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]

  # --- Observability (optional) ---
  # Traces are not here. The app exports OTLP straight to Langfuse Cloud, which is the
  # backend that actually gets read: it renders an agent run as a tree of calls with their
  # prompts, tokens and cost. A collector would only forward spans, and there is one
  # backend to forward them to.
  #
  # What remains answers different questions — metrics over time, logs across several
  # machines — so it sits behind a profile: docker compose --profile monitoring up -d
  #
  # Every container here has a mem_limit. None of the application services do, and that is
  # deliberate: a leak in one of these is a leak in something watching, and without a
  # ceiling the OOM killer picks a victim by size, which is postgres rather than whatever
  # actually leaked.
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: [monitoring]
    # Fifteen days of samples is the default and more than a dev box has questions for.
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.retention.time=7d"
    volumes: ["./deploy/monitoring:/etc/prometheus", "promdata:/prometheus"]
    ports: ["9090:9090"]
    mem_limit: 1g

  # Traces go to Langfuse, not here.
  loki:
    image: grafana/loki:3.3.2
    profiles: [monitoring]
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes: ["./deploy/helm/mycel/files/loki.yaml:/etc/loki/loki.yaml:ro", "lokidata:/loki"]
    ports: ["3100:3100"]
    mem_limit: 512m

  # Ships container stdout (JSON logs) to Loki.
  promtail:
    image: grafana/promtail:3.3.2
    profiles: [monitoring]
    command: ["-config.file=/etc/promtail/promtail.yaml"]
    volumes:
      - ./deploy/monitoring:/etc/promtail
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: [loki]
    mem_limit: 128m

  grafana:
    image: grafana/grafana:11.5.1
    profiles: [monitoring]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./deploy/helm/mycel/files/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./deploy/helm/mycel/files/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./deploy/helm/mycel/files/mycel.json:/etc/grafana/provisioning/dashboards/mycel.json:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, loki]
    # 512m: 196 MiB idle with one dashboard.
    mem_limit: 512m

# Fixed names so existing volumes are reused.
volumes:
  pgdata:
    name: mycel-pgdata
  rabbitdata:
    name: mycel-rabbitdata
  qdrantdata:
    name: mycel_qdrantdata
  miniodata:
    name: mycel_miniodata
  lokidata:
  promdata:
  hfcache:
