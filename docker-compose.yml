# Stack dev đầy đủ: app + database + observability.
# Prod dùng cùng file này với image đã build sẵn thay vì build tại chỗ.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mycel
      POSTGRES_PASSWORD: mycel
      POSTGRES_DB: mycel
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mycel"]
      interval: 5s
      retries: 10

  api:
    build: .
    command: uvicorn mycel.api.app:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}

  scheduler:
    build: .
    command: python -m mycel.scheduler
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}

  # --- Observability ---

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel/config.yaml"]
    volumes: ["./deploy/otel:/etc/otel"]
    ports: ["4317:4317"]   # OTLP gRPC

  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes: ["./deploy/otel:/etc/tempo"]

  prometheus:
    image: prom/prometheus:latest
    volumes: ["./deploy/otel:/etc/prometheus"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes: ["./deploy/grafana:/etc/grafana/provisioning"]
    ports: ["3000:3000"]
    depends_on: [prometheus, tempo]

volumes:
  pgdata:
