# Full dev stack: app + databases + observability.
# Prod uses this same file with a prebuilt image instead of building in place.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mycel
      POSTGRES_PASSWORD: mycel
      POSTGRES_DB: mycel
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mycel"]
      interval: 5s
      retries: 10

  api:
    build: .
    command: uvicorn mycel.api.app:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      minio: {condition: service_healthy}

  scheduler:
    build: .
    command: python -m mycel.scheduler
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}

  # Runs background jobs: sync, transform, report generation.
  # --scale worker=N only helps up to the topic's partition count: with 3 partitions
  # the 4th worker sits idle.
  worker:
    build: .
    command: python -m mycel.queue.consumer
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      minio: {condition: service_healthy}

  # --- Job queue ---
  # KRaft mode: no Zookeeper needed.
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Generating a report takes minutes. The 5-minute default is too short — exceed it
      # and Kafka considers the worker dead, rebalances, and the job restarts.
      KAFKA_MAX_POLL_INTERVAL_MS: 1800000
      # Default partition count = maximum worker scale. It can be increased but not
      # decreased, and increasing it breaks per-key ordering.
      KAFKA_NUM_PARTITIONS: 6
    volumes: ["kafkadata:/var/lib/kafka/data"]
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      retries: 10

  # --- Storage ---

  # Vector store for knowledge base search. Postgres holds transactional state,
  # Qdrant holds embeddings — two different jobs, do not merge them.
  qdrant:
    image: qdrant/qdrant:latest
    volumes: ["qdrantdata:/qdrant/storage"]
    ports: ["6333:6333"]   # HTTP + dashboard
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      retries: 10

  # Large files (source PDFs, rendered reports) stay out of Postgres: it bloats the
  # database, slows backups, and every read pulls the whole blob through a connection.
  # Using the S3 API means moving to real S3 later is just an endpoint change.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mycel
      MINIO_ROOT_PASSWORD: mycel-dev-only
    volumes: ["miniodata:/data"]
    ports: ["9000:9000", "9001:9001"]   # API, console
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      retries: 10

  # --- Local inference (optional) ---
  # Only runs with the profile enabled: docker compose --profile local-llm up -d
  # Without it, every LLM call goes to the cloud.

  vllm:
    image: vllm/vllm-openai:latest
    profiles: [local-llm]
    command: >
      --model Qwen/Qwen2.5-3B-Instruct-AWQ
      --quantization awq
      --dtype float16
      --max-model-len 4096
      --gpu-memory-utilization 0.85
    ports: ["8001:8000"]
    volumes: ["hfcache:/root/.cache/huggingface"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]

  # --- Observability ---

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel/collector.yaml"]
    volumes: ["./deploy/otel:/etc/otel"]
    ports: ["4317:4317"]   # OTLP gRPC

  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes: ["./deploy/otel:/etc/tempo", "tempodata:/var/tempo"]

  prometheus:
    image: prom/prometheus:latest
    command: ["--config.file=/etc/prometheus/prometheus.yaml"]
    volumes: ["./deploy/otel:/etc/prometheus", "promdata:/prometheus"]
    ports: ["9090:9090"]

  # Prometheus answers "is something broken", Tempo "where", and Loki "why" —
  # reading exactly that trace's log lines.
  loki:
    image: grafana/loki:latest
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes: ["./deploy/otel:/etc/loki", "lokidata:/loki"]
    ports: ["3100:3100"]

  # Collects container stdout and ships it to Loki. The app only prints JSON logs to
  # stdout and sends them nowhere itself.
  promtail:
    image: grafana/promtail:latest
    command: ["-config.file=/etc/promtail/promtail.yaml"]
    volumes:
      - ./deploy/otel:/etc/promtail
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: [loki]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes: ["./deploy/grafana:/etc/grafana/provisioning"]
    ports: ["3000:3000"]
    depends_on: [prometheus, tempo, loki]

volumes:
  pgdata:
  kafkadata:
  qdrantdata:
  miniodata:
  lokidata:
  tempodata:
  promdata:
  hfcache:
