# Full dev stack: app + databases + observability.
# Prod uses this same file with a prebuilt image instead of building in place.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mycel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mycel}
    # 5433 on the host, not 5432: a machine that already runs Postgres for something else
    # keeps the default, and this stack does not fight it for the port. DATABASE_URL in
    # .env names the same number — the two have to agree or nothing connects.
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mycel}"]
      interval: 5s
      retries: 10

  # In development the API runs on the host (`uvicorn --reload`), so it stays out of the
  # default `up`: docker compose --profile api up -d builds and runs it like prod does.
  api:
    build: .
    profiles: [api]
    # `--factory`: there is no module-level `app`. `create_app()` is a factory on purpose,
    # so configuration is chosen at call time rather than frozen at import.
    command: uvicorn --factory mycel.api.app:create_app --host 0.0.0.0 --port 8000
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}

  # Ticks `domains/sync.py` every SYNC_INTERVAL_SECONDS: Telegram -> bronze -> silver ->
  # gold. Its own process because its failure mode is its own — Telegram drops updates
  # after 24 hours, so a scheduler that stays down loses data nothing can replay.
  # Two replicas are safe: the tick takes a Postgres advisory lock and the loser skips.
  # Out of the default `up` for the same reason as `api`: these are the application, not
  # the infrastructure a dev machine wants in the background. The scheduler ticks every
  # SYNC_INTERVAL_SECONDS and writes gold, which is not something to start by surprise
  # while the tables are being changed. docker compose --profile app up -d
  scheduler:
    build: .
    profiles: [app]
    command: python -m mycel.scheduler
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}

  # Runs background jobs: sync, transform, report generation.
  # --scale worker=N works without a ceiling here: RabbitMQ hands each message to one
  # consumer, so workers share a queue rather than being capped by a partition count.
  worker:
    build: .
    profiles: [app]
    command: python -m mycel.queue.consumer
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}

  # --- Job queue ---
  # RabbitMQ rather than Kafka: a few reports an hour do not need a JVM, a partitioned
  # log or replay. What they do need is one consumer per message, redelivery on crash and
  # a dead-letter queue, which is exactly what a broker gives. Retry/backoff is a
  # dead-letter exchange with a TTL, not a chain of retry topics.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-mycel}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set it in .env}
    ports: ["5672:5672", "15672:15672"]   # AMQP, management UI
    volumes: ["rabbitdata:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  # --- Event stream ---
  # Carries agent events to the browser, which is a different job from the queue above:
  # every open tab wants every event, keyed per run, and nothing needs to be kept once the
  # run is old. Redis Streams gives per-run keys, replay from an id after an F5, and a TTL
  # that cleans up on its own. Not durable state — losing it costs a reload, nothing more.
  #
  # `noeviction`, not `allkeys-lru`: the same instance holds job budgets, and an evicted
  # budget reads back as an untouched ceiling — a silent refund that lets a job spend
  # twice. Every key here carries a TTL, so memory is bounded by expiry rather than by
  # eviction, and a write that would not fit fails loudly instead.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10

  # --- Durable stores ---

  # Vector store for knowledge base search. Postgres holds transactional state,
  # Qdrant holds embeddings — two different jobs, do not merge them.
  # Behind a profile until batch 008 fills it: nothing writes a vector yet, so a default
  # `up` would start an empty store and the code would find it present instead of absent
  # — two different things to debug. docker compose --profile vectors up -d
  qdrant:
    image: qdrant/qdrant:latest
    profiles: [vectors]
    volumes: ["qdrantdata:/qdrant/storage"]
    ports: ["6333:6333"]   # HTTP + dashboard
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      retries: 10

  # --- Local inference (optional) ---
  # Only runs with the profile enabled: docker compose --profile local-llm up -d
  # Without it, every LLM call goes to the cloud.

  vllm:
    image: vllm/vllm-openai:latest
    profiles: [local-llm]
    command: >
      --model Qwen/Qwen2.5-3B-Instruct-AWQ
      --quantization awq
      --dtype float16
      --max-model-len 4096
      --gpu-memory-utilization 0.85
    ports: ["8001:8000"]
    volumes: ["hfcache:/root/.cache/huggingface"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]

  # --- Observability (optional) ---
  # Traces are not here. The app exports OTLP straight to Langfuse Cloud, which is the
  # backend that actually gets read: it renders an agent run as a tree of calls with their
  # prompts, tokens and cost. A collector would only forward spans, and there is one
  # backend to forward them to.
  #
  # What remains answers different questions — metrics over time, logs across several
  # machines — and nothing produces that data on a single dev box yet, so it sits behind
  # a profile: docker compose --profile monitoring up -d
  prometheus:
    image: prom/prometheus:latest
    profiles: [monitoring]
    command: ["--config.file=/etc/prometheus/prometheus.yaml"]
    volumes: ["./deploy/otel:/etc/prometheus", "promdata:/prometheus"]
    ports: ["9090:9090"]

  # Prometheus answers "is something broken" and Loki "why". "Where" is Langfuse's
  # question now, and it is not part of this stack.
  loki:
    image: grafana/loki:latest
    profiles: [monitoring]
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes: ["./deploy/otel:/etc/loki", "lokidata:/loki"]
    ports: ["3100:3100"]

  # Collects container stdout and ships it to Loki. The app only prints JSON logs to
  # stdout and sends them nowhere itself.
  promtail:
    image: grafana/promtail:latest
    profiles: [monitoring]
    command: ["-config.file=/etc/promtail/promtail.yaml"]
    volumes:
      - ./deploy/otel:/etc/promtail
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: [loki]

  grafana:
    image: grafana/grafana:latest
    profiles: [monitoring]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes: ["./deploy/grafana:/etc/grafana/provisioning"]
    ports: ["3000:3000"]
    depends_on: [prometheus, loki]

# pgdata and rabbitdata already exist, filled by containers started by hand before this
# file was usable. Named `external` so compose adopts them rather than creating
# `mycel_pgdata` beside `mycel-pgdata` and starting from an empty database.
volumes:
  pgdata:
    external: true
    name: mycel-pgdata
  rabbitdata:
    external: true
    name: mycel-rabbitdata
  qdrantdata:
  lokidata:
  promdata:
  hfcache:
