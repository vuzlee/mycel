# Grafana provisions from files, so this config is versioned with the code rather than
# clicked together by hand.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true

  - name: Tempo
    type: tempo
    uid: tempo
    url: http://tempo:3200
    jsonData:
      # From a span, jump to exactly that trace's log lines.
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true

  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
    jsonData:
      # The reverse direction: from an error log line, click straight through to the trace.
      # trace_id lives in the JSON log body, not a label — as a label its unbounded
      # cardinality would kill Loki's index.
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id"\s*:\s*"([a-f0-9]+)"'
          url: "$${__value.raw}"
          datasourceUid: tempo
