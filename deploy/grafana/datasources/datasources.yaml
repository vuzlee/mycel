# Grafana provision từ file nên cấu hình versioned theo code, không click tay.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true

  - name: Tempo
    type: tempo
    uid: tempo
    url: http://tempo:3200
    jsonData:
      # Từ một span nhảy sang đúng những dòng log của trace đó.
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true

  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
    jsonData:
      # Chiều ngược lại: thấy dòng log lỗi thì bấm thẳng sang trace.
      # trace_id nằm trong nội dung log JSON, không phải label — làm label
      # thì cardinality vô hạn sẽ giết index của Loki.
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id"\s*:\s*"([a-f0-9]+)"'
          url: "$${__value.raw}"
          datasourceUid: tempo
