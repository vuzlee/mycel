# Reads stdout from every container and pushes it to Loki.

server:
  http_listen_port: 9080

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
    pipeline_stages:
      # App logs are JSON already carrying trace_id — extract it so you can jump
      - json:
          expressions:
            level: level
            trace_id: trace_id
            job_id: job_id
      - labels:
          level:
      # trace_id is NOT a label: unbounded cardinality would kill Loki's index.
