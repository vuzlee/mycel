# Loki đơn node, lưu xuống filesystem. Prod thì đổi storage sang S3/MinIO,
# phần còn lại giữ nguyên.

auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore: {store: inmemory}

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index: {prefix: index_, period: 24h}

limits_config:
  # Log của job chạy lâu có thể tới muộn vài phút so với lúc job bắt đầu.
  reject_old_samples: false
