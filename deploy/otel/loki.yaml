# Single-node Loki, stored on the filesystem. In prod, switch storage to S3/MinIO and
# leave the rest as is.

auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore: {store: inmemory}

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index: {prefix: index_, period: 24h}

limits_config:
  # Logs from long-running jobs can arrive minutes after the job started.
  reject_old_samples: false
