# Prometheus scrapes the app directly. There is no collector in between: traces go to
# Langfuse over OTLP, and metrics are the only thing left for this stack to gather.
#
# Nothing is exposing /metrics yet, so a fresh `--profile monitoring` comes up with this
# target down. That is honest: the dashboard is empty because the data does not exist.

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: mycel-api
    static_configs:
      - targets: ["api:8000"]
