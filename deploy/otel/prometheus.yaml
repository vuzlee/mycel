# Prometheus scrapes the three processes directly. There is no collector in between:
# traces go to Langfuse over OTLP, and metrics are the only thing left for this stack to
# gather.
#
# Three targets, not one. The api is where requests arrive, but the worker is where jobs
# run and the scheduler is where syncs run — scrape only the api and the graph stays
# healthy while every job dies.
#
# Every process serves /metrics on a small port of its own, never on the app port; see
# `observability/metrics_server.py`. api 9103, worker 9100, scheduler 9101.

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: mycel-api
    static_configs:
      - targets: ["api:9103"]

  - job_name: mycel-worker
    static_configs:
      - targets: ["worker:9100"]

  - job_name: mycel-scheduler
    static_configs:
      - targets: ["scheduler:9101"]
