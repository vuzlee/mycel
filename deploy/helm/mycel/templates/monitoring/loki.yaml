{{/* Loki: Promtail pushes, Grafana queries. Config in files/loki.yaml, shared with compose. */}}
{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mycel.fullname" . }}-loki
  labels:
    {{- include "mycel.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
data:
  loki.yaml: |
{{ .Files.Get "files/loki.yaml" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  # files/datasources.yaml names http://loki:3100 on both networks.
  name: loki
  labels:
    {{- include "mycel.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3100
      targetPort: http
  selector:
    {{- include "mycel.selectorLabels" (dict "ctx" . "component" "loki") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mycel.fullname" . }}-loki
  labels:
    {{- include "mycel.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mycel.selectorLabels" (dict "ctx" . "component" "loki") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mycel.labels" . | nindent 8 }}
        app.kubernetes.io/component: loki
      annotations:
        # The hash is of the config VALUES, not of this template file: a template that
        checksum/config: {{ toYaml .Values.monitoring | sha256sum }}
    spec:
      containers:
        - name: loki
          image: {{ .Values.monitoring.loki.image }}
          args: [-config.file=/etc/loki/loki.yaml]
          ports:
            - name: http
              containerPort: 3100
          volumeMounts:
            - {name: config, mountPath: /etc/loki}
            - {name: data, mountPath: /loki}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.monitoring.loki.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "mycel.fullname" . }}-loki
        - name: data
          emptyDir: {}
{{- end }}
