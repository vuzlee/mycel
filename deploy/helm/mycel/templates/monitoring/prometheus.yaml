{{/* Prometheus with Kubernetes service discovery; compose names its targets in deploy/monitoring/prometheus.yaml. */}}
{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mycel.fullname" . }}-prometheus
  labels:
    {{- include "mycel.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
data:
  prometheus.yaml: |
    global:
      scrape_interval: {{ .Values.monitoring.prometheus.scrapeInterval }}

    scrape_configs:
      # One job for every app pod; the pod's metrics port says where to scrape.
      - job_name: mycel
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [{{ .Release.Namespace }}]
        relabel_configs:
          # Only this release's app pods; others answer 404 on /metrics.
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
            action: keep
            regex: {{ .Release.Name }}
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            action: keep
            regex: api|worker|scheduler|ingest
          # The port to scrape is the one the pod declares as metrics; the api's http port
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: metrics
          # Carry the component through as a label, so a graph can be split by which process it came from.
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            target_label: component
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
---
apiVersion: v1
kind: Service
metadata:
  # No release prefix: files/datasources.yaml names http://prometheus:9090 on both networks.
  name: prometheus
  labels:
    {{- include "mycel.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9090
      targetPort: http
  selector:
    {{- include "mycel.selectorLabels" (dict "ctx" . "component" "prometheus") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mycel.fullname" . }}-prometheus
  labels:
    {{- include "mycel.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  replicas: 1
  # Recreate: two pods would scrape the same targets twice.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mycel.selectorLabels" (dict "ctx" . "component" "prometheus") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mycel.labels" . | nindent 8 }}
        app.kubernetes.io/component: prometheus
      annotations:
        # The hash is of the config VALUES, not of this template file: a template that
        checksum/config: {{ toYaml .Values.monitoring | sha256sum }}
    spec:
      serviceAccountName: {{ include "mycel.fullname" . }}-prometheus
      containers:
        - name: prometheus
          image: {{ .Values.monitoring.prometheus.image }}
          args:
            - --config.file=/etc/prometheus/prometheus.yaml
            - --storage.tsdb.retention.time={{ .Values.monitoring.prometheus.retention }}
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
          # /-/healthy is the process; /-/ready is "has it finished loading the config and
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.monitoring.prometheus.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "mycel.fullname" . }}-prometheus
        # emptyDir: losing dev samples is fine, a Pending claim is not.
        - name: data
          emptyDir: {}
{{- end }}
