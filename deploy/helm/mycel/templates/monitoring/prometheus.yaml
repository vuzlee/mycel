{{/*
Prometheus: the thing that asks every 15 seconds how each process is doing.

THE WHOLE POINT OF THIS FILE is the scrape config below. The compose version
(`deploy/otel/prometheus.yaml`) names three addresses by hand — `api:8000`, `worker:9100`,
`scheduler:9101`. Those are compose network names: inside the cluster they point nowhere,
which is the break this batch exists to fix.

Here it asks the cluster instead. A pod replaced by a new one with a new IP is found on the
next refresh, and nobody edits anything. That is the property worth having, and it is also
the one to actually test: delete a worker pod and watch the target come back.
*/}}
{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mycel.fullname" . }}-prometheus
  labels:
    {{- include "mycel.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
data:
  prometheus.yaml: |
    global:
      scrape_interval: {{ .Values.monitoring.prometheus.scrapeInterval }}

    scrape_configs:
      # One job, not three. The three processes differ only in which port serves /metrics,
      # and the pod's own labels say which is which — so a fourth service added later is
      # found without touching this file.
      - job_name: mycel
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [{{ .Release.Namespace }}]
        relabel_configs:
          # Only this release's application pods. Without it, Prometheus tries to scrape
          # itself, Loki, Grafana and every pod in the namespace, and most of them answer
          # 404 on /metrics - a wall of red targets that are not actually broken.
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
            action: keep
            regex: {{ .Release.Name }}
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            action: keep
            regex: api|worker|scheduler
          # The port to scrape is the one the pod declares as http or metrics. A pod that
          # declares neither is dropped rather than scraped on a guessed port.
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: http|metrics
          # Carry the component through as a label, so a graph can be split by which
          # process it came from. Prometheus drops every __meta_ label otherwise.
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            target_label: component
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
---
apiVersion: v1
kind: Service
metadata:
  # Named `prometheus` with no release prefix on purpose: Grafana's provisioned datasource
  # in deploy/grafana/ says http://prometheus:9090, and that string is correct on BOTH the
  # compose network and here. One fewer thing that differs between the two.
  name: prometheus
  labels:
    {{- include "mycel.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9090
      targetPort: http
  selector:
    {{- include "mycel.selectorLabels" (dict "ctx" . "component" "prometheus") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mycel.fullname" . }}-prometheus
  labels:
    {{- include "mycel.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  replicas: 1
  # The samples live in the pod. Recreate rather than RollingUpdate, because two
  # Prometheus pods briefly scraping the same targets is two sets of samples for the same
  # instant, and the graph shows it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mycel.selectorLabels" (dict "ctx" . "component" "prometheus") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mycel.labels" . | nindent 8 }}
        app.kubernetes.io/component: prometheus
      annotations:
        # The hash is of the config VALUES, not of this template file: a template that
        # includes itself to hash itself recurses until Helm gives up. 057's Deployments
        # could hash templates/configmap.yaml because that was a different file.
        checksum/config: {{ toYaml .Values.monitoring | sha256sum }}
    spec:
      serviceAccountName: {{ include "mycel.fullname" . }}-prometheus
      containers:
        - name: prometheus
          image: {{ .Values.monitoring.prometheus.image }}
          args:
            - --config.file=/etc/prometheus/prometheus.yaml
            - --storage.tsdb.retention.time={{ .Values.monitoring.prometheus.retention }}
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
          # /-/healthy is the process; /-/ready is "has it finished loading the config and
          # replaying its write-ahead log". Starting that replay can take a while, so a
          # liveness probe on the readiness path would restart a pod that is working.
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.monitoring.prometheus.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "mycel.fullname" . }}-prometheus
        # Deliberately not a PersistentVolumeClaim. Batch 057 left the stateful stores
        # outside the cluster because storage is the painful part, and that reason does not
        # change here: losing seven days of samples on a dev box is not a problem, a claim
        # stuck Pending on the wrong storage class is - nothing runs at all then.
        - name: data
          emptyDir: {}
{{- end }}
