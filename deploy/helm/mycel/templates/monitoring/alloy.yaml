{{/*
Alloy, which replaced Promtail (end of life): it reads pod log files off each node.

In compose it asks the docker daemon over /var/run/docker.sock; a pod has no docker, so
here it reads /var/log/pods. A collector on node A cannot reach a file on node B, so this
is a DaemonSet: one copy per node, and a node added later gets one.

Everything is mounted read-only.
*/}}
{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mycel.fullname" . }}-alloy
  labels:
    {{- include "mycel.labels" . | nindent 4 }}
    app.kubernetes.io/component: alloy
data:
  config.alloy: |
    // Only this node's pods.
    discovery.kubernetes "pods" {
      role = "pod"
      selectors {
        role  = "pod"
        field = "spec.nodeName=" + sys.env("HOSTNAME")
      }
    }

    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
        target_label  = "component"
      }
      // The file path is built from the pod's uid and container name.
      rule {
        source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        target_label  = "__path__"
        replacement   = "/var/log/pods/*$1/*.log"
      }
    }

    local.file_match "pods" {
      path_targets = discovery.relabel.pods.output
    }

    loki.source.file "pods" {
      targets    = local.file_match.pods.targets
      forward_to = [loki.process.app.receiver]
    }

    // The app prints JSON; level becomes a label, trace_id does not.
    loki.process "app" {
      stage.cri {}
      stage.json {
        expressions = { level = "level", trace_id = "trace_id" }
      }
      stage.labels {
        values = { level = "" }
      }
      forward_to = [loki.write.loki.receiver]
    }

    loki.write "loki" {
      endpoint {
        url = "http://loki:3100/loki/api/v1/push"
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "mycel.fullname" . }}-alloy
  labels:
    {{- include "mycel.labels" . | nindent 4 }}
    app.kubernetes.io/component: alloy
spec:
  selector:
    matchLabels:
      {{- include "mycel.selectorLabels" (dict "ctx" . "component" "alloy") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mycel.labels" . | nindent 8 }}
        app.kubernetes.io/component: alloy
      annotations:
        checksum/config: {{ toYaml .Values.monitoring | sha256sum }}
    spec:
      {{- include "mycel.pullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "mycel.fullname" . }}-alloy
      containers:
        - name: alloy
          image: {{ .Values.monitoring.alloy.image }}
          args: [run, --storage.path=/var/lib/alloy, /etc/alloy/config.alloy]
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
          ports:
            - name: http
              containerPort: 12345
          volumeMounts:
            - {name: config, mountPath: /etc/alloy}
            # Read positions; a restart re-sends lines rather than losing them.
            - {name: storage, mountPath: /var/lib/alloy}
            # Both: /var/log/pods holds symlinks into /var/lib/docker/containers.
            - {name: pods, mountPath: /var/log/pods, readOnly: true}
            - {name: containers, mountPath: /var/lib/docker/containers, readOnly: true}
          resources:
            {{- toYaml .Values.monitoring.alloy.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "mycel.fullname" . }}-alloy
        - name: storage
          emptyDir: {}
        - name: pods
          hostPath: {path: /var/log/pods}
        - name: containers
          hostPath: {path: /var/lib/docker/containers}
{{- end }}
