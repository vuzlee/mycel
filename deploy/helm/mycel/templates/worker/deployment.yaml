{{/*
The worker. Scales freely: RabbitMQ hands each message to one consumer, so workers share
a queue rather than being capped by a partition count.

A liveness probe on /metrics, and no readiness probe. Both were once left off and recorded
as debt; the metrics server is the thing that asks /metrics and settles the question.

It is true that a partly hung process still answers /metrics. But a process killed for
memory, or deadlocked in its whole loop, does not — and that is the half kubelet can catch.
The other half, a port open while no job runs, no probe can catch: from outside it is
indistinguishable from an idle worker, and it belongs to an alert on the failed-job count.

No readiness probe, because nothing sends requests here. "Can it take work yet" is a
question about a Service's endpoint list, and a worker is in no Service.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mycel.fullname" . }}-worker
  labels:
    {{- include "mycel.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "mycel.selectorLabels" (dict "ctx" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mycel.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- if .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      {{- end }}
      # A job is acked only after it finishes.
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: {{ include "mycel.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "mycel.queue.consumer"]
          ports:
            - name: metrics
              containerPort: {{ .Values.config.METRICS_PORT | int }}
          # METRICS_HOST is 0.0.0.0 here, outranking the Secret built from the whole of .env,
          {{- include "mycel.env" (dict "ctx" . "metrics" true) | nindent 10 }}
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            # Generous: a job holding the loop for a moment is normal, and a restart in
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
