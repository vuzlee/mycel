{{/*
className comes from values because it is the one thing that differs between clusters:
minikube's addon installs nginx, k3s ships Traefik. The chart is otherwise identical.
*/}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mycel.fullname" . }}
  labels:
    {{- include "mycel.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "mycel.fullname" . }}-api
                port: {name: http}
{{- end }}
