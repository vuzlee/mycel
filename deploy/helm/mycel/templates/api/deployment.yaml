{{/*
The api. The only one of the three with an HTTP port, so the only one with both probes.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mycel.fullname" . }}-api
  labels:
    {{- include "mycel.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "mycel.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mycel.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        # Changing a setting changes this hash, which changes the pod spec, which rolls the pods.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- if .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "mycel.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The Dockerfile has no CMD: all three services share one image and each is told what to be.
          command: ["uvicorn", "--factory", "mycel.api.app:create_app",
                    "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
            # /metrics lives on its own listener, never on the public port.
            - name: metrics
              containerPort: {{ add (.Values.config.METRICS_PORT | int) 3 }}
          {{- include "mycel.env" (dict "ctx" . "metrics" true) | nindent 10 }}
          # Liveness touches nothing outside the process, so a database blip restarts nothing.
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          # Readiness checks Postgres: an unreachable database takes the pod out of the Service.
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
