{{/*
Settings that are not keys.

The split against secret.yaml is one rule: anything that UNLOCKS something is a key and
goes in the Secret. That puts every *_URL here on the other side, because a connection URL
carries the password inside the string itself.

IT IS ALSO A HOOK, and that is not decoration. Helm runs every pre-install hook BEFORE any
ordinary resource, so the migration Job started against a ConfigMap that did not exist yet
and sat in CreateContainerConfigError until it gave up. Declaring this as a hook too, at a
lower weight, puts it in the same ordered phase one step ahead of the Job.

hook-delete-policy is deliberately ONLY before-hook-creation: hook-succeeded would delete
this ConfigMap the moment the migration finished, and the three Deployments mount it.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mycel.fullname" . }}-config
  labels:
    {{- include "mycel.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  # Not in values: inside a container, loopback would mean the metrics port is reachable
  # from that container and nothing else, which is the same as not serving it. All
  # interfaces here means the pod network, and the port is published to nobody.
  METRICS_HOST: "0.0.0.0"
