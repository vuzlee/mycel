{{/*
NOT A TEMPLATE FOR A SECRET — on purpose.

The chart references a Secret by name and never renders one. A rendered Secret would mean
the values live in values.yaml, and values.yaml is in git. `helm template` on this chart
produces no credential of any kind, which is the property worth keeping.

Create it once, outside Helm, straight from the file that already holds these values:

    kubectl create secret generic mycel-secrets --from-env-file=.env

The keys it must carry, and why each one is a key rather than a setting:

  POSTGRES_PASSWORD  RABBITMQ_PASSWORD        passwords
  GEMINI_API_KEYS    CLAUDE_API_KEYS          provider keys, comma-separated
  ANTHROPIC_API_KEY  TAVILY_API_KEY
  LANGFUSE_PUBLIC_KEY LANGFUSE_SECRET_KEY
  JIRA_SERVICE_TOKEN                          what the background sync reads Jira with
  JIRA_CLIENT_SECRET                          the app's own identity to Atlassian
  GOOGLE_CLIENT_SECRET                        the app's own identity to Google
  SMTP_PASSWORD                               the sender's password reset mail goes out on
  TOKEN_ENCRYPTION_KEY                        decrypts every stored refresh token
  DATABASE_URL  RABBITMQ_URL                  a URL embeds its own password
  MIGRATION_DATABASE_URL  MYCEL_APP_PASSWORD  the owner, for migrations; the app role
  REDIS_URL     REDIS_CACHE_URL

The three URLs are the ones to re-read before applying: they must point at
externalStores.host, not at localhost. localhost inside a pod is that pod.
*/}}
