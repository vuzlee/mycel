# Mặc định: đủ để chart chạy được, không hợp với môi trường thật nào.
# Mỗi môi trường đè lên bằng values-<env>.yaml.

image:
  # Registry nội bộ — xem deploy/registry/
  repository: harbor.internal/mycel/mycel
  tag: ""            # CI set = commit SHA. Để trống thì fallback về appVersion
  pullPolicy: IfNotPresent
  pullSecret: harbor-creds

api:
  replicas: 2
  resources:
    requests: {cpu: 200m, memory: 512Mi}
    limits: {memory: 1Gi}
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

worker:
  replicas: 3
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {memory: 2Gi}
  autoscaling:
    enabled: true
    minReplicas: 2
    # KHÔNG vượt số partition của topic: pod thừa sẽ ngồi không.
    maxReplicas: 6
    # Scale theo consumer lag, không theo CPU — worker chờ I/O là chính.
    kafkaLagThreshold: 100

scheduler:
  # Luôn 1. Hai scheduler = mỗi lịch bắn hai lần.
  replicas: 1
  strategy: Recreate

vllm:
  # Tắt mặc định. Bật thì cụm phải có node gắn GPU + device plugin của NVIDIA.
  enabled: false
  gpuCount: 1
  model: Qwen/Qwen2.5-3B-Instruct-AWQ
  # Nạp model mất vài phút — không có startupProbe thì liveness giết pod
  # trước khi nó kịp sẵn sàng, và lặp mãi.
  startupProbe:
    failureThreshold: 60
    periodSeconds: 10

# Kho có state: StatefulSet + PVC, không phải Deployment.
postgres: {enabled: true, storage: 50Gi}
kafka:    {enabled: true, storage: 20Gi, partitions: 6}
qdrant:   {enabled: true, storage: 20Gi}
minio:    {enabled: true, storage: 100Gi}

observability:
  enabled: true
  otlpEndpoint: otel-collector:4317

ingress:
  enabled: true
  host: mycel.internal
