# Defaults: enough to make the chart run, suited to no real environment.
# Each environment overrides them with values-<env>.yaml.
#
# Three things this file does not declare: Kafka, an internal Harbor registry, and
# autoscaling. Kafka left docker-compose.yml long ago, and a template that reads values for
# a system which does not exist renders a deployment of nothing. Autoscaling is a decision
# for a cluster that has load. MinIO came back in 061 as a store outside the cluster.

image:
  # ghcr.io at release time; on minikube the image is loaded into the node's own daemon,
  # so the repository is whatever `minikube image load` was given.
  repository: mycel
  tag: ""            # CI sets this to the commit SHA. Empty falls back to appVersion.
  pullPolicy: IfNotPresent
  # Empty means no imagePullSecret is mounted — correct for a locally loaded image.
  pullSecret: ""

api:
  replicas: 1
  resources:
    requests: {cpu: 200m, memory: 512Mi}
    limits: {memory: 1Gi}

worker:
  replicas: 2
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {memory: 2Gi}

scheduler:
  # Always 1. Two schedulers = every schedule fires twice. The advisory lock in
  # domains/sync.py absorbs most of it; not running two is still the correct fix.
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}

# Parses uploaded documents. Its own image: docling and its models are ~2.5 GB that no other
# pod needs. One replica, because each holds 3-4 GB of native memory.
ingest:
  replicas: 1
  image:
    repository: mycel-ingest
  resources:
    requests: {cpu: 500m, memory: 2Gi}
    limits: {memory: 5Gi}

# The stores stay outside the cluster: Postgres, RabbitMQ, Redis, Qdrant, MinIO and the
# LiteLLM gateway run on the host under docker-compose. StatefulSet + PVC is the painful part of Kubernetes and adds nothing to
# what this chart is meant to prove.
#
# `host` is the address the pods use to reach them. It is EMPTY here on purpose: inside a
# pod `localhost` is that pod, so a DATABASE_URL copied straight from .env looks perfectly
# correct and the pod dies with connection refused to itself. Every environment has to say
# what the host is — values-minikube.yaml uses host.minikube.internal.
externalStores:
  host: ""

# Values that are not keys. Anything that unlocks something lives in the Secret instead;
# see secret.yaml for the split and why a URL counts as a key.
config:
  MYCEL_ENV: prod
  LOG_LEVEL: INFO
  DB_POOL_SIZE: "10"
  RESULT_TTL_SECONDS: "86400"
  EVENT_STREAM_MAX_EVENTS: "1000"
  JOB_CEILING_USD: "0.50"
  SYNC_INTERVAL_SECONDS: "900"
  OTEL_ENABLED: "false"
  OTEL_SERVICE_NAME: mycel
  OTEL_CAPTURE_CONTENT: "false"
  LANGFUSE_BASE_URL: https://jp.cloud.langfuse.com
  METRICS_PORT: "9100"
  JIRA_BASE_URL: ""
  JIRA_PROJECT_KEY: ""
  PUBLIC_BASE_URL: ""
  GOOGLE_CLIENT_ID: ""
  GMAIL_ADDRESS: ""

# The chart only references a Secret by name; the values are created outside git.
# See templates/secret.yaml for how to create it.
secret:
  name: mycel-secrets

ingress:
  enabled: true
  className: nginx
  host: mycel.local

# Migrations run as a pre-install,pre-upgrade hook. pre-upgrade alone means the very first
# --install never migrates and all three pods start against an empty database.
migrations:
  enabled: true

# Measuring and log collection, on the cluster. Off by default, the way compose keeps them
# behind `profiles: [monitoring]`: with this false the chart renders exactly the three
# application pods and nothing else.
#
# Prometheus asks the cluster which pods are alive rather than carrying a typed list of
# addresses, which is why it needs a ServiceAccount at all - see monitoring/rbac.yaml.
# Both it and Loki keep their data in the pod and lose it on restart: a volume claim stuck
# Pending on the wrong storage class costs more than seven days of samples on a dev box.
monitoring:
  enabled: false
  prometheus:
    image: prom/prometheus:v3.1.0
    retention: 7d
    scrapeInterval: 15s
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 1Gi}
  loki:
    image: grafana/loki:3.3.2
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 1Gi}
  promtail:
    image: grafana/promtail:3.3.2
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 256Mi}
  grafana:
    image: grafana/grafana:11.5.1
    # Anonymous admin, the same as compose, and the right default for a cluster reachable
    # only through `minikube ip` plus a hosts entry.
    #
    # FALSE IS THE SETTING FOR ANY HOSTNAME THAT RESOLVES. Grafana admin includes editing
    # the datasources, which hold the addresses of Prometheus and Loki. With it false the
    # pod reads GRAFANA_ADMIN_USER and GRAFANA_ADMIN_PASSWORD from the Secret and refuses
    # to start without them — see templates/monitoring/grafana.yaml for why refusing is
    # better than falling back.
    anonymous: true
    host: grafana.mycel.local
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 512Mi}
