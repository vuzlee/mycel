# Defaults: enough to make the chart run, suited to no real environment.
# Each environment overrides them with values-<env>.yaml.

image:
  # Internal registry — see deploy/registry/
  repository: harbor.internal/mycel/mycel
  tag: ""            # CI sets this to the commit SHA. Empty falls back to appVersion
  pullPolicy: IfNotPresent
  pullSecret: harbor-creds

api:
  replicas: 2
  resources:
    requests: {cpu: 200m, memory: 512Mi}
    limits: {memory: 1Gi}
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

worker:
  replicas: 3
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {memory: 2Gi}
  autoscaling:
    enabled: true
    minReplicas: 2
    # Do NOT exceed the topic's partition count: surplus pods sit idle.
    maxReplicas: 6
    # Scale on consumer lag, not CPU — workers are mostly waiting on I/O.
    kafkaLagThreshold: 100

scheduler:
  # Always 1. Two schedulers = every schedule fires twice.
  replicas: 1
  strategy: Recreate

vllm:
  # Off by default. Enabling it requires GPU nodes plus NVIDIA's device plugin.
  enabled: false
  gpuCount: 1
  model: Qwen/Qwen2.5-3B-Instruct-AWQ
  # Loading the model takes minutes — without a startupProbe, liveness kills the pod
  # before it is ready, forever.
  startupProbe:
    failureThreshold: 60
    periodSeconds: 10

# Stateful stores: StatefulSet + PVC, not Deployment.
postgres: {enabled: true, storage: 50Gi}
kafka:    {enabled: true, storage: 20Gi, partitions: 6}
qdrant:   {enabled: true, storage: 20Gi}
minio:    {enabled: true, storage: 100Gi}

observability:
  enabled: true
  otlpEndpoint: otel-collector:4317

ingress:
  enabled: true
  host: mycel.internal
