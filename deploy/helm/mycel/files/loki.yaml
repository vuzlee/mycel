# Single-node Loki on the filesystem. In production, switch storage to S3 and keep the rest.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore: {store: inmemory}

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index: {prefix: index_, period: 24h}

limits_config:
  # Long-running jobs push their first lines minutes late.
  reject_old_samples: false
  allow_structured_metadata: false

compactor:
  working_directory: /loki/compactor
