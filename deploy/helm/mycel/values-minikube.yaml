# Overrides values.yaml for a local minikube cluster.

# `minikube image load mycel:dev` puts the image in the node's own docker daemon, so there
image:
  repository: mycel
  tag: dev
  pullPolicy: Never

api:       {replicas: 1}
worker:    {replicas: 1}

# How pods reach the stores in compose on the host.
externalStores:
  host: host.minikube.internal

config:
  MYCEL_ENV: dev
  LOG_LEVEL: DEBUG
  PUBLIC_BASE_URL: http://mycel.local

ingress:
  className: nginx
  host: mycel.local
