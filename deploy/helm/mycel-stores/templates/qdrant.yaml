{{- $c := dict "ctx" . "name" "qdrant" -}}
{{ include "stores.deploymentHead" $c }}
      containers:
        - name: qdrant
          image: {{ .Values.qdrant.image }}
          ports: [{name: http, containerPort: 6333}]
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          volumeMounts: [{name: data, mountPath: /qdrant/storage}]
          resources:
            {{- toYaml .Values.qdrant.resources | nindent 12 }}
      volumes: [{name: data, emptyDir: {}}]
---
{{ include "stores.service" (merge (dict "ports" (list (list "http" 6333))) $c) }}
