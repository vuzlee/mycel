{{/* MinIO. The app makes its bucket on first use, so no setup step. */}}
{{- $c := dict "ctx" . "name" "minio" -}}
{{ include "stores.deploymentHead" $c }}
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: {{ .Values.secret.name }}, key: S3_ACCESS_KEY}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.secret.name }}, key: S3_SECRET_KEY}}
          ports:
            - {name: s3, containerPort: 9000}
            - {name: console, containerPort: 9001}
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: s3}
            periodSeconds: 5
          volumeMounts: [{name: data, mountPath: /data}]
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
      volumes: [{name: data, emptyDir: {}}]
---
{{ include "stores.service" (merge (dict "ports" (list (list "s3" 9000) (list "console" 9001))) $c) }}
