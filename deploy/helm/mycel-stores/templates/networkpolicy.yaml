{{/*
Stores accept only pods labelled part-of mycel or named mycel (the app chart's pods),
in this namespace. Enforced only where the CNI implements NetworkPolicy (EKS with the
VPC CNI's policy agent on; not minikube's default).
*/}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mycel-stores
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: mycel
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: mycel
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mycel
{{- end }}
