apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mycel-prod
  namespace: argocd
spec:
  project: mycel
  source:
    repoURL: https://git.internal/mycel.git
    targetRevision: main
    path: deploy/helm/mycel
    helm:
      valueFiles: [values.yaml, values-prod.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: mycel-prod
  # Prod does NOT auto-sync: a human presses the button, while well rested.
  # selfHeal is off too — during an incident you still want to hotfix with kubectl.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      # Never prune stateful resources in prod. Losing Postgres's PVC to one wrong
      # line in values is an accident git cannot undo.
      - PrunePropagationPolicy=foreground
