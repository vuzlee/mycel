apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mycel
  namespace: argocd
spec:
  description: Mycel — multi-source reporting

  # Scoped so a misconfigured Application cannot reach anywhere else.
  sourceRepos:
    - https://git.internal/mycel.git
  destinations:
    - {server: https://kubernetes.default.svc, namespace: mycel-staging}
    - {server: https://kubernetes.default.svc, namespace: mycel-prod}

  # This chart creates no cluster-scoped resources.
  clusterResourceWhitelist: []
