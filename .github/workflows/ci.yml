name: CI

on:
  push: {branches: [main]}
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: mycel, POSTGRES_PASSWORD: mycel, POSTGRES_DB: mycel_test}
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
        ports: ["5432:5432"]
      # The broker and Redis are here so `test_queue_live.py` and `test_end_to_end.py` run
      rabbitmq:
        image: rabbitmq:3-alpine
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-retries 20
        ports: ["5672:5672"]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
        ports: ["6379:6379"]
      # So `test_vectors_live.py` runs against a real index rather than skipping.
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports: ["6333:6333"]
    env:
      DATABASE_URL: postgresql://mycel:mycel@localhost:5432/mycel_test
      RABBITMQ_URL: amqp://guest:guest@localhost:5672/
      REDIS_URL: redis://localhost:6379/0
      QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        # The image runs 3.11 (Dockerfile); the runner's default is newer. uv matches the image.
        with: {python-version: "3.11", version: "0.8.0"}
      # Not the ingest group: docling is ~2.5 GB and no test here parses a document.
      - run: uv sync --locked --no-group ingest

      - name: Lint
        run: uv run ruff check .

      # Nothing else runs the shell scripts, so a broken one reaches main unseen.
      - name: Scripts parse
        run: for f in scripts/*.sh scripts/*/*.sh; do bash -n "$f" || exit 1; done

      # The image installs no dev group, so import every entry point without it.
      - name: Imports with production dependencies only
        run: |
          uv venv /tmp/prod --python 3.11
          VIRTUAL_ENV=/tmp/prod uv sync --locked --no-default-groups --active
          /tmp/prod/bin/python -c "import mycel.api.app, mycel.queue.consumer, mycel.scheduler, mycel.doctor"


      - name: Type check
        run: uv run mypy

      - name: Migrations apply cleanly
        run: uv run alembic upgrade head

      # `--cov` carries its own floor from pyproject: a change that guts a tested module
      - name: Test
        run: uv run pytest --cov

  # The frontend's type check; no database needed.
  web:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

# No eval job: evals call real models, cost quota, and need the LiteLLM gateway, a model
