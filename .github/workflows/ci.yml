name: CI

on:
  push: {branches: [main]}
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: mycel, POSTGRES_PASSWORD: mycel, POSTGRES_DB: mycel_test}
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgresql://mycel:mycel@localhost:5432/mycel_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Migrations apply cleanly
        run: uv run alembic upgrade head

      - name: Test
        run: uv run pytest

  # The frontend's `mypy`. A separate job rather than a step in `check`: it needs Node and
  # no database, and a Python-only change should not wait on an npm install.
  web:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  # Evals cost money (they call the real model), so only run when a PR touches
  # prompts or the llm layer.
  evals:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: changed
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -qE '^(src/mycel/(agents|llm)/|evals/)' && echo "run=true" >> $GITHUB_OUTPUT || true
      - uses: astral-sh/setup-uv@v5
        if: steps.changed.outputs.run == 'true'
      - name: Golden set
        if: steps.changed.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv sync && uv run python -m evals.run --compare-baseline
