name: CI

on:
  push: {branches: [main]}
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: mycel, POSTGRES_PASSWORD: mycel, POSTGRES_DB: mycel_test}
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
        ports: ["5432:5432"]
      # The broker and Redis are here so `test_queue_live.py` and `test_end_to_end.py` run
      # rather than skip. They skip silently without one, which reads as a green suite.
      rabbitmq:
        image: rabbitmq:3-alpine
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-retries 20
        ports: ["5672:5672"]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://mycel:mycel@localhost:5432/mycel_test
      RABBITMQ_URL: amqp://guest:guest@localhost:5672/
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Migrations apply cleanly
        run: uv run alembic upgrade head

      # `--cov` carries its own floor from pyproject: a change that guts a tested module
      # fails here rather than in a review nobody ran.
      - name: Test
        run: uv run pytest --cov

  # The frontend's `mypy`. A separate job rather than a step in `check`: it needs Node and
  # no database, and a Python-only change should not wait on an npm install.
  web:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  # Evals cost money (they call the real model), so only run when a PR touches
  # prompts or the llm layer.
  evals:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: changed
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -qE '^(src/mycel/(agents|llm)/|evals/)' && echo "run=true" >> $GITHUB_OUTPUT || true
      - uses: astral-sh/setup-uv@v5
        if: steps.changed.outputs.run == 'true'
      - name: Golden set
        if: steps.changed.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv sync && uv run python -m evals.run --compare-baseline
