name: Release

# Build image một lần, tag bằng commit SHA. Mọi môi trường deploy đúng image đó -
# không build lại, nên staging và prod chạy cùng bytes.

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      # Token Docker Hub scope Read & Write, lưu ở repo secrets.
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # type=gha cache needs the docker-container driver; the default docker
      # driver cannot export cache.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mycel:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/mycel:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
