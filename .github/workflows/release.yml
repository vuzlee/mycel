name: Release

# Build both images once, tagged by commit SHA: `mycel` (api, worker, scheduler) and
# `mycel-ingest` (docling). Nothing deploys yet; the chart job checks the tag reaches them.

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      # Docker Hub token with Read & Write scope, stored in repo secrets.
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # type=gha cache needs the docker-container driver; the default docker driver cannot export cache.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          target: app
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mycel:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/mycel:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          target: ingest
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mycel-ingest:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/mycel-ingest:latest
          cache-from: type=gha,scope=ingest
          cache-to: type=gha,mode=max,scope=ingest

  # Render the chart against the image this run just built. It is not a deploy — there is
  # no cluster outside a developer's laptop to deploy to, and CI cannot reach a minikube —
  # but it is the half of a deploy that can fail for a reason worth catching: a template
  # that only renders because of a value nobody set in CI, or an image tag that does not
  # reach the containers.
  #
  # When a cluster exists, this job grows a kubeconfig and the last line becomes
  # `helm upgrade --install`. Everything above it stays.
  chart:
    runs-on: ubuntu-latest
    needs: image
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Lint
        run: helm lint deploy/helm/mycel -f deploy/helm/mycel/values-minikube.yaml

      # The stores host is the one value every environment must name; without it the chart
      - name: Refuses to render without a stores host
        run: |
          if helm template mycel deploy/helm/mycel --set image.tag=${{ github.sha }} > /dev/null 2>&1; then
            echo "rendered with no externalStores.host"; exit 1
          fi

      # No `-f values-minikube.yaml`: apart from the host, the defaults have to render on
      - name: Renders on the defaults
        run: |
          helm template mycel deploy/helm/mycel \
            --set image.tag=${{ github.sha }} \
            --set externalStores.host=stores.internal > /dev/null

      - name: Renders with measuring and logs on
        run: |
          helm template mycel deploy/helm/mycel \
            --set image.tag=${{ github.sha }} \
            --set externalStores.host=stores.internal \
            --set monitoring.enabled=true > /tmp/rendered.yaml

      # The chart references a Secret by name and renders none.
      - name: No credential in the rendered output
        run: |
          if grep -nE '^\s+(password|secret|token|api_key):' /tmp/rendered.yaml; then
            echo "a rendered manifest carries a credential"; exit 1
          fi
          echo "nothing rendered that is worth stealing"

      # The tag has to reach every container, not just the first.
      - name: The built image reaches every container
        run: |
          expected=$(grep -cE '^\s+image: mycel(-ingest)?:' /tmp/rendered.yaml || true)
          actual=$(grep -cE "^\s+image: mycel(-ingest)?:${{ github.sha }}$" /tmp/rendered.yaml || true)
          echo "$actual of $expected mycel images carry this commit"
          [ "$expected" = "$actual" ] && [ "$actual" != "0" ]
