name: Release

# Build the image once, tagged by commit SHA. Every environment deploys that exact
# image instead of rebuilding, so staging and prod run identical bytes.

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      # Docker Hub token with Read & Write scope, stored in repo secrets.
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # type=gha cache needs the docker-container driver; the default docker
      # driver cannot export cache.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mycel:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/mycel:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
