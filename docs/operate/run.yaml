page:
  eyebrow: Operate
  title: Run and fix it
  lede: ["Every command goes through `scripts/stack.sh`", "When something is wrong, run doctor first"]
tables:
  - title: Start and stop
    head: [Mode, Command, What runs where]
    rows:
      - ["dev", "`scripts/stack.sh dev up` · `down` · `status` · `logs <name>`", "app on your machine, stores in docker compose"]
      - ["compose", "`scripts/stack.sh compose up [monitoring]`", "everything in containers"]
      - ["k8s", "`scripts/stack.sh k8s build` · `up` · `secret` (loads `.env` as a Secret)", "the Helm chart on minikube; stores stay on the host"]
      - ["k8s, stores inside", "`scripts/stack.sh k8s build` · `stores-up`", "both charts on minikube with `values-aws.yaml`: what EKS runs, tried at $0"]
      - ["first time", "`docs/operate/setup.html`", "OAuth apps, `.env`, gateway key"]
  - title: Everyday commands
    head: [Command, Does]
    rows:
      - ["`scripts/stack.sh doctor`", "what is set up, what is broken, what is off on purpose"]
      - ["`scripts/stack.sh sync [--refetch]`", "one Jira sync now; `--refetch` reads everything again"]
      - ["`scripts/stack.sh replay [jobs.dlq N]`", "count parked jobs, or send N back"]
      - ["`scripts/stack.sh gateway-key [usd]`", "a new capped key for the app (default $10 / 30 days)"]
      - ["`uv run alembic upgrade head`", "apply database migrations"]
      - ["`uv run pytest -q`", "tests — only ever on the `mycel_test` database"]
  - title: Something is wrong
    head: [You see, Likely cause, Check, Fix]
    rows:
      - ["page will not load", "api not running", "`scripts/stack.sh dev status`", "`scripts/stack.sh dev up`"]
      - ["question never answers", "worker down, or job parked", "`scripts/stack.sh replay`", "start the worker; replay the dead-letter queue"]
      - ["\"model error\" on every answer", "gateway down, or its key over $10", "doctor: `litellm`, `upstreams`", "restart litellm; `gateway-key`"]
      - ["dashboard empty", "nobody connected Jira, or sync failing", "doctor: `jira` line", "connect Jira; `sync --refetch`"]
      - ["issues missing from answers", "the last sync failed", "doctor: last sync", "fix the error; the next run lifts what was left, or `sync --refetch`"]
      - ["document stuck on parsing", "ingest worker not running", "`scripts/stack.sh dev logs ingest`", "start it; the watchdog fails it after 10 min"]
      - ["signed out unexpectedly", "14 days without use; a domain removed from the list refuses its existing accounts on their next sign-in", "`REGISTRATION_ALLOWED_DOMAINS`", "sign in again"]
      - ["Connect button missing", "plugin client not in `.env`", "doctor: PLUGINS group", "set `<KEY>_CLIENT_ID` / `_SECRET`"]
      - ["a pod dies at start: `rabbitmq_port` not an integer", "Kubernetes adds `<SERVICE>_PORT=tcp://…` for every Service; one clashed with the RabbitMQ port setting", "`kubectl logs <pod>`", "`enableServiceLinks: false` stops Kubernetes adding them (already set in both charts)"]
      - ["docs figure looks wrong", "code changed since the figure", "`uv run python docs/tools/check.py`", "fix the YAML, run `page.py`"]
files:
  - ["every command", "scripts/stack.sh"]
  - ["dev", "scripts/dev/up.sh"]
  - ["compose", "scripts/compose/up.sh"]
  - ["k8s", "scripts/k8s/up.sh"]
  - ["AWS", "scripts/aws/up.sh"]
  - ["doctor", "scripts/ops/doctor.sh"]
  - ["sync", "scripts/ops/sync.sh"]
  - ["replay", "scripts/ops/replay.sh"]
related:
  - [Architecture, ../overview/architecture.html]
  - [Job failures, ../flows/job-failures.html]
  - ["Traces, metrics, logs, events", ../flows/observe.html]
  - ["On AWS", aws.html]
words:
  - ["stack.sh", "the one script every start, stop and check goes through"]
  - ["dev · compose · k8s", "app on the host · all in containers · on minikube"]
  - ["doctor", "checks each part is up; run it first"]
  - ["stores", "Postgres, RabbitMQ, Redis, Qdrant, MinIO, LiteLLM"]
  - ["minikube", "a one-machine Kubernetes on your laptop"]
  - ["Helm chart", "an install package for Kubernetes; two here: the app and the stores"]
  - ["pod · Service", "one running copy of a program · the fixed name pods reach it by"]
  - ["watchdog", "a timer that fails documents stuck in parsing"]
  - ["upstreams", "the model providers the gateway calls"]
