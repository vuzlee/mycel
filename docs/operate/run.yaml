page:
  eyebrow: Operate
  title: Run and fix it
  lede: ["Every command goes through `scripts/stack.sh`", "When something is wrong, run doctor first"]
  why: ['One script for every start, stop and check, so dev, compose and Kubernetes behave alike', 'doctor first: most problems are a store not up or a key not set']
tables:
  - title: Start and stop
    head: [Mode, Command, What runs where]
    rows:
      - ["dev", "`scripts/stack.sh dev up` · `down` · `status` · `logs <name>`", "app on your machine, stores in docker compose"]
      - ["compose", "`scripts/stack.sh compose up [monitoring]`", "everything in containers"]
      - ["k8s", "`scripts/stack.sh k8s build` · `up` · `secret` (loads `.env` as a Secret)", "the Helm chart on minikube; stores stay on the host"]
      - ["k8s, stores inside", "`scripts/stack.sh k8s build` · `stores-up`", "both charts on minikube with `values-aws.yaml`: what EKS runs, tried at $0"]
      - ["first time", "`docs/operate/setup.html`", "OAuth apps, `.env`, gateway key"]
  - title: Everyday commands
    head: [Command, Does]
    rows:
      - ["`scripts/stack.sh doctor`", "what is set up, what is broken, what is off on purpose"]
      - ["`scripts/stack.sh sync [--refetch]`", "one Jira sync now; `--refetch` reads everything again"]
      - ["`scripts/stack.sh replay [jobs.dlq N]`", "count parked jobs, or send N back"]
      - ["`scripts/stack.sh gateway-key [usd]`", "a new capped key for the app (default $10 / 30 days)"]
      - ["`uv run alembic upgrade head`", "apply database migrations"]
      - ["`uv run pytest -q`", "tests — only ever on the `mycel_test` database"]
  - title: Something is wrong
    head: [You see, Likely cause, Check, Fix]
    rows:
      - ["page will not load", "api not running", "`scripts/stack.sh dev status`", "`scripts/stack.sh dev up`"]
      - ["question never answers", "worker down, or job parked", "`scripts/stack.sh replay`", "start the worker; replay the dead-letter queue"]
      - ["\"model error\" on every answer", "gateway down, or its key over $10", "doctor: `litellm`, `upstreams`", "restart litellm; `gateway-key`"]
      - ["dashboard empty", "nobody connected Jira, or sync failing", "doctor: `jira` line", "connect Jira; `sync --refetch`"]
      - ["issues missing from answers", "the last sync failed", "doctor: last sync", "fix the error; the next run lifts what was left, or `sync --refetch`"]
      - ["document stuck on parsing", "ingest worker not running", "`scripts/stack.sh dev logs ingest`", "start it; the watchdog (a scheduler timer) fails it after 10 min"]
      - ["signed out unexpectedly", "14 days without use", "—", "sign in again"]
      - ["refused at sign-in", "the domain was removed from `REGISTRATION_ALLOWED_DOMAINS`", "`.env`", "add it back"]
      - ["Connect button missing", "plugin client not in `.env`", "doctor: PLUGINS group", "set `<KEY>_CLIENT_ID` / `_SECRET`"]
      - ["a pod dies at start: `rabbitmq_port` not an integer", "Kubernetes adds `<SERVICE>_PORT=tcp://…` for every Service; one clashed with the RabbitMQ port setting", "`kubectl logs <pod>`", "`enableServiceLinks: false` stops Kubernetes adding them (already set in both charts)"]
      - ["docs figure looks wrong", "code changed since the figure", "`uv run python docs/tools/check.py`", "fix the YAML, run `page.py`"]
  - title: Ports on this machine (dev, compose)
    head: [Port, Service, What it is]
    rows:
      - ["8000", "api", "FastAPI: `/app`, `/chat`, `/health`"]
      - ["5433", "postgres", "PostgreSQL 16; 5433 so a local Postgres keeps 5432; tests use `mycel_test` here"]
      - ["5672 · 15672", "rabbitmq", "AMQP · management UI"]
      - ["6379 · 6380", "redis · redis-cache", "live events, job status, budgets · cached answers and tokens, evicts when full"]
      - ["4000", "litellm", "model gateway"]
      - ["6333", "qdrant", "HTTP + dashboard"]
      - ["9000 · 9001", "minio", "S3 API · console"]
      - ["8001", "vllm", "own model on the LAN; compose profile only"]
      - ["9100–9103", "worker · scheduler · ingest · api", "`/metrics`"]
      - ["9090 · 9093 · 3100 · 3000", "prometheus · alertmanager · loki · grafana", "monitoring profile only"]
  - title: If the state Redis (6379) restarts
    head: [Lost, What happens]
    rows:
      - ["job results, event streams", "nothing visible: pages fall back to `app.turn` in Postgres"]
      - ["job budgets", "a job retried afterwards starts with a full ceiling"]
      - ["delivery counts, claims", "a job that kills its worker starts its count over (4 more tries); a duplicate could run once more"]
      - ["rate-limit windows", "every limit starts over"]
      - ["unconfirmed write drafts (calendar, Jira)", "the person asks the agent for the change again"]
      - ["cache Redis (6380)", "can be flushed any time; costs only recomputation"]
  - title: Silent traps — wrong, but no error
    head: [Trap, What happens, Where]
    rows:
      - ["`BaseHTTPMiddleware` on SSE", "it holds the whole reply, so live steps arrive in one lump at the end; ours is plain ASGI", "src/mycel/api/middleware.py"]
      - ["trace lost between processes", "a worker starts a fresh trace unless the job carries it in its headers (`inject()` · `extract()`)", "src/mycel/queue/context.py"]
      - ["tracing set up too late", "set up after the web app is wrapped, spans go nowhere", "src/mycel/observability/tracing.py"]
      - ["budget counted in the wrong place", "sub-agents must pass `usage=ctx.usage`; only the runner charges, or one job is billed several times", "src/mycel/agents/core/runner.py"]
      - ["database pool sized per process", "Postgres limits connections across all processes; it fails only under load", "src/mycel/infra/postgres/engine.py"]
      - ["a hung pod with an open port", "looks healthy; restarts are only as good as the probes", "deploy/helm/mycel/templates/api/deployment.yaml"]
files:
  - ["every command", "scripts/stack.sh"]
  - ["dev", "scripts/dev/up.sh"]
  - ["compose", "scripts/compose/up.sh"]
  - ["k8s", "scripts/k8s/up.sh"]
  - ["AWS", "scripts/aws/up.sh"]
  - ["doctor", "scripts/ops/doctor.sh"]
  - ["sync", "scripts/ops/sync.sh"]
  - ["replay", "scripts/ops/replay.sh"]
related:
  - [Architecture, ../overview/architecture.html]
  - [Job failures, ../flows/job-failures.html]
  - ["Traces and metrics", ../flows/observe.html]
  - ["On AWS", aws.html]
words: [stack.sh, dev · compose · k8s, doctor, dead-letter queue, Kubernetes · pod, Helm chart]
