page:
  eyebrow: Operate
  title: First-time setup
  lede: ["An admin does it once per deployment; each person then connects their own accounts", "`.env` holds only what hosting needs — nothing belongs to one person"]
  why: [Mycel signs people in and reads their accounts through OAuth apps registered once per deployment, Secrets for the host only; each person's tokens come from their own consent]
tables:
  - title: 1 · Jira OAuth app, for "Connect Jira"
    head: [Step, Where, Do]
    rows:
      - ["1", "developer.atlassian.com/console/myapps", "Create → OAuth 2.0 integration"]
      - ["2", "Permissions → Jira API", "`read:jira-work`, `read:jira-user`, `write:jira-work`, `offline_access`; with `jira_manage_sprints` on (dev) also `read:board-scope:jira-software`, `read:sprint:jira-software`, `write:sprint:jira-software`; with `jira_allow_create_project` also `manage:jira-project`"]
      - ["3", "Authorization", "callback `<PUBLIC_BASE_URL>/auth/jira/callback`"]
      - ["4", "Settings → `.env`", "`JIRA_CLIENT_ID`, `JIRA_CLIENT_SECRET`"]
  - title: 2 · Google OAuth client, for "Connect Google"
    head: [Step, Where, Do]
    rows:
      - ["1", "console.cloud.google.com", "a project; enable Google Calendar API and Gmail API"]
      - ["2", "OAuth consent screen", "scopes `openid`, `email`, `calendar.events`, `gmail.readonly`"]
      - ["3", "Credentials → OAuth client ID → Web", "redirect `<PUBLIC_BASE_URL>/auth/google/callback`"]
      - ["4", "`.env`", "`GOOGLE_CLIENT_ID`, `GOOGLE_CLIENT_SECRET`"]
  - title: 3 · Models
    head: [Step, Do]
    rows:
      - ["edit", "`config/litellm/models.yaml` (in git, no keys); keep the providers you have"]
      - ["list", "`host_models` in `config/environments/base.yaml`: the names people may pick; exactly one `default: true`"]
      - ["keys", "`DEFAULT_MODEL_API_KEY=a,b` in `.env`; the gateway splits it into `_1`, `_2`"]
      - ["gateway key", "set `LITELLM_MASTER_KEY` in `.env`, start the stack (compose), then `scripts/stack.sh gateway-key`; paste the line it prints into `.env` as `LITELLM_API_KEY`. Without it every answer fails"]
  - title: 4 · The rest of .env
    head: [Key, What]
    rows:
      - ["`TOKEN_ENCRYPTION_KEY`", "encrypts every stored refresh token; `python -c \"from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())\"`; to rotate, put the new key first, comma, the old one; replacing it disconnects everyone"]
      - ["`SMTP_HOST` · `SMTP_FROM` · `SMTP_USERNAME` · `SMTP_PASSWORD`", "sender of the sign-in code mail (Gmail: `smtp.gmail.com` + an app password); unset → only Google sign-in, the doctor MAIL line says so"]
      - ["`PUBLIC_BASE_URL`", "in `config/environments/`; the address people reach the app at; every OAuth callback is built from it"]
  - title: 5 · Start and check
    head: [Command, Does]
    rows:
      - ["`scripts/stack.sh dev up`", "or `compose` / `k8s`; see Run and fix it"]
      - ["`scripts/stack.sh doctor`", "what is set, what is broken, what is off"]
  - title: Each person, after setup
    head: [In the app, What happens]
    rows:
      - ["Settings → Connect Jira", "shows exactly the projects you may browse; asked again every sync, so a lost project leaves within 15 min"]
      - ["Settings → Connect Google", "your own calendar and mail, nobody else's"]
      - ["not connected", "no Jira, calendar or mail; your own documents still work"]
  - title: Not supported yet
    head: [What, Why]
    rows:
      - ["Jira Server / Data Center", "only Atlassian Cloud OAuth is built"]
      - ["per-issue permissions", "Jira issue security is ignored; access is per project"]
files:
  - ["Jira OAuth", "src/mycel/plugins/jira/oauth.py"]
  - ["Google OAuth", "src/mycel/plugins/google/oauth.py"]
  - ["models", "config/litellm/models.yaml"]
  - ["default model", "config/environments/base.yaml"]
  - ["settings read", "src/mycel/core/config.py"]
  - ["gateway key", "scripts/ops/gateway-key.sh"]
  - ["checks", "scripts/ops/doctor.sh"]
