page:
  eyebrow: Change
  title: Add a plugin
  lede: ["A provider each person connects, e.g. GitHub", "One folder: client, consent, plugin; one registry line"]
  why: [One folder per provider keeps the core free of provider code, 'Copy Jira: the shared consent, sealing and registry already work']
steps:
  - ["1", "src/mycel/core/config.py", "`<key>_client_id`, `<key>_client_secret`; a line in `.env.example`"]
  - ["2", "src/mycel/plugins/jira/client.py", "`plugins/<key>/client.py`: the provider's REST calls on one person's token; raise `SourceError` / `NotWritten` from `plugins/errors.py`"]
  - ["3", "src/mycel/plugins/jira/oauth.py", "copy into `plugins/<key>/oauth.py`: an `OAuthProvider` (from `services/oauth.py`), connect, token_for"]
  - ["4", "src/mycel/infra/postgres/models/app.py", "an `<key>_account` table next to `jira_account`, a migration, and its upsert/get methods in `repositories/accounts.py`: the sealed refresh token per person"]
  - ["5", "src/mycel/plugins/jira/plugin.py", "copy into `plugins/<key>/plugin.py`: every `Plugin` member, then `PLUGIN = …()`"]
  - ["6", "src/mycel/plugins/jira/tools.py", "copy into `plugins/<key>/tools.py`: a toolset made with `opens(Chip.<KEY>)`, returned by `toolsets(role)` in plugin.py"]
  - ["7", "src/mycel/core/chips.py", "a new `Chip` member; without it the tools are never offered"]
  - ["8", "web/src/components/ChipMenu.tsx", "the chip in the menu; also add it to the `Chip` type in `web/src/api/work.ts`"]
  - ["9", "src/mycel/agents/tools/delegate.py", "add the chip to the right delegate's `opens(…)` (researcher or analyst), or the orchestrator never reaches the tools"]
  - ["10", "src/mycel/agents/core/chip_filter.py", "a line in `REACHES`: what the chip reaches, in the person's words"]
  - ["11", "src/mycel/plugins/registry.py", "add it to `PLUGINS`"]
  - ["12", "web/src/components/panels/Connections.tsx", "optional: an icon in `ICONS`"]
  - ["test", "tests/test_plugin_tools.py", "no client → no tools; `GET /connections` lists it (`tests/test_auth.py`)"]
mistakes:
  - ["tool module imported at the top of `plugin.py`", "keep it inside `toolsets()` as Jira does: then loading the registry (api, scheduler) never loads `mycel.agents`"]
  - ["client imports anything but `core`, `infra.http` or `plugins/errors.py`", "`tests/test_layers.py` fails: a client only talks to the provider"]
  - ["callback put under `/connections`", "keep it at `/auth/<key>/callback`: that is the uri the provider has registered"]
  - ["a shared token in `.env` for the sync", "against the design: every read is on a person's own grant"]
  - ["first sync queued outside `try/except`", "a broker hiccup shows \"failed\" though the account is saved; log it, the timer syncs"]
  - ["callback not registered at the provider", "consent ends on the provider's error page"]
related:
  - [Connect an account, ../flows/connect.html]
  - [Add a tool, add-tool.html]
words: [plugin, OAuth, client, OAuthProvider, sealed, registry]
