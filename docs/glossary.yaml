  - [opaque token · JWT, a random id the server looks up · a signed token that carries its own data, overview/architecture.html]
  - [orchestrator · specialist, 'the agent that reads the question and merges the answer · an agent it hands one part to (analyst, researcher)', flows/ask.html]
  - [OTLP, the standard wire format traces are sent in, flows/observe.html]
  - [outbox, 'a table of jobs waiting to be sent; the row is written in the same commit as the data, so a crash cannot lose the job', overview/architecture.html]
