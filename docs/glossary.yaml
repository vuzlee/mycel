  - [Loki, 'stores container logs, searched in Grafana', flows/observe.html]
  - [max_connections, 'the most connections Postgres accepts, from all processes together', overview/architecture.html]
  - [MCP, 'Model Context Protocol: a standard way to call tools that live on another server', overview/architecture.html]
  - [migration, a numbered file (Alembic) that changes tables; runs before new code starts, overview/database.html]
  - [minikube, a one-machine Kubernetes on your laptop, operate/run.html]
  - [MinIO, 'file storage, S3-compatible; keeps the original upload', flows/upload.html]
  - [ModelRetry, an error the model reads and can fix by calling again, change/add-tool.html]
  - [mycel-error, the message header that says why a job was parked, flows/observe.html]
  - [mycel-session · mycel-expires, 'tags: this resource belongs to a session · the time the reaper may delete it', operate/aws.html]
  - [mycel_reader, 'the database user agent queries run as: reads gold, only the asker''s projects', overview/architecture.html]
  - [NAT, 'a paid gateway (~$0.05/h + data) for private machines to reach out; skipped: the node sits in a public subnet with its own IP', operate/aws.html]
  - [no owner, 'a table without user_id: one per deployment, read by the app only', overview/database.html]
  - [noeviction · allkeys-lru, Redis refuses writes when full · Redis drops the least used keys when full, overview/architecture.html]
  - [NX EX, 'Redis: set only if absent, with a TTL; how a claim is taken', queue/idempotency.html]
  - [OAuth, 'the provider asks the person, then gives the app a token, never the password', flows/connect.html]
  - [OAuth app, what you register at Google or Atlassian so people can connect, operate/setup.html]
