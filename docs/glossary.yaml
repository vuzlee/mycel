# Every word the handbook uses, one meaning each. A page lists at most six keys under `words:`.
# Rebuild: uv run python docs/tools/book.py   (writes glossary.html; check.py fails when out of date)
# [word, meaning, page that teaches it]
words:
  - [401 · 403 · 402, 'bad or forbidden key · out of credit: the key sits out (401/403: 10 min; 402: 1 min or until the daily reset) and the next key is tried', flows/own-model.html]
  - ['429', '"too many requests": the key sits out 1 min, or until the daily reset for a daily quota, and the next key is tried', flows/own-model.html]
  - [access token, a short-lived key sent on each call to the provider, flows/connect.html]
  - [ack · reject, the worker tells the queue a job is done · failed; no answer → delivered again, flows/job-failures.html]
  - [agent, a model with a prompt and tools it may call; the orchestrator hands parts of a question to specialists, overview/architecture.html]
  - [Alertmanager, sends an alert when a rule fires, flows/observe.html]
  - [Alloy, reads container logs and pushes them to Loki, flows/observe.html]
  - [analyst, the agent that answers questions over data, change/add-tool.html]
  - [app, 'people, sessions, chats, connections', overview/database.html]
  - [ASGI · middleware, the interface between server and app · code that wraps every request, overview/architecture.html]
  - [at least once, the queue may deliver a job again; never zero times, queue/idempotency.html]
  - [AZ (availability zone), one data centre in the region; EKS wants two, operate/aws.html]
  - [BaseHTTPMiddleware, 'Starlette''s easy middleware; it buffers the whole response, which breaks streaming', overview/architecture.html]
  - [broker · RabbitMQ, the queue server that holds jobs for workers, queue/outbox.html]
  - [bronze · silver · gold, 'raw copy from the provider · cleaned rows, one table per source · the one joined shape agents and charts read, whatever the source', overview/architecture.html]
  - [budget, 'the most one job may spend on models: $0.50; what is left shrinks with each call', flows/model-cost.html]
  - [callback, 'the URL the provider sends the person back to, with a code', flows/connect.html]
  - [chip, 'a source the person ticks under the chat box (Jira, Mail, Knowledge…); tools open only for picked chips', change/add-tool.html]
  - [chunk, 'one piece of a document, a few paragraphs', flows/upload.html]
  - [claim, 'a short Redis key: only one worker runs this job now', queue/idempotency.html]
  - [client, the code that calls the provider's API, change/add-plugin.html]
  - [code, a one-time ticket the provider sends back; swapped for tokens, flows/connect.html]
  - [commit · transaction, 'the moment a group of writes becomes permanent, all or none', queue/outbox.html]
  - [consent, the provider's page where the person says yes, flows/connect.html]
  - [contextvars, per-task variables in Python; they do not cross into another process, overview/architecture.html]
  - [credits, '$100 AWS gave the account; pays bills until 2027-10. Budgets count before them, so a real cost still shows', operate/aws.html]
  - [dead-letter queue, '`jobs.dlq` · `ingest.dlq`: where a job parks after its last try, until someone replays it; a job there is "parked"', flows/job-failures.html]
  - [delivery count, how many times this job was handed over again (redelivered); too many → dead-letter, queue/idempotency.html]
  - [dev · compose · k8s, app on the host · all in containers · on minikube, operate/run.html]
  - [docling, the library that reads PDF and DOCX into text, flows/upload.html]
  - [doctor, '`scripts/stack.sh doctor`: reports what is set up, broken or off; run it first', overview/config.html]
  - [EC2 · node, a rented virtual machine · here the one machine the pods run on, operate/aws.html]
  - [EKS, 'Kubernetes run by AWS: AWS keeps the control part, you rent the machines', operate/aws.html]
  - [embed · vector, 'turn text into numbers by meaning, so it can be searched · those numbers', flows/jira-sync.html]
  - [emptyDir, 'a pod''s scratch folder, gone with the pod: nothing is kept between sessions', operate/aws.html]
  - [endpoint, the URL of a model API, flows/own-model.html]
  - [.env, 'a file of the host''s settings and secrets, never in git; nothing personal', overview/config.html]
  - [environment, "dev, staging or prod; MYCEL_ENV picks its YAML (staging has none: base only)", overview/config.html]
  - [estimate vs spent, hours planned against hours logged, flows/dashboard.html]
  - [ETL, 'extract, transform, load: the steps that turn bronze into gold', overview/architecture.html]
  - [evals, 'golden questions with known answers, run by hand against real models', overview/architecture.html]
  - [EventBridge Scheduler, runs the reaper every 15 minutes, operate/aws.html]
  - [fencing token, 'a number that rises with each claim so a late write is refused; Mycel has none, the DONE? check stands in', queue/idempotency.html]
  - [Fernet, the encryption format `TOKEN_ENCRYPTION_KEY` is a key for, operate/setup.html]
  - [FINAL · TRANSIENT, a failure retrying cannot fix · one it may, flows/job-failures.html]
  - [gateway (LiteLLM), 'one door to every host model; holds the provider keys, counts and caps spend', flows/model-cost.html]
  - [gateway key, 'the app''s key to LiteLLM, made once', operate/setup.html]
  - [Google sign-in, Google confirms the address; the app never sees a password, flows/sign-in.html]
