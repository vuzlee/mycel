  - [IAM · Pod Identity, who may do what in AWS · how one pod gets an AWS role without keys, operate/aws.html]
  - [idempotent, running it twice has the same effect as once, queue/idempotency.html]
  - [INDEX_GOLD, the job that embeds new gold rows for search, flows/jira-sync.html]
  - [ingest, 'read a file, split it, make it searchable', flows/upload.html]
  - [ingest worker, 'the worker for heavy jobs: parsing and embedding, one at a time', flows/jira-sync.html]
  - [Ingress, 'a Kubernetes rule: which outside address reaches which Service', operate/aws.html]
