  - [Internet Gateway, 'the VPC''s free door to the internet, both ways', operate/aws.html]
  - [job · queue · worker, a unit of slow work · RabbitMQ holding it · the process that runs it, flows/ask.html]
  - [JQL, 'Jira''s query language; here: issues changed since the last run', flows/jira-sync.html]
  - [JSONB · timestamptz, JSON stored so Postgres can query inside it · a time with its zone, overview/database.html]
  - [kube-system, 'the cluster''s own pods: networking (vpc-cni), DNS (coredns), the LB controller', operate/aws.html]
  - [kubectl, the command line for Kubernetes, operate/aws.html]
  - [Kubernetes · pod, runs and restarts containers on a cluster · one running copy of a program, operate/run.html]
  - [Lambda · SNS, a function AWS runs on a schedule · a topic that sends mail, operate/aws.html]
  - [Langfuse, 'where traces are read: one trace per turn', flows/observe.html]
  - [Last-Event-ID, 'the browser''s place in the stream, so a reconnect resumes', flows/observe.html]
