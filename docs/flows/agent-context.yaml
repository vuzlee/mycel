reviewed: 1792695015   # 2026-10-23: E11 renames re-read (imports only); flow unchanged
title: "Agent context: the date goes on every question, searches filter by recency, old results shrink, and a run near its cap summarises itself"
page:
  eyebrow: Flow
  title: What the model sees
  lede: [Each model request is the prompt plus the run so far, 'Four steps before each call: date, shrink, summarise, call']
  why: [A model knows nothing past its training and reads only what is sent each time, Long runs fill the context and fail; these four steps keep it current and small]
lanes: [run, wiring, per request, tools, model]
boxes:
  - {id: runner,  lane: run,         col: 0, file: src/mycel/agents/core/runner.py,       label: core/runner.py,        role: "today's date on the question", hot: true}
  - {id: base,    lane: wiring,      col: 1, file: src/mycel/agents/core/base.py,         label: core/base.py,          role: "wires the steps below"}
  - {id: history, lane: per request, col: 0, file: src/mycel/agents/core/history.py,     label: core/history.py,       role: "old results → one line"}
  - {id: compact, lane: per request, col: 1, file: src/mycel/agents/core/compact.py,     label: core/compact.py,       role: "at 75% of cap: summarise"}
  - {id: parts,   lane: per request, col: 2, file: src/mycel/agents/core/prompt_parts.py, label: core/prompt_parts.py, role: "size of each part, traced"}
  - {id: search,  lane: tools,       col: 0, file: src/mycel/agents/tools/web_search.py,  label: tools/web_search.py,   role: "recency → Tavily time_range"}
  - {id: tavily,  lane: tools,       col: 1, file: src/mycel/agents/tools/web_search.py,  label: Tavily,                role: "web search API", outside: true}
  - {id: budget,  lane: tools,       col: 2, file: src/mycel/agents/core/settings.py,     label: core/settings.py,      role: "token cap (config/agents)"}
  - {id: builder, lane: model,       col: 2, file: src/mycel/agents/core/model_source.py, label: core/model_source.py, role: "opens the model"}
edges:
  - {from: runner,  to: base,    step: 1, kind: calls,  text: "dated(prompt, deps.tz)", label: "dated question", exit: 0.3, via: [[0.3, 0.5], [1, 0.5]]}
  - {from: base,    to: history, step: 2, kind: import, label: "shrink", exit: -0.3, via: [[0.7, 1.5], [0, 1.5]]}
  - {from: base,    to: compact, step: 3, kind: import, label: "maybe summarise"}
  - {from: base,    to: parts,            kind: import, label: "side: measure", exit: 0.3, via: [[1.3, 1.5], [2, 1.5]]}
  - {from: compact, to: budget,           kind: calls,  text: "total_tokens_limit", label: "side: read the cap", exit: 0.3, via: [[1.3, 2.5], [2, 2.5]]}
  - {from: search,  to: tavily,           kind: calls,  text: "time_range", label: "side: recency"}
  - {from: runner,  to: builder, step: 4, kind: import, label: "open, then request", exit: -0.45, via: [[-0.45, 4]], enter: 0}
notes:
  - ["date", "the question (not the fixed prompt) starts with today's date in the asker's zone; small models skip a date placed in the fixed prompt"]
  - ["recency", "`web_search` sends day / week / month / year as Tavily's `time_range`"]
  - ["old results", "web results older than the last 2 rounds become one line: urls kept, text dropped; other tool results stay whole"]
  - ["compact", "past 75% of `total_tokens_limit` a model call summarises the middle of the run"]
  - ["measured", "AI-news question: 333k tokens and a failure → 110k tokens and an answer (batch 110 notes)"]
failures:
  - ["model ignores the date", "recency still filters by time", "src/mycel/agents/tools/web_search.py"]
  - ["a search stalls or returns 5xx", "a stall (20 s timeout) or 5xx is resent once at once; still failing → that query comes back empty with a warning, the others kept; every query failed → the tool fails and the job is parked (see Job failures)", "src/mycel/agents/tools/web_search.py"]
  - ["summary call fails", "the run fails with it (retried if the model error is transient)", "src/mycel/agents/core/compact.py"]
  - ["cap reached anyway", "the run stops as runaway (it hit its cap)", "src/mycel/agents/core/exceptions.py"]
related:
  - [Model and cost, model-cost.html]
  - ["Traces and metrics", observe.html]
words: [prompt, token (model), token cap, tool result, run, side arrow]
