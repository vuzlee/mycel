reviewed: 1792695015   # 2026-10-23: E11 renames re-read (imports only); flow unchanged
title: "Agent context: the date goes in every prompt, searches filter by recency, old results shrink, and a run near its cap summarises itself"
page:
  eyebrow: Flow
  title: What the model sees
  lede: ["Each model request is the prompt plus the run so far", "Four steps keep it current and under the token cap"]
lanes: [run, per request, tools, model]
boxes:
  - {id: runner,  lane: run,                col: 0, file: src/mycel/agents/core/runner.py,       label: core/runner.py,        role: "today's date on the prompt", hot: true}
  - {id: base,    lane: run,                col: 1, file: src/mycel/agents/core/base.py,         label: core/base.py,          role: "wires the steps below"}
  - {id: history, lane: per request, col: 0, file: src/mycel/agents/core/history.py,     label: core/history.py,       role: "old results → one line"}
  - {id: compact, lane: per request, col: 1, file: src/mycel/agents/core/compact.py,     label: core/compact.py,       role: "at 75% of cap: summarise"}
  - {id: parts,   lane: per request, col: 2, file: src/mycel/agents/core/prompt_parts.py, label: core/prompt_parts.py, role: "size of each part, traced"}
  - {id: search,  lane: tools,              col: 1, file: src/mycel/agents/tools/web_search.py,  label: tools/web_search.py,   role: "a tool; called by the model"}
  - {id: budget,  lane: tools,              col: 2, file: src/mycel/agents/core/settings.py,     label: core/settings.py,      role: "token cap, from config/agents"}
  - {id: builder, lane: model,              col: 0, file: src/mycel/agents/core/model_source.py, label: core/model_source.py, role: "opens the model"}
edges:
  - {from: runner,  to: base,    step: 1, kind: calls,  text: "dated(prompt, deps.tz)", label: "dated prompt"}
  - {from: base,    to: history, step: 2, kind: import, label: "shrink", exit: -0.3, via: [[0.7, 0.5], [0, 0.5]]}
  - {from: base,    to: compact, step: 3, kind: import, label: "maybe summarise", label_at: [1.05, 0.62]}
  - {from: base,    to: parts,            kind: import, label: "side: measure", exit: 0.3, via: [[1.3, 0.5], [2, 0.5]]}
  - {from: compact, to: budget,           kind: calls,  text: "total_tokens_limit", label: "side: read the cap", exit: 0.3, via: [[1.3, 1.5], [2, 1.5]]}
  - {from: runner,  to: builder,  step: 4, kind: import, label: "open, then request", exit: -0.45, via: [[-0.45, 3]], enter: -0.45, label_at: [-0.42, 2.45]}
notes:
  - ["date", "every prompt starts with today's date in the asker's zone; a small model could not miss it"]
  - ["recency", "`web_search` sends day / week / month / year as Tavily's `time_range`"]
  - ["old results", "results older than the last 2 rounds become one line: urls kept, text dropped"]
  - ["compact", "past 75% of `total_tokens_limit` a model call summarises the middle of the run"]
  - ["measured", "AI-news question: 333k tokens and a failure → 110k tokens and an answer"]
failures:
  - ["model ignores the date", "recency still filters by time", "src/mycel/agents/tools/web_search.py"]
  - ["a search stalls or returns 5xx", "resent once after 20 s; still failing → that query comes back empty with a warning, the others kept", "src/mycel/agents/tools/web_search.py"]
  - ["summary call fails", "the run goes on uncompacted and may hit the cap", "src/mycel/agents/core/compact.py"]
  - ["cap reached anyway", "the run stops as runaway", "src/mycel/agents/core/exceptions.py"]
related:
  - [Model and cost, model-cost.html]
  - ["Traces, metrics, logs, events", observe.html]
words:
  - ["prompt", "the fixed instructions sent before the conversation"]
  - ["token", "the unit a model counts text in; about 4 characters"]
  - ["token cap", "the most tokens one turn may send"]
  - ["summarise", "replace old messages by a short summary to stay under the cap"]
  - ["tool result", "what a tool returned to the model; old ones shrink to one line"]
  - ["run", "one turn: the model and its tool calls until an answer"]
  - ["Tavily", "the web search API behind `web_search`"]
  - ["runaway", "a run stopped at the token cap"]
  - ["total_tokens_limit", "the token cap, per agent, in `config/agents/*.yaml`"]
  - ["numbered \u00b7 side arrow", "1 \u2192 4 is the order of one model request \u00b7 a side arrow is a lookup a step makes on the way"]
