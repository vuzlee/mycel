reviewed: 1792458837   # 2026-10-20: code re-read after MYC-214..219 and E10; flow unchanged
title: "Sign in: Google, or a six-digit code by mail; both end in a 14-day session cookie"
page:
  eyebrow: Flow
  title: Sign in
  lede: ["Two ways in: C = a code sent by mail, G = Google", "Both then run 1–3: account, session row, a 14-day cookie"]
  why: [The app must know who asks before it reads anyone's Jira or mail, 'No password is stored: Google or a mailed code proves the address']
