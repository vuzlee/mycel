notes:
  - ["in the browser", "`web/src/context/AuthContext.tsx` holds who is signed in; `main.tsx` guards private pages"]
  - ["session cookie", "`mycel_session` · 14 days · httponly · samesite=lax · secure outside dev"]
  - ["renewed?", "yes — each use (at most once a minute) and each page load push the end out 14 days"]
  - ["who may sign up", "`REGISTRATION_ALLOWED_DOMAINS`; empty = anyone"]
  - ["rate limit", "5 code requests, 10 tries a minute, per IP"]
  - ["Google asks for", "`openid email` only"]
failures:
  - ["Google client not set", "503 on start", "src/mycel/api/routes/auth.py"]
  - ["cancelled at Google", "back to login, `error=cancelled`", "src/mycel/api/routes/auth.py"]
  - ["Google answer fails a check (state, nonce, signature)", "`error=refused`", "src/mycel/services/google_signin.py"]
  - ["domain not allowed (new or existing account)", "`error=refused`", "src/mycel/services/auth.py"]
  - ["SMTP not set", "503 on code request", "src/mycel/api/routes/auth.py"]
  - ["domain not allowed (code)", "202 anyway, no mail sent: an outsider cannot probe which domains are allowed", "src/mycel/services/signin_code.py"]
  - ["mail fails to send", "logged; page still says check your mail", "src/mycel/services/signin_code.py"]
  - ["wrong code", "400; after 5 tries the code is deleted", "src/mycel/services/signin_code.py"]
  - ["code older than 10 min", "400 expired", "src/mycel/services/signin_code.py"]
  - ["too many requests", "429 with Retry-After", "src/mycel/api/limits.py"]
  - ["14 days without use", "row deleted, 401, page goes to login", "src/mycel/services/auth.py"]
