reviewed: 1792705266   # 2026-10-23: delegate.py returns a refused project read as text; the flow drawn (analyst path) is unchanged
title: "One question, end to end: browser to API, queue, worker, agents, gold, and back as live events"
page:
  eyebrow: Flow
  title: Ask a question
  lede: ["One question, from the chat box to the stored answer", "Read this before the other flows: they each zoom into one part of it"]
  why: [An answer takes seconds to minutes and can fail halfway, "So the API saves the question, queues a job and returns at once; a worker answers and streams each step back"]
lanes: [user, api, queue, worker, agents, tools, stores]
boxes:
  - {id: web,      lane: user,   col: 0, file: web/src/api/work.ts,                               label: api/work.ts,          role: "Lan types the question"}
  - {id: stream,   lane: user,   col: 4, file: web/src/hooks/useJobStream.ts,                label: hooks/useJobStream.ts, role: "shows each step live"}
  - {id: route,    lane: api,    col: 0, file: src/mycel/api/routes/chat.py,                 label: api/routes/chat.py,    role: "POST /chat → 202 + job id"}
  - {id: svc,      lane: api,    col: 1, file: src/mycel/services/chat.py,                   label: services/chat.py,      role: "save turn, make the job"}
  - {id: events,   lane: api,    col: 4, file: src/mycel/api/routes/events.py,               label: api/routes/events.py,  role: "GET /chat/{job}/events"}
  - {id: enq,      lane: queue,  col: 1, file: src/mycel/services/enqueue.py,                label: services/enqueue.py,   role: "outbox row, then publish"}
  - {id: rmq,      lane: queue,  col: 2, file: src/mycel/queue/producer.py,                  label: queue/producer.py,     role: "to RabbitMQ queue \"jobs\""}
  - {id: domain,   lane: worker, col: 1, file: src/mycel/domains/chat.py,                    label: domains/chat.py,       role: "runs the turn", hot: true}
  - {id: worker,   lane: worker, col: 2, file: src/mycel/queue/consumer.py,                  label: queue/consumer.py,     role: "takes the job"}
  - {id: orch,     lane: agents, col: 1, file: src/mycel/agents/specialists/orchestrator.py, label: orchestrator.py,       role: "picks a specialist"}
  - {id: delegate, lane: agents, col: 2, file: src/mycel/agents/tools/delegate.py,           label: tools/delegate.py,     role: "tool \"analyst\""}
  - {id: analyst,  lane: agents, col: 3, file: src/mycel/agents/specialists/analyst.py,      label: analyst.py,            role: "needs work numbers"}
  - {id: query,    lane: tools,  col: 2, file: src/mycel/agents/tools/query.py,              label: tools/query.py,        role: "read_rows() as the asker"}
  - {id: tool,     lane: tools,  col: 3, file: src/mycel/agents/tools/work.py,               label: tools/work.py,         role: "hours_by_person()"}
  - {id: turn,     lane: stores, col: 0, file: src/mycel/infra/postgres/repositories/conversations.py, label: "Postgres · app.turn", role: "the answer, kept"}
  - {id: gold,     lane: stores, col: 2, file: src/mycel/infra/postgres/acl.py,              label: "Postgres · gold",     role: "only the asker's projects", hot: true}
  - {id: redis,    lane: stores, col: 4, file: src/mycel/infra/redis/streams.py,             label: Redis stream,          role: "each step, in order"}
edges:
  - {from: web,      to: route,    step: 1, kind: http,   text: '"/chat"', label: POST /chat}
  - {from: route,    to: svc,      step: 2, kind: import, label: request_chat()}
  - {from: svc,      to: enq,      step: 3, kind: import, label: job}
  - {from: enq,      to: rmq,               kind: import, label: publish}
  - {from: rmq,      to: worker,   step: 4, kind: queue,  text: topology.QUEUE, label: deliver}
  - {from: worker,   to: domain,            kind: calls,  text: jobs.run, label: "RUNS[kind]"}
  - {from: domain,   to: orch,     step: 5, kind: import, label: run}
  - {from: orch,     to: delegate, step: 6, kind: import, label: delegate}
  - {from: delegate, to: analyst,           kind: import, label: run}
  - {from: analyst,  to: tool,              kind: import, label: tool}
  - {from: tool,     to: query,    step: 7, kind: import, label: SQL}
  - {from: query,    to: gold,              kind: calls,  text: scoped_read, label: as mycel_reader}
  - {from: domain,   to: turn,     step: 9, kind: import, label: store the answer, exit: -0.45, via: [[0.55, 3.5], [0.5, 3.5], [0.5, 6]], label_at: [-0.05, 5.45]}
  - {from: domain,   to: redis,    step: 8, kind: import, label: "XADD each step (all along)", label_at: [3.2, 3.42], exit: 0.3, enter: 0.3, via: [[1.3, 3.5], [4.3, 3.5]]}
  - {from: events,   to: redis,             kind: import, label: XREAD, reverse: true}
  - {from: stream,   to: events,            kind: http,   text: "/events", label: SSE, reverse: true}
words: [turn, job · queue · worker, outbox, agent, orchestrator · specialist, claim]
notes:
  - ["the example", "Lan asks \"who logged the most hours last week?\"; the orchestrator hands it to the analyst, whose tool reads gold"]
  - ["202 at once", "`POST /chat` saves the turn and the job, then answers 202 with a job id; the browser opens the event stream for it"]
  - ["who answers", "the worker (2 jobs at a time per pod); the orchestrator picks a specialist: analyst for Jira numbers, researcher for web, mail, calendar"]
  - ["what it may read", "agent SQL runs as `mycel_reader`: only projects the asker may browse"]
  - ["live steps", "each step is appended to a Redis stream; the browser reads it by SSE and resumes after `Last-Event-ID`"]
  - ["cost", "a job stops at $0.50; a person at $5 a day"]
failures:
  - ["more than 20 questions a minute", "429 per user", "src/mycel/api/routes/chat.py"]
  - ["daily $5 spent", "429 daily_limit before anything is queued", "src/mycel/services/chat.py"]
  - ["last question still answering", "409 turn_in_progress", "src/mycel/services/chat.py"]
  - ["API busy (64 in flight)", "503 with retry-after: 1", "src/mycel/api/middleware.py"]
  - ["publish fails after commit", "the outbox relay sends the job within 15 s", "src/mycel/services/enqueue.py"]
  - ["worker dies mid-answer", "the queue delivers again and the model runs again; a turn already done is skipped", "src/mycel/domains/chat.py"]
  - ["model or tool fails for good", "turn marked failed, the page shows the error", "src/mycel/domains/chat.py"]
related:
  - ["Outbox", "../queue/outbox.html"]
  - ["Idempotency", "../queue/idempotency.html"]
  - ["What the model sees", "agent-context.html"]
  - ["Model and cost", "model-cost.html"]
