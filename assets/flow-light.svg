<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700"
     role="img" aria-label="Mycel end to end: a scheduler pulls Jira through the sources layer into bronze, which etl normalises to silver and promotes to gold. A question posted to the api returns a job id and goes on a queue; a worker pulls it, and an orchestrator delegates to whichever specialist agents can answer, reading gold only. The answer streams back over SSE. Every box emits a span, and traces, metrics and logs share one trace id.">
  <!-- Drawn in the same hand as the four-layer figure in docs/architecture.html: one
       colour per medallion layer, mono for names and sans for what they are, the label
       riding on the arrow rather than beside it.

       Four bands, four jobs: get the data in, take the question, answer it, watch the
       whole thing. Only the blocks someone needs to hold in their head — the retry and
       dead-letter queues are real, but they live inside `queue`, and architecture.html
       is where that belongs. No agent is named: the roster is prose, because prose is
       corrected in one pass and a drawing is the last thing anyone remembers to redraw.

       Geometry, so a later edit does not have to re-derive it. The bands are 190 tall
       with 58 between them, and every arrow that leaves a band runs in that gap — which
       is why the gap is wider than it looks like it needs to be. Boxes are 68 tall at
       the band's y+58, so a caption can sit under them without touching the frame. -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">

    <!-- ══ band 1 · ingest ══════════════════════════════════════════════════ -->
    <rect x="24" y="24" width="1152" height="190" rx="4" fill="none"
          stroke="#c9c1de" stroke-width="1.3" stroke-dasharray="6 5"/>
    <text x="48" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" letter-spacing="1.6" fill="#b3adc2">INGEST · ON A SCHEDULE</text>

    <rect x="48" y="82" width="148" height="68" rx="2" fill="#ffffff" stroke="#e7e3f0"/>
    <text x="122" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" fill="#17141f" text-anchor="middle">Jira</text>
    <text x="122" y="132" font-size="11" fill="#6f6782" text-anchor="middle">source of record</text>

    <rect x="280" y="82" width="168" height="68" rx="2" fill="#faf5f3" stroke="#9c5a3c" stroke-width="1.3"/>
    <text x="300" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" fill="#9c5a3c">sources/</text>
    <text x="300" y="132" font-size="11" fill="#6f6782">pull in, no processing</text>

    <rect x="532" y="82" width="160" height="68" rx="2" fill="#faf5f3" stroke="#9c5a3c" stroke-width="1.3"/>
    <text x="552" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" fill="#9c5a3c">bronze</text>
    <text x="552" y="132" font-size="11" fill="#6f6782">immutable payload</text>

    <rect x="776" y="82" width="160" height="68" rx="2" fill="#f5f7fa" stroke="#4f6d9e" stroke-width="1.3"/>
    <text x="796" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" fill="#4f6d9e">silver</text>
    <text x="796" y="132" font-size="11" fill="#6f6782">normalised, deduped</text>

    <rect x="1012" y="82" width="140" height="68" rx="2" fill="#f5f1fd" stroke="#6d3fd1" stroke-width="1.6"/>
    <text x="1032" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" fill="#6d3fd1">gold</text>
    <text x="1032" y="132" font-size="11" fill="#6f6782">business tables</text>

    <text x="532" y="184" font-size="10.5" fill="#b3adc2">one database, three schemas — etl/ steps are idempotent, with checks between every one</text>

    <!-- ══ band 2 · ask ═════════════════════════════════════════════════════ -->
    <rect x="24" y="272" width="568" height="190" rx="4" fill="none"
          stroke="#c9c1de" stroke-width="1.3" stroke-dasharray="6 5"/>
    <text x="48" y="304" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" letter-spacing="1.6" fill="#b3adc2">ASK · ONE WAY IN</text>

    <rect x="48" y="330" width="152" height="68" rx="2" fill="#ffffff" stroke="#e7e3f0"/>
    <text x="124" y="360" font-size="13" fill="#17141f" text-anchor="middle">your question</text>
    <text x="124" y="380" font-size="11" fill="#6f6782" text-anchor="middle">plain language</text>

    <rect x="240" y="330" width="152" height="68" rx="2" fill="#ffffff" stroke="#e7e3f0"/>
    <text x="260" y="360" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" fill="#17141f">api/</text>
    <text x="260" y="380" font-size="11" fill="#6f6782">a job id at once</text>

    <rect x="432" y="330" width="136" height="68" rx="2" fill="#ffffff" stroke="#6d3fd1" stroke-width="1.3"/>
    <text x="452" y="360" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" fill="#6d3fd1">queue</text>
    <text x="452" y="380" font-size="11" fill="#6f6782">retries, gives up</text>

    <text x="48" y="428" font-size="10.5" fill="#b3adc2">nothing is answered inside the request —</text>
    <text x="48" y="444" font-size="10.5" fill="#b3adc2">you get an id, and the answer arrives on its own</text>

    <!-- ══ band 3 · answer ══════════════════════════════════════════════════ -->
    <rect x="616" y="272" width="560" height="190" rx="4" fill="none"
          stroke="#c9c1de" stroke-width="1.3" stroke-dasharray="6 5"/>
    <text x="640" y="304" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" letter-spacing="1.6" fill="#b3adc2">ANSWER · IN THE WORKER</text>

    <rect x="640" y="330" width="180" height="68" rx="2" fill="#f5f1fd" stroke="#6d3fd1" stroke-width="1.6"/>
    <text x="660" y="360" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" fill="#6d3fd1">orchestrator</text>
    <text x="660" y="380" font-size="11" fill="#6f6782">splits the work, merges it</text>

    <rect x="862" y="330" width="290" height="68" rx="2" fill="#ffffff" stroke="#6d3fd1" stroke-width="1.3"/>
    <g fill="#6d3fd1">
      <circle cx="886" cy="364" r="6"/>
      <circle cx="906" cy="364" r="6" opacity="0.58"/>
      <circle cx="926" cy="364" r="6" opacity="0.3"/>
    </g>
    <text x="950" y="360" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" fill="#17141f">specialists</text>
    <text x="950" y="380" font-size="11" fill="#6f6782">one per capability</text>

    <text x="772" y="428" font-size="10.5" fill="#b3adc2">each differs only by the tools it is given —</text>
    <text x="772" y="444" font-size="10.5" fill="#b3adc2">gold over read-only SQL · the web · your mailbox</text>

    <!-- ══ band 4 · observability ═══════════════════════════════════════════ -->
    <rect x="24" y="520" width="1152" height="140" rx="4" fill="none"
          stroke="#c9c1de" stroke-width="1.3" stroke-dasharray="6 5"/>
    <text x="48" y="552" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" letter-spacing="1.6" fill="#b3adc2">OBSERVABILITY · EVERY BOX ABOVE EMITS A SPAN</text>

    <rect x="48" y="578" width="264" height="56" rx="2" fill="#ffffff" stroke="#e7e3f0"/>
    <text x="68" y="603" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12" fill="#17141f">traces</text>
    <text x="68" y="622" font-size="11" fill="#6f6782">where a run went, and what it cost</text>

    <rect x="336" y="578" width="264" height="56" rx="2" fill="#ffffff" stroke="#e7e3f0"/>
    <text x="356" y="603" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12" fill="#17141f">metrics</text>
    <text x="356" y="622" font-size="11" fill="#6f6782">whether it is broken right now</text>

    <rect x="624" y="578" width="264" height="56" rx="2" fill="#ffffff" stroke="#e7e3f0"/>
    <text x="644" y="603" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12" fill="#17141f">logs</text>
    <text x="644" y="622" font-size="11" fill="#6f6782">why a run went that way</text>

    <rect x="912" y="578" width="240" height="56" rx="2" fill="#f5f1fd" stroke="#6d3fd1" stroke-width="1.3"/>
    <text x="1032" y="603" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12" fill="#6d3fd1" text-anchor="middle">one trace id</text>
    <text x="1032" y="622" font-size="11" fill="#6f6782" text-anchor="middle">joins all three</text>

    <!-- ══ arrows. Explicit triangles rather than <marker>: a sanitiser drops a
         marker first, and a simple renderer ignores it. Every line stops 12 short
         of its target and the triangle covers that 12, so the two always meet. ══ -->

    <!-- band 1, each arrow carrying the name of the step it performs -->
    <g fill="none" stroke="#9c5a3c" stroke-width="1.3">
      <path d="M196 116H260"/>
      <path d="M448 116H512"/>
    </g>
    <g fill="#9c5a3c">
      <path d="M260 110 272 116 260 122z"/>
      <path d="M512 110 524 116 512 122z"/>
    </g>
    <path d="M692 116H756" fill="none" stroke="#4f6d9e" stroke-width="1.3"/>
    <path d="M756 110 768 116 756 122z" fill="#4f6d9e"/>
    <path d="M936 116H992" fill="none" stroke="#6d3fd1" stroke-width="1.3"/>
    <path d="M992 110 1004 116 992 122z" fill="#6d3fd1"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" text-anchor="middle">
      <text x="234" y="106" fill="#b3adc2">HTTP</text>
      <text x="486" y="106" fill="#9c5a3c">write verbatim</text>
      <text x="730" y="106" fill="#4f6d9e">normalise</text>
      <text x="968" y="106" fill="#6d3fd1">promote</text>
    </g>

    <!-- bands 2 and 3, one chain that happens to cross a frame in the middle -->
    <g fill="none" stroke="#6d3fd1" stroke-width="1.3">
      <path d="M200 364H228"/>
      <path d="M392 364H420"/>
      <path d="M568 364H626"/>
      <path d="M820 364H850"/>
    </g>
    <g fill="#6d3fd1">
      <path d="M228 358 240 364 228 370z"/>
      <path d="M420 358 432 364 420 370z"/>
      <path d="M626 358 638 364 626 370z"/>
      <path d="M850 358 862 364 850 370z"/>
    </g>

    <!-- the only way out of the database, drawn in the gap between the bands -->
    <path d="M1090 330V174" fill="none" stroke="#6d3fd1" stroke-width="1.5"/>
    <path d="M1084 174 1090 162 1096 174z" fill="#6d3fd1"/>
    <text x="1102" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="9" fill="#6d3fd1">reads gold only</text>

    <!-- the answer comes back the way it was asked, along the gap below both bands -->
    <g fill="none" stroke="#6d3fd1" stroke-width="1.3" stroke-dasharray="4 4" opacity="0.6">
      <path d="M730 398V490H36V364"/>
    </g>
    <path d="M36 358 48 364 36 370z" fill="#6d3fd1" opacity="0.6"/>
    <text x="400" y="484" font-size="10.5" fill="#b3adc2" text-anchor="middle">the answer streams back over SSE, written as it arrives</text>

    <text x="600" y="686" font-size="10.5" fill="#b3adc2" text-anchor="middle">a slow or expensive answer is one trace away from an explanation</text>
  </g>
</svg>
