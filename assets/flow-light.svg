<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660"
     role="img" aria-label="Mycel end to end, in four columns: a scheduler pulls each external platform through its own connector into a bronze raw layer, which the ETL pipeline normalises to silver and promotes to gold. A question posted to the API returns a job id and goes on a message queue; a worker pulls it, and an orchestrator delegates to whichever specialist agents can answer, reading gold only. The answer streams back over SSE. Every component emits a span, and traces, metrics and logs share one trace id.">
  <!-- Components, not folders. This is a system diagram: it says what the parts are and
       how a request moves between them, so it stays true through a refactor that renames
       every module. docs/architecture.html is where the code layout belongs.

       Four columns, four jobs: get the data in, take the question, answer it, watch the
       whole thing. Columns read top to bottom, like the figure in architecture.html §1.1 —
       major components only. The connector layer, the retry and the dead-letter queues are
       all real, and all inside a box drawn here.

       No agent is named: the roster is prose, because prose is corrected in one pass and
       a drawing is the last thing anyone remembers to redraw.

       Geometry, so a later edit does not have to re-derive it. Columns are 252 wide at
       x = 24, 324, 624, 924 — a 48 channel between them, and every arrow that leaves a
       column runs in a channel. Rows pitch 104 from y = 100; boxes are 204 wide and 64
       tall, so the 40 left over is where a vertical arrow and its label live. A column's
       frame ends 60 below its last box, which is the room its caption sits in. Every line
       stops 12 short of its target and the triangle covers that 12, so the two always
       meet. A column starts at the row its work starts on: ANSWER begins at row 2 because
       that is where the queue hands over, which also leaves row 3 clear all the way back
       to gold. -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">

    <!-- ══ column 1 · ingest ═════════════════════════════════════════════════ -->
    <rect x="24" y="36" width="252" height="500" rx="4" fill="none"
          stroke="#c9c1de" stroke-width="1.3" stroke-dasharray="6 5"/>
    <text x="48" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" letter-spacing="1.2" fill="#b3adc2">INGEST · ON A SCHEDULE</text>

    <rect x="48" y="100" width="204" height="64" rx="2" fill="#ffffff" stroke="#e7e3f0"/>
    <text x="68" y="128" font-size="14" fill="#17141f">External platforms</text>
    <text x="68" y="148" font-size="11" fill="#6f6782">Jira today · Slack, Gmail next</text>

    <rect x="48" y="204" width="204" height="64" rx="2" fill="#faf5f3" stroke="#9c5a3c" stroke-width="1.3"/>
    <text x="68" y="232" font-size="14" fill="#9c5a3c">Bronze</text>
    <text x="68" y="252" font-size="11" fill="#6f6782">raw, exactly as it arrived</text>

    <rect x="48" y="308" width="204" height="64" rx="2" fill="#f5f7fa" stroke="#4f6d9e" stroke-width="1.3"/>
    <text x="68" y="336" font-size="14" fill="#4f6d9e">Silver</text>
    <text x="68" y="356" font-size="11" fill="#6f6782">normalised, deduped</text>

    <rect x="48" y="412" width="204" height="64" rx="2" fill="#f5f1fd" stroke="#6d3fd1" stroke-width="1.6"/>
    <text x="68" y="440" font-size="14" fill="#6d3fd1">Gold</text>
    <text x="68" y="460" font-size="11" fill="#6f6782">business tables, ready to query</text>

    <text x="48" y="502" font-size="10.5" fill="#b3adc2">one database, three schemas —</text>
    <text x="48" y="518" font-size="10.5" fill="#b3adc2">every ETL step is idempotent, with checks</text>

    <!-- ══ column 2 · ask ════════════════════════════════════════════════════ -->
    <rect x="324" y="36" width="252" height="396" rx="4" fill="none"
          stroke="#c9c1de" stroke-width="1.3" stroke-dasharray="6 5"/>
    <text x="348" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" letter-spacing="1.2" fill="#b3adc2">ASK · ONE WAY IN</text>

    <rect x="348" y="100" width="204" height="64" rx="2" fill="#ffffff" stroke="#e7e3f0"/>
    <text x="368" y="128" font-size="14" fill="#17141f">Your question</text>
    <text x="368" y="148" font-size="11" fill="#6f6782">plain language</text>

    <rect x="348" y="204" width="204" height="64" rx="2" fill="#ffffff" stroke="#e7e3f0"/>
    <text x="368" y="232" font-size="14" fill="#17141f">API</text>
    <text x="368" y="252" font-size="11" fill="#6f6782">returns a job id</text>

    <rect x="348" y="308" width="204" height="64" rx="2" fill="#ffffff" stroke="#6d3fd1" stroke-width="1.3"/>
    <text x="368" y="336" font-size="14" fill="#6d3fd1">Queue</text>
    <text x="368" y="356" font-size="11" fill="#6f6782">retries, gives up</text>

    <text x="348" y="398" font-size="10.5" fill="#b3adc2">nothing is answered inside the request —</text>
    <text x="348" y="414" font-size="10.5" fill="#b3adc2">you get an id, the answer arrives on its own</text>

    <!-- ══ column 3 · answer ═════════════════════════════════════════════════ -->
    <rect x="624" y="244" width="252" height="292" rx="4" fill="none"
          stroke="#c9c1de" stroke-width="1.3" stroke-dasharray="6 5"/>
    <text x="648" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" letter-spacing="1.2" fill="#b3adc2">ANSWER · IN THE WORKER</text>

    <rect x="648" y="308" width="204" height="64" rx="2" fill="#f5f1fd" stroke="#6d3fd1" stroke-width="1.6"/>
    <text x="668" y="336" font-size="14" fill="#6d3fd1">Orchestrator</text>
    <text x="668" y="356" font-size="11" fill="#6f6782">splits the work, merges it</text>

    <rect x="648" y="412" width="204" height="64" rx="2" fill="#ffffff" stroke="#6d3fd1" stroke-width="1.3"/>
    <text x="668" y="440" font-size="14" fill="#17141f">Specialist agents</text>
    <text x="668" y="460" font-size="11" fill="#6f6782">one per capability</text>
    <g fill="#6d3fd1">
      <circle cx="792" cy="456" r="5"/>
      <circle cx="810" cy="456" r="5" opacity="0.58"/>
      <circle cx="828" cy="456" r="5" opacity="0.3"/>
    </g>

    <text x="648" y="502" font-size="10.5" fill="#b3adc2">each differs only by the tools it is given —</text>
    <text x="648" y="518" font-size="10.5" fill="#b3adc2">gold over read-only SQL · web · mailbox</text>

    <!-- ══ column 4 · observability ══════════════════════════════════════════ -->
    <rect x="924" y="36" width="252" height="500" rx="4" fill="none"
          stroke="#c9c1de" stroke-width="1.3" stroke-dasharray="6 5"/>
    <text x="948" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" letter-spacing="1.2" fill="#b3adc2">OBSERVABILITY</text>

    <rect x="948" y="100" width="204" height="64" rx="2" fill="#ffffff" stroke="#e7e3f0"/>
    <text x="968" y="128" font-size="14" fill="#17141f">Traces</text>
    <text x="968" y="148" font-size="11" fill="#6f6782">where a run went, and what it cost</text>

    <rect x="948" y="204" width="204" height="64" rx="2" fill="#ffffff" stroke="#e7e3f0"/>
    <text x="968" y="232" font-size="14" fill="#17141f">Metrics</text>
    <text x="968" y="252" font-size="11" fill="#6f6782">whether it is broken right now</text>

    <rect x="948" y="308" width="204" height="64" rx="2" fill="#ffffff" stroke="#e7e3f0"/>
    <text x="968" y="336" font-size="14" fill="#17141f">Logs</text>
    <text x="968" y="356" font-size="11" fill="#6f6782">why a run went that way</text>

    <rect x="948" y="412" width="204" height="64" rx="2" fill="#f5f1fd" stroke="#6d3fd1" stroke-width="1.3"/>
    <text x="968" y="440" font-size="14" fill="#6d3fd1">One trace id</text>
    <text x="968" y="460" font-size="11" fill="#6f6782">joins all three</text>

    <text x="948" y="502" font-size="10.5" fill="#b3adc2">every component in this diagram</text>
    <text x="948" y="518" font-size="10.5" fill="#b3adc2">emits a span of its own</text>

    <!-- ══ arrows ════════════════════════════════════════════════════════════ -->

    <!-- column 1, each arrow carrying the name of the step it performs -->
    <path d="M150 164V192" fill="none" stroke="#9c5a3c" stroke-width="1.3"/>
    <path d="M144 192 150 204 156 192z" fill="#9c5a3c"/>
    <path d="M150 268V296" fill="none" stroke="#4f6d9e" stroke-width="1.3"/>
    <path d="M144 296 150 308 156 296z" fill="#4f6d9e"/>
    <path d="M150 372V400" fill="none" stroke="#6d3fd1" stroke-width="1.3"/>
    <path d="M144 400 150 412 156 400z" fill="#6d3fd1"/>

    <g font-size="9.5">
      <!-- The connector layer is this arrow: one per platform, pulling and storing
           without interpreting. A box of its own would be a component an overview
           does not need, but the work is real, so it rides the arrow that does it. -->
      <text x="164" y="180" fill="#9c5a3c">one connector each,</text>
      <text x="164" y="194" fill="#9c5a3c">storing verbatim</text>
      <text x="164" y="287" fill="#4f6d9e">normalise</text>
      <text x="164" y="391" fill="#6d3fd1">promote</text>
    </g>

    <!-- column 2, and the hand-off across the channel into the worker -->
    <g fill="none" stroke="#6d3fd1" stroke-width="1.3">
      <path d="M450 164V192"/>
      <path d="M450 268V296"/>
      <path d="M552 340H636"/>
      <path d="M750 372V400"/>
    </g>
    <g fill="#6d3fd1">
      <path d="M444 192 450 204 456 192z"/>
      <path d="M444 296 450 308 456 296z"/>
      <path d="M636 334 648 340 636 346z"/>
      <path d="M744 400 750 412 756 400z"/>
    </g>

    <!-- the only way out of the database, drawn along the row both ends sit on -->
    <path d="M636 460H288" fill="none" stroke="#6d3fd1" stroke-width="1.5"/>
    <path d="M288 454 276 460 288 466z" fill="#6d3fd1"/>
    <text x="462" y="452" font-size="9.5" fill="#6d3fd1" text-anchor="middle">reads gold only</text>

    <!-- the answer comes back the way it was asked, along the channel and the floor -->
    <g fill="none" stroke="#6d3fd1" stroke-width="1.3" stroke-dasharray="4 4" opacity="0.6">
      <path d="M852 444H900V590H300V132H336"/>
    </g>
    <path d="M336 126 348 132 336 138z" fill="#6d3fd1" opacity="0.6"/>
    <text x="576" y="582" font-size="10.5" fill="#b3adc2" text-anchor="middle">the answer streams back over SSE, written as it arrives</text>

    <text x="600" y="632" font-size="10.5" fill="#b3adc2" text-anchor="middle">a slow or expensive answer is one trace away from an explanation</text>
  </g>
</svg>
