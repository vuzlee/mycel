<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1004" width="1200" height="1004"
     role="img" aria-label="Mycel at a glance. Ingest: connectors pull each external platform into a bronze, silver and gold data lakehouse. Producer: a prompt goes through the API gateway and middleware onto a message broker. Consumer: a worker picks the job up and hands it to a multi-agent system, where an orchestrator delegates to peer agents; the agents call tools, which read gold, and MCP servers. The answer streams back to the prompt. Observability: traces, metrics and logs.">
  <!-- High-level design. Components and their contracts — not modules, not folders, not
       what is inside a component. docs/architecture.html is where the detail belongs.

       Columns are named by role, which is what explains the shape: a producer and a
       consumer either side of a broker. Each column reads top to bottom.

       The orchestrator is an agent like its peers — it holds a different prompt and a
       different set of tools, not a different kind of loop — so it is drawn inside the
       multi-agent box rather than above it. Tools and MCP servers sit on one row beneath,
       because they are the same thing to an agent: something it calls. MCP servers are
       drawn unfilled, like external platforms, because they are somebody else's process.

       No agent is named: the roster is prose, because prose is corrected in one pass and
       a drawing is the last thing anyone remembers to redraw.

       Grid, so a later edit does not re-derive it. Columns 1, 2 and 4 are 252 wide at
       x = 24, 324, 924, with a 48 channel between them; the consumer column is 528 wide
       because it holds two boxes on a row. Rows pitch 96 from y = 100; boxes are 56 tall.
       A column's frame ends 24 below its last box. Every line stops 12 short of its
       target and the triangle covers that 12, so the two always meet. -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">

    <!-- ══ column 1 · ingest ═════════════════════════════════════════════════ -->
    <rect x="24" y="36" width="252" height="564" rx="4" fill="none"
          stroke="#4a4162" stroke-width="1.3" stroke-dasharray="6 5"/>
    <text x="48" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" letter-spacing="1.2" fill="#655d79">INGEST</text>

    <rect x="48" y="100" width="204" height="56" rx="2" fill="#131019" stroke="#241f30"/>
    <text x="150" y="134" font-size="14" fill="#f0edf7" text-anchor="middle">External Platforms</text>

    <rect x="48" y="196" width="204" height="56" rx="2" fill="#131019" stroke="#241f30"/>
    <text x="150" y="230" font-size="14" fill="#f0edf7" text-anchor="middle">Connectors</text>

    <rect x="48" y="292" width="204" height="56" rx="2" fill="#25190f" stroke="#d29472" stroke-width="1.3"/>
    <text x="150" y="326" font-size="14" fill="#d29472" text-anchor="middle">Bronze</text>

    <rect x="48" y="388" width="204" height="56" rx="2" fill="#141b26" stroke="#92aee0" stroke-width="1.3"/>
    <text x="150" y="422" font-size="14" fill="#92aee0" text-anchor="middle">Silver</text>

    <rect x="48" y="484" width="204" height="56" rx="2" fill="#2a2111" stroke="#e0b955" stroke-width="1.6"/>
    <text x="150" y="518" font-size="14" fill="#e0b955" text-anchor="middle">Gold</text>

    <text x="48" y="574" font-size="11" fill="#655d79">Data Lakehouse</text>

    <!-- ══ column 2 · producer ═══════════════════════════════════════════════ -->
    <rect x="324" y="36" width="252" height="432" rx="4" fill="none"
          stroke="#4a4162" stroke-width="1.3" stroke-dasharray="6 5"/>
    <text x="348" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" letter-spacing="1.2" fill="#655d79">PRODUCER</text>

    <rect x="348" y="100" width="204" height="56" rx="2" fill="#131019" stroke="#241f30"/>
    <text x="450" y="134" font-size="14" fill="#f0edf7" text-anchor="middle">Prompt</text>

    <rect x="348" y="196" width="204" height="56" rx="2" fill="#131019" stroke="#241f30"/>
    <text x="450" y="230" font-size="14" fill="#f0edf7" text-anchor="middle">API Gateway</text>

    <rect x="348" y="292" width="204" height="56" rx="2" fill="#131019" stroke="#241f30"/>
    <text x="450" y="326" font-size="14" fill="#f0edf7" text-anchor="middle">Middleware</text>

    <rect x="348" y="388" width="204" height="56" rx="2" fill="#1d1730" stroke="#b79cff" stroke-width="1.6"/>
    <text x="450" y="422" font-size="14" fill="#b79cff" text-anchor="middle">Message Broker</text>

    <!-- ══ column 4 · observability ══════════════════════════════════════════ -->
    <rect x="924" y="36" width="252" height="340" rx="4" fill="none"
          stroke="#4a4162" stroke-width="1.3" stroke-dasharray="6 5"/>
    <text x="948" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" letter-spacing="1.2" fill="#655d79">OBSERVABILITY</text>

    <rect x="948" y="100" width="204" height="56" rx="2" fill="#131019" stroke="#241f30"/>
    <text x="1050" y="134" font-size="14" fill="#f0edf7" text-anchor="middle">Traces</text>

    <rect x="948" y="196" width="204" height="56" rx="2" fill="#131019" stroke="#241f30"/>
    <text x="1050" y="230" font-size="14" fill="#f0edf7" text-anchor="middle">Metrics</text>

    <rect x="948" y="292" width="204" height="56" rx="2" fill="#131019" stroke="#241f30"/>
    <text x="1050" y="326" font-size="14" fill="#f0edf7" text-anchor="middle">Logs</text>

    <!-- ══ column 3 · consumer ═══════════════════════════════════════════════ -->
    <rect x="624" y="420" width="528" height="516" rx="4" fill="none"
          stroke="#4a4162" stroke-width="1.3" stroke-dasharray="6 5"/>
    <text x="648" y="456" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" letter-spacing="1.2" fill="#655d79">CONSUMER</text>

    <rect x="696" y="484" width="180" height="56" rx="2" fill="#131019" stroke="#b79cff" stroke-width="1.3"/>
    <text x="786" y="518" font-size="14" fill="#b79cff" text-anchor="middle">Worker</text>

    <rect x="672" y="580" width="228" height="228" rx="4" fill="none"
          stroke="#4a4162" stroke-width="1.3" stroke-dasharray="6 5"/>
    <text x="696" y="608" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" letter-spacing="1.2" fill="#655d79">MULTI-AGENT SYSTEM</text>

    <rect x="696" y="628" width="180" height="56" rx="2" fill="#1d1730" stroke="#b79cff" stroke-width="1.6"/>
    <text x="786" y="662" font-size="14" fill="#b79cff" text-anchor="middle">Orchestrator</text>

    <!-- Stacked, not side by side: the orchestrator is a peer that happens to fan out to
         the others, and a vertical pair says that without needing a count. -->
    <rect x="696" y="724" width="180" height="56" rx="2" fill="#131019" stroke="#b79cff" stroke-width="1.3"/>
    <text x="786" y="758" font-size="14" fill="#f0edf7" text-anchor="middle">Sub-agents</text>

    <rect x="696" y="856" width="180" height="56" rx="2" fill="#131019" stroke="#b79cff" stroke-width="1.3"/>
    <text x="786" y="890" font-size="14" fill="#f0edf7" text-anchor="middle">Tools</text>

    <!-- Same weight as Tools: to an agent both are simply something it calls, and a
         second meaning on the same row would read as a second tier. -->
    <rect x="912" y="856" width="180" height="56" rx="2" fill="#131019" stroke="#b79cff" stroke-width="1.3"/>
    <text x="1002" y="890" font-size="14" fill="#f0edf7" text-anchor="middle">MCP Servers</text>

    <!-- ══ arrows ════════════════════════════════════════════════════════════ -->

    <!-- column 1, each arrow carrying the step it performs -->
    <g fill="none" stroke="#d29472" stroke-width="1.3">
      <path d="M150 156V184"/>
      <path d="M150 252V280"/>
    </g>
    <g fill="#d29472">
      <path d="M144 184 150 196 156 184z"/>
      <path d="M144 280 150 292 156 280z"/>
    </g>
    <path d="M150 348V376" fill="none" stroke="#92aee0" stroke-width="1.3"/>
    <path d="M144 376 150 388 156 376z" fill="#92aee0"/>
    <path d="M150 444V472" fill="none" stroke="#e0b955" stroke-width="1.3"/>
    <path d="M144 472 150 484 156 472z" fill="#e0b955"/>

    <g font-size="9.5">
      <text x="164" y="177" fill="#d29472">pull</text>
      <text x="164" y="273" fill="#d29472">store raw</text>
      <text x="164" y="369" fill="#92aee0">normalise</text>
      <text x="164" y="465" fill="#e0b955">promote</text>
    </g>

    <!-- column 2, the hand-off across the channel, and the work inside the worker -->
    <g fill="none" stroke="#b79cff" stroke-width="1.3">
      <path d="M450 156V184"/>
      <path d="M450 252V280"/>
      <path d="M450 348V376"/>
      <path d="M552 416H600V512H684"/>
      <path d="M786 540V616"/>
      <path d="M786 684V712"/>
      <path d="M786 780V844"/>
      <path d="M786 812H1002V844"/>
    </g>
    <g fill="#b79cff">
      <path d="M444 184 450 196 456 184z"/>
      <path d="M444 280 450 292 456 280z"/>
      <path d="M444 376 450 388 456 376z"/>
      <path d="M684 506 696 512 684 518z"/>
      <path d="M780 616 786 628 792 616z"/>
      <path d="M780 712 786 724 792 712z"/>
      <path d="M780 844 786 856 792 844z"/>
      <path d="M996 844 1002 856 1008 844z"/>
    </g>
    <text x="642" y="504" font-size="9.5" fill="#b79cff" text-anchor="middle">consume</text>
    <text x="800" y="708" font-size="9.5" fill="#b79cff">delegate</text>

    <!-- the only way into the data, along the floor below the first two columns -->
    <path d="M210 540V884H684" fill="none" stroke="#e0b955" stroke-width="1.5"/>
    <path d="M684 878 696 884 684 890z" fill="#e0b955"/>
    <text x="440" y="876" font-size="9.5" fill="#e0b955" text-anchor="middle">read only</text>

    <!-- the answer goes back the way it was asked -->
    <g fill="none" stroke="#b79cff" stroke-width="1.3" stroke-dasharray="4 4" opacity="0.6">
      <path d="M696 656H300V132H336"/>
    </g>
    <path d="M336 126 348 132 336 138z" fill="#b79cff" opacity="0.6"/>
    <text x="498" y="648" font-size="9.5" fill="#b79cff" opacity="0.7" text-anchor="middle">stream</text>

    <text x="600" y="978" font-size="11" fill="#655d79" text-anchor="middle">every component emits a span, on one trace</text>
  </g>
</svg>
