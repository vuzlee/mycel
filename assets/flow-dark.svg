<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" width="1120" height="300"
     role="img" aria-label="Jira syncs into bronze then gold; a question goes to Ask, which routes it to whichever agent can answer">
  <!-- Draws only what has held still for twenty batches. The agents are deliberately one
       box, not three: naming them here means redrawing this file the day one is added,
       and docs/architecture.html is where the roster belongs. -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">

    <g>
      <rect x="40" y="40" width="150" height="64" rx="12" fill="#131019" stroke="#332c42"/>
      <text x="115" y="68" font-size="17" fill="#f0edf7" text-anchor="middle">Jira</text>
      <text x="115" y="88" font-size="12" fill="#6b6380" text-anchor="middle">source of record</text>
    </g>
    <g>
      <rect x="270" y="40" width="150" height="64" rx="12" fill="#0f0d15" stroke="#332c42"/>
      <text x="345" y="68" font-size="17" fill="#f0edf7" text-anchor="middle">bronze</text>
      <text x="345" y="88" font-size="12" fill="#6b6380" text-anchor="middle">raw</text>
    </g>
    <g>
      <rect x="500" y="40" width="150" height="64" rx="12" fill="#1d1730" stroke="#3a2f5c"/>
      <text x="575" y="68" font-size="17" fill="#f0edf7" text-anchor="middle">gold</text>
      <text x="575" y="88" font-size="12" fill="#6b6380" text-anchor="middle">ready to query</text>
    </g>

    <g>
      <rect x="40" y="196" width="150" height="64" rx="12" fill="#131019" stroke="#332c42"/>
      <text x="115" y="224" font-size="17" fill="#f0edf7" text-anchor="middle">your question</text>
      <text x="115" y="244" font-size="12" fill="#6b6380" text-anchor="middle">plain language</text>
    </g>

    <g>
      <rect x="500" y="184" width="150" height="88" rx="12" fill="#b79cff"/>
      <text x="575" y="220" font-size="19" fill="#14101d" text-anchor="middle">Ask</text>
      <text x="575" y="242" font-size="12" fill="#14101d" text-anchor="middle">an orchestrator</text>
      <text x="575" y="258" font-size="12" fill="#14101d" text-anchor="middle">picks who answers</text>
    </g>

    <!-- The agents, as a set rather than a list. The three discs say "several peers"
         without committing to which, so adding one does not date the picture. -->
    <g>
      <rect x="770" y="176" width="310" height="104" rx="12" fill="#131019" stroke="#3a2f5c"/>
      <g fill="#b79cff">
        <circle cx="810" cy="212" r="7"/>
        <circle cx="834" cy="212" r="7" opacity="0.66"/>
        <circle cx="858" cy="212" r="7" opacity="0.4"/>
      </g>
      <text x="882" y="217" font-size="16" fill="#f0edf7">specialist agents</text>
      <text x="794" y="250" font-size="12" fill="#6b6380">each with its own tools: gold over SQL,</text>
      <text x="794" y="268" font-size="12" fill="#6b6380">the web, your mailbox</text>
    </g>

    <!-- arrows. Explicit triangles rather than <marker>, which a sanitiser drops first
         and a simple renderer ignores; a headless arrow reads as an unfinished line. -->
    <g fill="none" stroke="#b79cff" stroke-width="2">
      <path d="M190 72H256"/>
      <path d="M420 72H486"/>
      <path d="M575 104V170"/>
      <path d="M190 228H486"/>
      <path d="M650 228H756"/>
    </g>
    <g fill="#b79cff">
      <path d="M256 66 268 72 256 78z"/>
      <path d="M486 66 498 72 486 78z"/>
      <path d="M569 170 575 182 581 170z"/>
      <path d="M486 222 498 228 486 234z"/>
      <path d="M756 222 768 228 756 234z"/>
    </g>

    <text x="591" y="142" font-size="12" fill="#6b6380">reads</text>
  </g>
</svg>
