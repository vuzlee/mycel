<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640"
     role="img" aria-label="Mycel end to end: a scheduler pulls Jira into the sources layer, which writes bronze verbatim; etl normalises bronze to silver and promotes silver to gold, with checks between every step. A question posted to the api returns a job id and goes on the queue, failing into jobs.retry or jobs.dlq; a worker pulls it, and an orchestrator delegates to whichever specialist agents can answer, reading gold only. The answer streams back over SSE. Every box emits a span, and traces, metrics and logs share one trace id.">
  <!-- Drawn in the same hand as the four-layer figure in docs/architecture.html: one
       colour per medallion layer, mono for names and sans for what they are, the label
       on the arrow rather than beside it.

       Four bands, because the system has four jobs: get the data in, take the question,
       answer it, and watch the whole thing. No agent is named anywhere — the roster is
       prose, in docs/architecture.html, because prose is corrected in one pass and a
       drawing is the last thing anyone remembers to redraw. -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">

    <!-- ══ band 1 · ingest ══════════════════════════════════════════════════ -->
    <rect x="24" y="24" width="1152" height="192" rx="3" fill="none"
          stroke="#241f30" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="40" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" letter-spacing="1.6" fill="#6b6380">INGEST · ON A SCHEDULE</text>

    <rect x="48" y="76" width="120" height="56" rx="2" fill="#131019" stroke="#241f30"/>
    <text x="108" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12.5" fill="#f0edf7" text-anchor="middle">Jira</text>
    <text x="108" y="118" font-size="10.5" fill="#8f87a3" text-anchor="middle">source of record</text>

    <rect x="244" y="76" width="150" height="56" rx="2" fill="#2a1d16" stroke="#d29472" stroke-width="1.4"/>
    <text x="260" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12.5" fill="#d29472">sources/</text>
    <text x="260" y="118" font-size="10.5" fill="#8f87a3">pull in, no processing</text>

    <rect x="470" y="76" width="140" height="56" rx="2" fill="#2a1d16" stroke="#d29472" stroke-width="1.4"/>
    <text x="486" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12.5" fill="#d29472">bronze</text>
    <text x="486" y="118" font-size="10.5" fill="#8f87a3">immutable payload</text>

    <rect x="686" y="76" width="140" height="56" rx="2" fill="#18202c" stroke="#92aee0" stroke-width="1.4"/>
    <text x="702" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12.5" fill="#92aee0">silver</text>
    <text x="702" y="118" font-size="10.5" fill="#8f87a3">normalised, deduped</text>

    <rect x="902" y="76" width="140" height="56" rx="2" fill="#1d1730" stroke="#b79cff" stroke-width="1.8"/>
    <text x="918" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12.5" fill="#b79cff">gold</text>
    <text x="918" y="118" font-size="10.5" fill="#8f87a3">business tables</text>

    <!-- the three schemas are one database -->
    <path d="M470 150 V160 H1042 V150" fill="none" stroke="#241f30" stroke-width="1.2"/>
    <text x="756" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" letter-spacing="1.4" fill="#6b6380" text-anchor="middle">POSTGRESQL — ONE DATABASE, THREE SCHEMAS</text>
    <text x="756" y="199" font-size="10.5" fill="#6b6380" text-anchor="middle">etl/ — idempotent steps, with checks between every one</text>

    <!-- ══ band 2 · ask ═════════════════════════════════════════════════════ -->
    <rect x="24" y="238" width="568" height="192" rx="3" fill="none"
          stroke="#241f30" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="40" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" letter-spacing="1.6" fill="#6b6380">ASK · ONE WAY IN</text>

    <rect x="48" y="282" width="150" height="56" rx="2" fill="#131019" stroke="#241f30"/>
    <text x="123" y="306" font-size="12.5" fill="#f0edf7" text-anchor="middle">your question</text>
    <text x="123" y="324" font-size="10.5" fill="#8f87a3" text-anchor="middle">plain language</text>

    <rect x="236" y="282" width="150" height="56" rx="2" fill="#131019" stroke="#241f30"/>
    <text x="252" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12.5" fill="#f0edf7">api/</text>
    <text x="252" y="324" font-size="10.5" fill="#8f87a3">a job id at once</text>

    <rect x="424" y="282" width="144" height="56" rx="2" fill="#131019" stroke="#b79cff" stroke-width="1.4"/>
    <text x="440" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12.5" fill="#b79cff">mycel.jobs</text>
    <text x="440" y="324" font-size="10.5" fill="#8f87a3">the queue</text>

    <text x="536" y="350" font-size="10" fill="#6b6380" text-anchor="start">on failure</text>
    <text x="48" y="378" font-size="10.5" fill="#6b6380">at-least-once delivery, so every job</text>
    <text x="48" y="394" font-size="10.5" fill="#6b6380">carries an idempotency key</text>

    <rect x="300" y="366" width="130" height="44" rx="2" fill="#131019" stroke="#241f30"/>
    <text x="314" y="386" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" fill="#8f87a3">jobs.retry</text>
    <text x="314" y="401" font-size="9.5" fill="#6b6380">TTL, then back</text>

    <rect x="438" y="366" width="130" height="44" rx="2" fill="#131019" stroke="#241f30"/>
    <text x="452" y="386" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" fill="#8f87a3">jobs.dlq</text>
    <text x="452" y="401" font-size="9.5" fill="#6b6380">nothing consumes it</text>

    <!-- ══ band 3 · answer ══════════════════════════════════════════════════ -->
    <rect x="616" y="238" width="560" height="192" rx="3" fill="none"
          stroke="#241f30" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="632" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" letter-spacing="1.6" fill="#6b6380">ANSWER · IN THE WORKER</text>

    <rect x="640" y="282" width="180" height="56" rx="2" fill="#1d1730" stroke="#b79cff" stroke-width="1.8"/>
    <text x="656" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12.5" fill="#b79cff">orchestrator</text>
    <text x="656" y="324" font-size="10.5" fill="#8f87a3">splits the work, merges it back</text>

    <rect x="858" y="282" width="294" height="56" rx="2" fill="#131019" stroke="#b79cff" stroke-width="1.4"/>
    <g fill="#b79cff">
      <circle cx="882" cy="310" r="6"/>
      <circle cx="902" cy="310" r="6" opacity="0.6"/>
      <circle cx="922" cy="310" r="6" opacity="0.32"/>
    </g>
    <text x="944" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12" fill="#f0edf7">specialists</text>
    <text x="944" y="324" font-size="10.5" fill="#8f87a3">one per capability</text>

    <text x="858" y="374" font-size="10.5" fill="#6b6380">each differs only by the tools it is given —</text>
    <text x="858" y="392" font-size="10.5" fill="#6b6380">gold over read-only SQL · the web · your mailbox</text>

    <!-- ══ band 4 · observability ═══════════════════════════════════════════ -->
    <rect x="24" y="478" width="1152" height="116" rx="3" fill="none"
          stroke="#241f30" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="40" y="506" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" letter-spacing="1.6" fill="#6b6380">OBSERVABILITY · EVERY BOX ABOVE EMITS A SPAN</text>

    <rect x="48" y="522" width="264" height="48" rx="2" fill="#131019" stroke="#241f30"/>
    <text x="64" y="542" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11.5" fill="#f0edf7">traces</text>
    <text x="64" y="559" font-size="10.5" fill="#8f87a3">where a run went, and what it cost</text>

    <rect x="336" y="522" width="264" height="48" rx="2" fill="#131019" stroke="#241f30"/>
    <text x="352" y="542" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11.5" fill="#f0edf7">metrics</text>
    <text x="352" y="559" font-size="10.5" fill="#8f87a3">whether it is broken right now</text>

    <rect x="624" y="522" width="264" height="48" rx="2" fill="#131019" stroke="#241f30"/>
    <text x="640" y="542" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11.5" fill="#f0edf7">logs</text>
    <text x="640" y="559" font-size="10.5" fill="#8f87a3">why</text>

    <rect x="912" y="522" width="240" height="48" rx="2" fill="#1d1730" stroke="#b79cff" stroke-width="1.2"/>
    <text x="1032" y="542" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11.5" fill="#b79cff" text-anchor="middle">one trace id</text>
    <text x="1032" y="559" font-size="10.5" fill="#8f87a3" text-anchor="middle">joins all three</text>

    <!-- ══ arrows. Explicit triangles rather than <marker>: a sanitiser drops
         a marker first, and a simple renderer ignores it. ══════════════════ -->

    <!-- band 1, with the label on the arrow -->
    <g fill="none" stroke="#d29472" stroke-width="1.4">
      <path d="M168 104H230"/>
      <path d="M394 104H456"/>
    </g>
    <g fill="#d29472">
      <path d="M230 98 242 104 230 110z"/>
      <path d="M456 98 468 104 456 110z"/>
    </g>
    <path d="M610 104H672" fill="none" stroke="#92aee0" stroke-width="1.4"/>
    <path d="M672 98 684 104 672 110z" fill="#92aee0"/>
    <path d="M826 104H888" fill="none" stroke="#b79cff" stroke-width="1.4"/>
    <path d="M888 98 900 104 888 110z" fill="#b79cff"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" text-anchor="middle">
      <text x="205" y="96" fill="#6b6380">HTTP</text>
      <text x="431" y="96" fill="#d29472">write verbatim</text>
      <text x="647" y="96" fill="#92aee0">normalise</text>
      <text x="863" y="96" fill="#b79cff">promote</text>
    </g>

    <!-- band 2 -->
    <g fill="none" stroke="#b79cff" stroke-width="1.4">
      <path d="M198 310H220"/>
      <path d="M386 310H408"/>
    </g>
    <g fill="#b79cff">
      <path d="M220 304 232 310 220 316z"/>
      <path d="M408 304 420 310 408 316z"/>
    </g>

    <!-- the queue's two failure exits, both leaving where the decision is taken -->
    <g fill="none" stroke="#6b6380" stroke-width="1.2" stroke-dasharray="3 3">
      <path d="M460 338V352H365V354"/>
      <path d="M500 338V354"/>
    </g>
    <g fill="#6b6380">
      <path d="M359 354 365 366 371 354z"/>
      <path d="M494 354 500 366 506 354z"/>
    </g>

    <!-- queue -> worker, the hand-off between bands -->
    <path d="M568 310H626" fill="none" stroke="#b79cff" stroke-width="1.4"/>
    <path d="M626 304 638 310 626 316z" fill="#b79cff"/>
    <text x="597" y="299" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="8.5" fill="#6b6380" text-anchor="middle">a worker</text>
    <text x="597" y="329" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="8.5" fill="#6b6380" text-anchor="middle">pulls it</text>

    <!-- band 3 -->
    <path d="M820 310H842" fill="none" stroke="#b79cff" stroke-width="1.4"/>
    <path d="M842 304 854 310 842 316z" fill="#b79cff"/>

    <!-- the only way out of the database -->
    <path d="M1090 282V138H990V144" fill="none" stroke="#b79cff" stroke-width="1.6"/>
    <path d="M984 144 990 132 996 144z" fill="#b79cff"/>
    <text x="1100" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="9" fill="#b79cff">reads gold only</text>

    <!-- the answer comes back the way it was asked -->
    <g fill="none" stroke="#b79cff" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.65">
      <path d="M730 338V452H36V310H42"/>
    </g>
    <path d="M42 304 54 310 42 316z" fill="#b79cff" opacity="0.65"/>
    <text x="430" y="446" font-size="10" fill="#6b6380" text-anchor="middle">the answer streams back over SSE, written as it arrives</text>

    <!-- everything above hangs off the band below -->
    <g fill="none" stroke="#241f30" stroke-width="1.2" stroke-dasharray="3 3">
      <path d="M900 478V440"/>
    </g>
    <path d="M894 440 900 430 906 440z" fill="#241f30"/>

    <text x="600" y="622" font-size="10.5" fill="#6b6380" text-anchor="middle">a slow or expensive answer is one trace away from an explanation</text>
  </g>
</svg>
