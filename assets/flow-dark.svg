<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720"
     role="img" aria-label="Mycel at a glance, in four columns. Ingest: a scheduler drives connectors that pull each external platform into a bronze, silver and gold data lakehouse. Request: a prompt goes through the API gateway and its middleware, which publishes a job to the message broker and returns an id. Processing: a consumer picks the job up, an orchestrator delegates to specialist agents, and the agents read gold. The answer streams back to the client. Observability: traces, metrics and logs.">
  <!-- High-level design. Components and their contracts — not modules, not folders, not
       what is inside a component. docs/architecture.html is where the detail belongs.

       Four columns, four concerns: get the data in, take the request, process it, observe
       it. Each column reads top to bottom.

       Grid, so a later edit does not re-derive it. Columns are 252 wide at x = 24, 324,
       624, 924, with a 48 channel between them; every arrow that leaves a column runs in
       a channel. Rows pitch 96 from y = 100; boxes are 204 x 56. A column's frame ends 24
       below its last box, or 60 where a caption follows. A column starts at the row its
       work starts on. Every line stops 12 short of its target and the triangle covers
       that 12, so the two always meet. -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">

    <!-- ══ column 1 · ingest ═════════════════════════════════════════════════ -->
    <rect x="24" y="36" width="252" height="564" rx="4" fill="none"
          stroke="#4a4162" stroke-width="1.3" stroke-dasharray="6 5"/>
    <text x="48" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" letter-spacing="1.2" fill="#655d79">INGEST</text>

    <rect x="48" y="100" width="204" height="56" rx="2" fill="#131019" stroke="#241f30"/>
    <text x="150" y="134" font-size="14" fill="#f0edf7" text-anchor="middle">External Platforms</text>

    <rect x="48" y="196" width="204" height="56" rx="2" fill="#131019" stroke="#241f30"/>
    <text x="150" y="230" font-size="14" fill="#f0edf7" text-anchor="middle">Connectors</text>

    <rect x="48" y="292" width="204" height="56" rx="2" fill="#25190f" stroke="#d29472" stroke-width="1.3"/>
    <text x="150" y="326" font-size="14" fill="#d29472" text-anchor="middle">Bronze</text>

    <rect x="48" y="388" width="204" height="56" rx="2" fill="#141b26" stroke="#92aee0" stroke-width="1.3"/>
    <text x="150" y="422" font-size="14" fill="#92aee0" text-anchor="middle">Silver</text>

    <rect x="48" y="484" width="204" height="56" rx="2" fill="#2a2111" stroke="#e0b955" stroke-width="1.6"/>
    <text x="150" y="518" font-size="14" fill="#e0b955" text-anchor="middle">Gold</text>

    <text x="48" y="574" font-size="11" fill="#655d79">Data Lakehouse</text>

    <!-- ══ column 2 · request ════════════════════════════════════════════════ -->
    <rect x="324" y="36" width="252" height="432" rx="4" fill="none"
          stroke="#4a4162" stroke-width="1.3" stroke-dasharray="6 5"/>
    <text x="348" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" letter-spacing="1.2" fill="#655d79">REQUEST · PRODUCER</text>

    <rect x="348" y="100" width="204" height="56" rx="2" fill="#131019" stroke="#241f30"/>
    <text x="450" y="134" font-size="14" fill="#f0edf7" text-anchor="middle">Prompt</text>

    <rect x="348" y="196" width="204" height="56" rx="2" fill="#131019" stroke="#241f30"/>
    <text x="450" y="230" font-size="14" fill="#f0edf7" text-anchor="middle">API Gateway</text>

    <rect x="348" y="292" width="204" height="56" rx="2" fill="#131019" stroke="#241f30"/>
    <text x="450" y="326" font-size="14" fill="#f0edf7" text-anchor="middle">Middleware</text>

    <rect x="348" y="388" width="204" height="56" rx="2" fill="#1d1730" stroke="#b79cff" stroke-width="1.6"/>
    <text x="450" y="422" font-size="14" fill="#b79cff" text-anchor="middle">Message Broker</text>

    <!-- ══ column 3 · processing ═════════════════════════════════════════════ -->
    <rect x="624" y="324" width="252" height="336" rx="4" fill="none"
          stroke="#4a4162" stroke-width="1.3" stroke-dasharray="6 5"/>
    <text x="648" y="360" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" letter-spacing="1.2" fill="#655d79">PROCESSING · CONSUMER</text>

    <rect x="648" y="388" width="204" height="56" rx="2" fill="#131019" stroke="#b79cff" stroke-width="1.3"/>
    <text x="750" y="422" font-size="14" fill="#b79cff" text-anchor="middle">Worker</text>

    <rect x="648" y="484" width="204" height="56" rx="2" fill="#1d1730" stroke="#b79cff" stroke-width="1.6"/>
    <text x="750" y="518" font-size="14" fill="#b79cff" text-anchor="middle">Orchestrator</text>

    <rect x="648" y="580" width="204" height="56" rx="2" fill="#131019" stroke="#b79cff" stroke-width="1.3"/>
    <text x="738" y="614" font-size="14" fill="#f0edf7" text-anchor="middle">Agents</text>
    <g fill="#b79cff">
      <circle cx="800" cy="609" r="5"/>
      <circle cx="818" cy="609" r="5" opacity="0.58"/>
      <circle cx="836" cy="609" r="5" opacity="0.3"/>
    </g>

    <!-- ══ column 4 · observability ══════════════════════════════════════════ -->
    <rect x="924" y="36" width="252" height="340" rx="4" fill="none"
          stroke="#4a4162" stroke-width="1.3" stroke-dasharray="6 5"/>
    <text x="948" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" letter-spacing="1.2" fill="#655d79">OBSERVABILITY</text>

    <rect x="948" y="100" width="204" height="56" rx="2" fill="#131019" stroke="#241f30"/>
    <text x="1050" y="134" font-size="14" fill="#f0edf7" text-anchor="middle">Traces</text>

    <rect x="948" y="196" width="204" height="56" rx="2" fill="#131019" stroke="#241f30"/>
    <text x="1050" y="230" font-size="14" fill="#f0edf7" text-anchor="middle">Metrics</text>

    <rect x="948" y="292" width="204" height="56" rx="2" fill="#131019" stroke="#241f30"/>
    <text x="1050" y="326" font-size="14" fill="#f0edf7" text-anchor="middle">Logs</text>

    <!-- ══ arrows ════════════════════════════════════════════════════════════ -->

    <!-- column 1, each arrow carrying the step it performs -->
    <g fill="none" stroke="#d29472" stroke-width="1.3">
      <path d="M150 156V184"/>
      <path d="M150 252V280"/>
    </g>
    <g fill="#d29472">
      <path d="M144 184 150 196 156 184z"/>
      <path d="M144 280 150 292 156 280z"/>
    </g>
    <path d="M150 348V376" fill="none" stroke="#92aee0" stroke-width="1.3"/>
    <path d="M144 376 150 388 156 376z" fill="#92aee0"/>
    <path d="M150 444V472" fill="none" stroke="#e0b955" stroke-width="1.3"/>
    <path d="M144 472 150 484 156 472z" fill="#e0b955"/>

    <g font-size="9.5">
      <text x="164" y="177" fill="#d29472">pull</text>
      <text x="164" y="273" fill="#d29472">store raw</text>
      <text x="164" y="369" fill="#92aee0">normalise</text>
      <text x="164" y="465" fill="#e0b955">promote</text>
    </g>

    <!-- column 2, and the hand-off across the channel into the worker -->
    <g fill="none" stroke="#b79cff" stroke-width="1.3">
      <path d="M450 156V184"/>
      <path d="M450 252V280"/>
      <path d="M450 348V376"/>
      <path d="M552 416H636"/>
      <path d="M750 444V472"/>
      <path d="M750 540V568"/>
    </g>
    <g fill="#b79cff">
      <path d="M444 184 450 196 456 184z"/>
      <path d="M444 280 450 292 456 280z"/>
      <path d="M444 376 450 388 456 376z"/>
      <path d="M636 410 648 416 636 422z"/>
      <path d="M744 472 750 484 756 472z"/>
      <path d="M744 568 750 580 756 568z"/>
    </g>
    <text x="594" y="408" font-size="9.5" fill="#b79cff" text-anchor="middle">consume</text>

    <!-- the only way into the data, along the floor below both columns -->
    <path d="M210 540V632H636" fill="none" stroke="#e0b955" stroke-width="1.5"/>
    <path d="M636 626 648 632 636 638z" fill="#e0b955"/>
    <text x="420" y="624" font-size="9.5" fill="#e0b955" text-anchor="middle">read only</text>

    <!-- the answer goes back the way it was asked -->
    <g fill="none" stroke="#b79cff" stroke-width="1.3" stroke-dasharray="4 4" opacity="0.6">
      <path d="M648 512H300V132H336"/>
    </g>
    <path d="M336 126 348 132 336 138z" fill="#b79cff" opacity="0.6"/>
    <text x="474" y="504" font-size="9.5" fill="#b79cff" opacity="0.7" text-anchor="middle">stream</text>

    <text x="600" y="694" font-size="11" fill="#655d79" text-anchor="middle">every component emits a span, on one trace</text>
  </g>
</svg>
