<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520"
     role="img" aria-label="Mycel end to end: a scheduler pulls Jira through the sources layer into bronze, which etl normalises to silver and promotes to gold. A question posted to the api returns a job id and goes on a queue; a worker pulls it, and an orchestrator delegates to whichever specialist agents can answer, reading gold only. The answer streams back over SSE. Every box emits a span, and traces, metrics and logs share one trace id.">
  <!-- Drawn in the same hand as the four-layer figure in docs/architecture.html: one
       colour per medallion layer, mono for names and sans for what they are, the label
       riding on the arrow rather than beside it.

       Four bands, four jobs: get the data in, take the question, answer it, watch the
       whole thing. Only the blocks someone needs to hold in their head — the retry and
       dead-letter queues are real but they live inside `queue`, and architecture.html
       is where that belongs. No agent is named: the roster is prose, because prose is
       corrected in one pass and a drawing is the last thing anyone remembers to redraw. -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">

    <!-- ══ band 1 · ingest ══════════════════════════════════════════════════ -->
    <rect x="24" y="24" width="1152" height="152" rx="4" fill="none"
          stroke="#201b2b" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="44" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" letter-spacing="1.6" fill="#655d79">INGEST · ON A SCHEDULE</text>

    <rect x="48" y="72" width="140" height="60" rx="2" fill="#131019" stroke="#241f30"/>
    <text x="118" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" fill="#f0edf7" text-anchor="middle">Jira</text>
    <text x="118" y="117" font-size="11" fill="#8f87a3" text-anchor="middle">source of record</text>

    <rect x="272" y="72" width="168" height="60" rx="2" fill="#25190f" stroke="#d29472" stroke-width="1.3"/>
    <text x="290" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" fill="#d29472">sources/</text>
    <text x="290" y="117" font-size="11" fill="#8f87a3">pull in, no processing</text>

    <rect x="524" y="72" width="160" height="60" rx="2" fill="#25190f" stroke="#d29472" stroke-width="1.3"/>
    <text x="542" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" fill="#d29472">bronze</text>
    <text x="542" y="117" font-size="11" fill="#8f87a3">immutable payload</text>

    <rect x="768" y="72" width="160" height="60" rx="2" fill="#141b26" stroke="#92aee0" stroke-width="1.3"/>
    <text x="786" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" fill="#92aee0">silver</text>
    <text x="786" y="117" font-size="11" fill="#8f87a3">normalised, deduped</text>

    <rect x="1012" y="72" width="140" height="60" rx="2" fill="#1d1730" stroke="#b79cff" stroke-width="1.6"/>
    <text x="1030" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" fill="#b79cff">gold</text>
    <text x="1030" y="117" font-size="11" fill="#8f87a3">business tables</text>

    <text x="838" y="160" font-size="10.5" fill="#655d79" text-anchor="middle">one database, three schemas — etl/ steps are idempotent, with checks between every one</text>

    <!-- ══ band 2 · ask ═════════════════════════════════════════════════════ -->
    <rect x="24" y="200" width="568" height="152" rx="4" fill="none"
          stroke="#201b2b" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="44" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" letter-spacing="1.6" fill="#655d79">ASK · ONE WAY IN</text>

    <rect x="48" y="248" width="150" height="60" rx="2" fill="#131019" stroke="#241f30"/>
    <text x="123" y="274" font-size="13" fill="#f0edf7" text-anchor="middle">your question</text>
    <text x="123" y="293" font-size="11" fill="#8f87a3" text-anchor="middle">plain language</text>

    <rect x="240" y="248" width="150" height="60" rx="2" fill="#131019" stroke="#241f30"/>
    <text x="258" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" fill="#f0edf7">api/</text>
    <text x="258" y="293" font-size="11" fill="#8f87a3">a job id at once</text>

    <rect x="432" y="248" width="136" height="60" rx="2" fill="#131019" stroke="#b79cff" stroke-width="1.3"/>
    <text x="450" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" fill="#b79cff">queue</text>
    <text x="450" y="293" font-size="11" fill="#8f87a3">retries, gives up</text>

    <text x="48" y="326" font-size="10.5" fill="#655d79">nothing is answered inside the request —</text>
    <text x="48" y="342" font-size="10.5" fill="#655d79">you get an id, and the answer arrives on its own</text>

    <!-- ══ band 3 · answer ══════════════════════════════════════════════════ -->
    <rect x="616" y="200" width="560" height="152" rx="4" fill="none"
          stroke="#201b2b" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="636" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" letter-spacing="1.6" fill="#655d79">ANSWER · IN THE WORKER</text>

    <rect x="640" y="248" width="180" height="60" rx="2" fill="#1d1730" stroke="#b79cff" stroke-width="1.6"/>
    <text x="658" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" fill="#b79cff">orchestrator</text>
    <text x="658" y="293" font-size="11" fill="#8f87a3">splits the work, merges it</text>

    <rect x="862" y="248" width="290" height="60" rx="2" fill="#131019" stroke="#b79cff" stroke-width="1.3"/>
    <g fill="#b79cff">
      <circle cx="886" cy="278" r="6"/>
      <circle cx="906" cy="278" r="6" opacity="0.58"/>
      <circle cx="926" cy="278" r="6" opacity="0.3"/>
    </g>
    <text x="950" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" fill="#f0edf7">specialists</text>
    <text x="950" y="293" font-size="11" fill="#8f87a3">one per capability</text>

    <text x="772" y="326" font-size="10.5" fill="#655d79">each differs only by the tools it is given —</text>
    <text x="772" y="342" font-size="10.5" fill="#655d79">gold over read-only SQL · the web · your mailbox</text>

    <!-- ══ band 4 · observability ═══════════════════════════════════════════ -->
    <rect x="24" y="376" width="1152" height="112" rx="4" fill="none"
          stroke="#201b2b" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="44" y="404" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" letter-spacing="1.6" fill="#655d79">OBSERVABILITY · EVERY BOX ABOVE EMITS A SPAN</text>

    <rect x="48" y="420" width="264" height="48" rx="2" fill="#131019" stroke="#241f30"/>
    <text x="66" y="440" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12" fill="#f0edf7">traces</text>
    <text x="66" y="457" font-size="11" fill="#8f87a3">where a run went, and what it cost</text>

    <rect x="336" y="420" width="264" height="48" rx="2" fill="#131019" stroke="#241f30"/>
    <text x="354" y="440" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12" fill="#f0edf7">metrics</text>
    <text x="354" y="457" font-size="11" fill="#8f87a3">whether it is broken right now</text>

    <rect x="624" y="420" width="264" height="48" rx="2" fill="#131019" stroke="#241f30"/>
    <text x="642" y="440" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12" fill="#f0edf7">logs</text>
    <text x="642" y="457" font-size="11" fill="#8f87a3">why</text>

    <rect x="912" y="420" width="240" height="48" rx="2" fill="#1d1730" stroke="#b79cff" stroke-width="1.2"/>
    <text x="1032" y="440" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12" fill="#b79cff" text-anchor="middle">one trace id</text>
    <text x="1032" y="457" font-size="11" fill="#8f87a3" text-anchor="middle">joins all three</text>

    <!-- ══ arrows. Explicit triangles rather than <marker>: a sanitiser drops
         a marker first, and a simple renderer ignores it. ══════════════════ -->
    <g fill="none" stroke="#d29472" stroke-width="1.3">
      <path d="M188 102H252"/>
      <path d="M440 102H504"/>
    </g>
    <g fill="#d29472">
      <path d="M252 96 264 102 252 108z"/>
      <path d="M504 96 516 102 504 108z"/>
    </g>
    <path d="M684 102H748" fill="none" stroke="#92aee0" stroke-width="1.3"/>
    <path d="M748 96 760 102 748 108z" fill="#92aee0"/>
    <path d="M928 102H992" fill="none" stroke="#b79cff" stroke-width="1.3"/>
    <path d="M992 96 1004 102 992 108z" fill="#b79cff"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" text-anchor="middle">
      <text x="226" y="94" fill="#655d79">HTTP</text>
      <text x="478" y="94" fill="#d29472">write verbatim</text>
      <text x="722" y="94" fill="#92aee0">normalise</text>
      <text x="966" y="94" fill="#b79cff">promote</text>
    </g>

    <g fill="none" stroke="#b79cff" stroke-width="1.3">
      <path d="M198 278H220"/>
      <path d="M390 278H412"/>
      <path d="M568 278H626"/>
      <path d="M820 278H842"/>
    </g>
    <g fill="#b79cff">
      <path d="M220 272 232 278 220 284z"/>
      <path d="M412 272 424 278 412 284z"/>
      <path d="M626 272 638 278 626 284z"/>
      <path d="M842 272 854 278 842 284z"/>
    </g>
    <text x="597" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="9" fill="#655d79" text-anchor="middle">a worker</text>
    <text x="597" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="9" fill="#655d79" text-anchor="middle">pulls it</text>

    <!-- the only way out of the database -->
    <path d="M1090 248V144" fill="none" stroke="#b79cff" stroke-width="1.5"/>
    <path d="M1084 144 1090 132 1096 144z" fill="#b79cff"/>
    <text x="1102" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="9" fill="#b79cff">reads gold only</text>

    <!-- the answer comes back the way it was asked -->
    <g fill="none" stroke="#b79cff" stroke-width="1.3" stroke-dasharray="4 4" opacity="0.6">
      <path d="M730 308V366H34V284"/>
    </g>
    <path d="M28 284 34 272 40 284z" fill="#b79cff" opacity="0.6"/>
    <text x="400" y="362" font-size="10.5" fill="#655d79" text-anchor="middle">the answer streams back over SSE, written as it arrives</text>

    <text x="600" y="508" font-size="10.5" fill="#655d79" text-anchor="middle">a slow or expensive answer is one trace away from an explanation</text>
  </g>
</svg>
