<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700"
     role="img" aria-label="Mycel end to end: a scheduler pulls the external sources into a bronze raw layer, which the ETL pipeline normalises to silver and promotes to gold. A question posted to the API returns a job id and goes on a message queue; a worker pulls it, and an orchestrator delegates to whichever specialist agents can answer, reading gold only. The answer streams back over SSE. Every component emits a span, and traces, metrics and logs share one trace id.">
  <!-- Components, not folders. This is a system diagram: it says what the parts are and
       how a request moves between them, so it stays true through a refactor that renames
       every module. docs/architecture.html is where the code layout belongs.

       Four bands, four jobs: get the data in, take the question, answer it, watch the
       whole thing. Major components only — the connector layer, the retry and the
       dead-letter queues are all real, and all inside a box drawn here.

       No agent is named: the roster is prose, because prose is corrected in one pass and
       a drawing is the last thing anyone remembers to redraw.

       Geometry, so a later edit does not have to re-derive it. The bands are 190 tall
       with 58 between them, and every arrow that leaves a band runs in that gap — which
       is why the gap is wider than it looks like it needs to be. Boxes are 68 tall at
       the band's y+58, so a caption can sit under them without touching the frame. Every
       line stops 12 short of its target and the triangle covers that 12, so the two
       always meet. -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">

    <!-- ══ band 1 · ingest ══════════════════════════════════════════════════ -->
    <rect x="24" y="24" width="1152" height="190" rx="4" fill="none"
          stroke="#4a4162" stroke-width="1.3" stroke-dasharray="6 5"/>
    <text x="48" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" letter-spacing="1.6" fill="#655d79">INGEST · ON A SCHEDULE</text>

    <rect x="48" y="82" width="186" height="68" rx="2" fill="#131019" stroke="#241f30"/>
    <text x="68" y="112" font-size="14" fill="#f0edf7">External sources</text>
    <text x="68" y="132" font-size="11" fill="#8f87a3">Jira today — the layer is pluggable</text>

    <rect x="354" y="82" width="186" height="68" rx="2" fill="#25190f" stroke="#d29472" stroke-width="1.3"/>
    <text x="374" y="112" font-size="14" fill="#d29472">Bronze</text>
    <text x="374" y="132" font-size="11" fill="#8f87a3">raw, exactly as it arrived</text>

    <rect x="660" y="82" width="186" height="68" rx="2" fill="#141b26" stroke="#92aee0" stroke-width="1.3"/>
    <text x="680" y="112" font-size="14" fill="#92aee0">Silver</text>
    <text x="680" y="132" font-size="11" fill="#8f87a3">normalised, deduped</text>

    <rect x="966" y="82" width="186" height="68" rx="2" fill="#1d1730" stroke="#b79cff" stroke-width="1.6"/>
    <text x="986" y="112" font-size="14" fill="#b79cff">Gold</text>
    <text x="986" y="132" font-size="11" fill="#8f87a3">business tables, ready to query</text>

    <text x="354" y="184" font-size="10.5" fill="#655d79">one database, three schemas — every ETL step is idempotent, with checks between each one</text>

    <!-- ══ band 2 · ask ═════════════════════════════════════════════════════ -->
    <rect x="24" y="272" width="568" height="190" rx="4" fill="none"
          stroke="#4a4162" stroke-width="1.3" stroke-dasharray="6 5"/>
    <text x="48" y="304" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" letter-spacing="1.6" fill="#655d79">ASK · ONE WAY IN</text>

    <rect x="48" y="330" width="152" height="68" rx="2" fill="#131019" stroke="#241f30"/>
    <text x="124" y="360" font-size="14" fill="#f0edf7" text-anchor="middle">Your question</text>
    <text x="124" y="380" font-size="11" fill="#8f87a3" text-anchor="middle">plain language</text>

    <rect x="240" y="330" width="152" height="68" rx="2" fill="#131019" stroke="#241f30"/>
    <text x="260" y="360" font-size="14" fill="#f0edf7">API</text>
    <text x="260" y="380" font-size="11" fill="#8f87a3">returns a job id</text>

    <rect x="432" y="330" width="136" height="68" rx="2" fill="#131019" stroke="#b79cff" stroke-width="1.3"/>
    <text x="452" y="360" font-size="14" fill="#b79cff">Queue</text>
    <text x="452" y="380" font-size="11" fill="#8f87a3">retries, gives up</text>

    <text x="48" y="428" font-size="10.5" fill="#655d79">nothing is answered inside the request —</text>
    <text x="48" y="444" font-size="10.5" fill="#655d79">you get an id, and the answer arrives on its own</text>

    <!-- ══ band 3 · answer ══════════════════════════════════════════════════ -->
    <rect x="616" y="272" width="560" height="190" rx="4" fill="none"
          stroke="#4a4162" stroke-width="1.3" stroke-dasharray="6 5"/>
    <text x="640" y="304" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" letter-spacing="1.6" fill="#655d79">ANSWER · IN THE WORKER</text>

    <rect x="640" y="330" width="180" height="68" rx="2" fill="#1d1730" stroke="#b79cff" stroke-width="1.6"/>
    <text x="660" y="360" font-size="14" fill="#b79cff">Orchestrator</text>
    <text x="660" y="380" font-size="11" fill="#8f87a3">splits the work, merges it</text>

    <rect x="862" y="330" width="290" height="68" rx="2" fill="#131019" stroke="#b79cff" stroke-width="1.3"/>
    <g fill="#b79cff">
      <circle cx="886" cy="364" r="6"/>
      <circle cx="906" cy="364" r="6" opacity="0.58"/>
      <circle cx="926" cy="364" r="6" opacity="0.3"/>
    </g>
    <text x="950" y="360" font-size="14" fill="#f0edf7">Specialist agents</text>
    <text x="950" y="380" font-size="11" fill="#8f87a3">one per capability</text>

    <text x="772" y="428" font-size="10.5" fill="#655d79">each differs only by the tools it is given —</text>
    <text x="772" y="444" font-size="10.5" fill="#655d79">gold over read-only SQL · the web · your mailbox</text>

    <!-- ══ band 4 · observability ═══════════════════════════════════════════ -->
    <rect x="24" y="520" width="1152" height="140" rx="4" fill="none"
          stroke="#4a4162" stroke-width="1.3" stroke-dasharray="6 5"/>
    <text x="48" y="552" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" letter-spacing="1.6" fill="#655d79">OBSERVABILITY · EVERY COMPONENT ABOVE EMITS A SPAN</text>

    <rect x="48" y="578" width="264" height="56" rx="2" fill="#131019" stroke="#241f30"/>
    <text x="68" y="603" font-size="13" fill="#f0edf7">Traces</text>
    <text x="68" y="622" font-size="11" fill="#8f87a3">where a run went, and what it cost</text>

    <rect x="336" y="578" width="264" height="56" rx="2" fill="#131019" stroke="#241f30"/>
    <text x="356" y="603" font-size="13" fill="#f0edf7">Metrics</text>
    <text x="356" y="622" font-size="11" fill="#8f87a3">whether it is broken right now</text>

    <rect x="624" y="578" width="264" height="56" rx="2" fill="#131019" stroke="#241f30"/>
    <text x="644" y="603" font-size="13" fill="#f0edf7">Logs</text>
    <text x="644" y="622" font-size="11" fill="#8f87a3">why a run went that way</text>

    <rect x="912" y="578" width="240" height="56" rx="2" fill="#1d1730" stroke="#b79cff" stroke-width="1.3"/>
    <text x="1032" y="603" font-size="13" fill="#b79cff" text-anchor="middle">One trace id</text>
    <text x="1032" y="622" font-size="11" fill="#8f87a3" text-anchor="middle">joins all three</text>

    <!-- ══ arrows ═══════════════════════════════════════════════════════════ -->

    <!-- band 1, each arrow carrying the name of the step it performs -->
    <path d="M234 116H330" fill="none" stroke="#d29472" stroke-width="1.3"/>
    <path d="M330 110 342 116 330 122z" fill="#d29472"/>
    <path d="M540 116H636" fill="none" stroke="#92aee0" stroke-width="1.3"/>
    <path d="M636 110 648 116 636 122z" fill="#92aee0"/>
    <path d="M846 116H942" fill="none" stroke="#b79cff" stroke-width="1.3"/>
    <path d="M942 110 954 116 942 122z" fill="#b79cff"/>

    <g font-size="9.5" text-anchor="middle">
      <text x="288" y="106" fill="#d29472">store verbatim</text>
      <text x="594" y="106" fill="#92aee0">normalise</text>
      <text x="900" y="106" fill="#b79cff">promote</text>
    </g>

    <!-- bands 2 and 3, one chain that happens to cross a frame in the middle -->
    <g fill="none" stroke="#b79cff" stroke-width="1.3">
      <path d="M200 364H228"/>
      <path d="M392 364H420"/>
      <path d="M568 364H626"/>
      <path d="M820 364H850"/>
    </g>
    <g fill="#b79cff">
      <path d="M228 358 240 364 228 370z"/>
      <path d="M420 358 432 364 420 370z"/>
      <path d="M626 358 638 364 626 370z"/>
      <path d="M850 358 862 364 850 370z"/>
    </g>

    <!-- the only way out of the database, drawn in the gap between the bands -->
    <path d="M1060 330V174" fill="none" stroke="#b79cff" stroke-width="1.5"/>
    <path d="M1054 174 1060 162 1066 174z" fill="#b79cff"/>
    <text x="1072" y="248" font-size="9.5" fill="#b79cff">reads gold only</text>

    <!-- the answer comes back the way it was asked, along the gap below both bands -->
    <g fill="none" stroke="#b79cff" stroke-width="1.3" stroke-dasharray="4 4" opacity="0.6">
      <path d="M730 398V490H36V364"/>
    </g>
    <path d="M36 358 48 364 36 370z" fill="#b79cff" opacity="0.6"/>
    <text x="400" y="484" font-size="10.5" fill="#655d79" text-anchor="middle">the answer streams back over SSE, written as it arrives</text>

    <text x="600" y="686" font-size="10.5" fill="#655d79" text-anchor="middle">a slow or expensive answer is one trace away from an explanation</text>
  </g>
</svg>
