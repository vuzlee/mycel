# Anything left out here falls back to `agents.defaults` in base.yaml.

# A GA release, not a preview: the free tier allows 20 requests a day against
# `gemini-3-flash-preview` and 15 a minute against this one, which is the difference
# between a slice that can be run and one that cannot. Lite rather than full flash because
# this agent splits a request and merges what comes back rather than reasoning hard,
# and 3.8 has been returning 503 under load.
model_spec: cloud:gemini-3.5-flash-lite

# One call per specialist per angle, and a report usually has a few angles. Low on purpose:
# every call here is itself a whole agent run, so this limit multiplies rather than adds.
tool_calls_limit: 8

# Counts this agent's own model requests *and* every specialist's, because
# `runner.delegate` merges a delegate's usage into the caller's — which is what keeps
# the budget honest and is also why this number cannot be the shared default. Two
# specialists doing two model calls each already exceed `dev.yaml`'s 8.
request_limit: 40
