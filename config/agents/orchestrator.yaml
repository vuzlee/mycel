# Anything left out here falls back to `agents.defaults` in base.yaml.

# One call per specialist per angle, and a report usually has a few angles.
tool_calls_limit: 8

# Counts this agent's own model requests *and* every specialist's, because
# `runner.delegate` merges a delegate's usage into the caller's — which is what keeps
# the budget honest and is also why this number cannot be the shared default. Two
# specialists doing two model calls each already exceed `dev.yaml`'s 8.
request_limit: 40
