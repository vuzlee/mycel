# Anything left out here falls back to `agents.defaults` in base.yaml.

# A GA release, not a preview: the free tier allows 20 requests a day against
# `gemini-3-flash-preview` and 15 a minute against this one. 3.8 has been returning 503
# under load, so the lite release of the same family is what actually runs.
model_spec: cloud:gemini-3.5-flash-lite

# Twelve queries answer any question this schema holds; 41 was fishing, not analysis —
# see MYC-48. `request_limit` is declared with it and one higher, because a limit that
# binds has to be the one this file chose: without it the environment's `agents.defaults`
# decides, and dev's 8 requests would stop the run long before the thirtieth query.
tool_calls_limit: 12
request_limit: 13

# When Google is overloaded the whole family is not down at once: on 2026-09-24 a probe
# found 3.5-lite on 504 and 3.8 on 503 while 3.6 answered, and five minutes later 3.6 was
# down too. Rotating a key does not help — every key meets the same 503 — so the run walks
# down this list instead. Still one provider, so a whole-of-Google outage still stops
# everything; a second provider is the real answer and needs a key we do not have.
fallback_specs:
  - cloud:gemini-3.6-flash
  - cloud:gemini-3.8-flash
