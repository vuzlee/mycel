# Anything left out here falls back to `agents.defaults` in base.yaml.

# Twelve queries answer any question this schema holds; 41 was fishing, not analysis.
# One request more than tool calls: the last one writes the report.
tool_calls_limit: 12
request_limit: 13
# The report is a handful of figures and findings; a cap keeps the last turn short.
max_tokens: 1200
