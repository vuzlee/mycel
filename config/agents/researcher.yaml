# Anything left out here falls back to `agents.defaults` in base.yaml.

# Searching is one call per angle on the question, and cross-checking a contested claim
# costs another. `request_limit` is declared alongside it and one higher, so this file
# decides where the run stops rather than the environment's `agents.defaults` — see
# `config/agents/analyst.yaml`.
tool_calls_limit: 12
request_limit: 13
