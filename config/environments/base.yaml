# Non-secret config. dev.yaml and prod.yaml hold only what differs; secrets live in .env.

agents:
  # Overridden per agent in config/agents/<name>.yaml.
  defaults:
    model_spec: cloud:claude-sonnet-5
    # Tried in order when the primary is unavailable (see model_builder.py).
    fallback_specs:
      - cloud:gemini-3.5-flash-lite
      - cloud:gemini-3.6-flash
    # The gateway drops it for models that reject sampling parameters (Gemini 3).
    temperature: 0.0
    timeout_s: 60.0
    tool_retries: 3
    # Retries by the provider client on transport failures; 0 disables.
    transient_retries: 2
    request_limit: 12
    tool_calls_limit: 20
    repeat_threshold: 2

# `Settings` fields, lower case. An environment variable of the same name overrides each.
settings:
  log_level: INFO
  # IANA zone: a Jira due date is a bare day, and its end depends on the zone.
  timezone: UTC

  db_pool_size: 5
  result_ttl_seconds: 3600
  # A client that falls behind sees a gap in `seq`.
  event_stream_max_events: 1000
  # Expiry is checked on read; the sweep only keeps app.session small.
  session_sweep_interval_seconds: 86400
  password_reset_ttl_seconds: 3600

  # Must match the OAuth callbacks registered with Google and Atlassian.
  public_base_url: http://localhost:8000
  sync_interval_seconds: 900
  jira_write_enabled: false
  # A project cannot be deleted over the API; off also drops the manage:jira-project scope.
  jira_allow_create_project: false

  litellm_base_url: http://localhost:4000
  # USD per million tokens [input, output] by gateway name. Unlisted models cost $0.
  model_prices_usd:
    claude-sonnet-5: [2.00, 10.00]
  job_ceiling_usd: 0.50

  # Empty disables rag_search.
  qdrant_url: http://localhost:6333
  # Part of the collection name: changing it means a full reindex.
  embedding_model: BAAI/bge-small-en-v1.5
  embedding_cache_dir: .cache/fastembed

  # Documents (Knowledge).
  s3_endpoint_url: http://localhost:9000
  documents_bucket: mycel-documents
  document_embedding_model: jinaai/jina-embeddings-v2-small-en
  document_chunk_tokens: 500
  document_table_max_tokens: 1500
  document_max_bytes: 2097152
  document_max_pages: 100
  documents_per_user: 200
  documents_in_flight_per_user: 5
  document_stuck_seconds: 600
  # The ingest worker restarts after this many; docling leaks native memory.
  ingest_worker_max_jobs: 20
  ingest_threads: 2
  # Below this top score no model is called. Measured: answerable 0.805+, off topic 0.72-.
  document_min_score: 0.75
  ask_top_k: 5
  ask_max_chars: 500

  # Password-reset mail; host and login are in .env.
  smtp_port: 587
  smtp_starttls: true

  # Empty means anyone can register; set it once the app is reachable by others.
  registration_allowed_domains: ""

  otel_enabled: false
  otel_service_name: mycel
  # Empty means Langfuse at langfuse_base_url.
  otel_exporter_otlp_endpoint: ""
  # Puts prompts and answers in spans: user data leaves the machine.
  otel_capture_content: false
  langfuse_base_url: https://cloud.langfuse.com
  # /metrics has no auth; the bind address keeps it private.
  metrics_host: 127.0.0.1
  metrics_port: 9100
