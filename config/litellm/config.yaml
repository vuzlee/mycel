# The one gateway every model call goes through (LiteLLM proxy).

include:
  - models.yaml

router_settings:
  routing_strategy: simple-shuffle
  # A key that answers 429 is set aside instead of retried at once.
  allowed_fails: 1
  cooldown_time: 60
  num_retries: 2

litellm_settings:
  # Gemini 3 rejects temperature/top_p instead of ignoring them.
  drop_params: true
  # A 429 for the day's quota benches that key until the quota resets (mycel_callbacks.py).
  callbacks: mycel_callbacks.daily_quota_cooldown
  request_timeout: 120

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
