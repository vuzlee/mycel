# Copy to models.yaml (gitignored) and keep the providers you have.
model_list:
  # One provider, one key: LLM_API_KEY in .env.
  - model_name: claude-sonnet-5
    litellm_params: {model: anthropic/claude-sonnet-5, api_key: os.environ/LLM_API_KEY}

