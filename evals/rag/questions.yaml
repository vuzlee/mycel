# Labelled questions for the retrieval benchmark (batch 063).
#
# A hit is a passage from `doc` that contains `evidence` (case and whitespace ignored).
# Labels are quotes, not chunk ids, so they survive any change to the chunker.
# `evidence` was checked to occur exactly once in its document.
# For `table` questions the evidence is the row label; the number sits in the same row.

- id: b01
  question: "What fraction of input tokens does BERT hide at random during masked language model pre-training?"
  doc: bert.pdf
  evidence: "we mask 15% of all WordPiece tokens"
  kind: prose
- id: b02
  question: "In next sentence prediction, what label is given when sentence B is just a random sentence from the corpus?"
  doc: bert.pdf
  evidence: "labeled as NotNext"
  kind: name
- id: b03
  question: "How long does it take to reproduce BERT's fine-tuning results on TPU hardware?"
  doc: bert.pdf
  evidence: "at most 1 hour on a single Cloud TPU"
  kind: prose
- id: b04
  question: "What GLUE average score did the ELMo baseline with BiLSTM and attention get on the test set?"
  doc: bert.pdf
  evidence: "BiLSTM+ELMo+Attn"
  kind: table
- id: b05
  question: "How does an expert human score on the SWAG commonsense inference benchmark compared to BERT?"
  doc: bert.pdf
  evidence: "Human (expert)"
  kind: table
- id: r01
  question: "How many passages does the Wikipedia knowledge source contain once the articles are split into chunks?"
  doc: rag.pdf
  evidence: "to make a total of 21M documents"
  kind: prose
- id: r02
  question: "Which library is used to build the nearest-neighbour index over document embeddings in RAG?"
  doc: rag.pdf
  evidence: "single MIPS index using FAISS"
  kind: name
- id: r03
  question: "How big is the BART generator that RAG uses, in parameters?"
  doc: rag.pdf
  evidence: "with 400M parameters"
  kind: name
- id: r04
  question: "On FEVER, how often is RAG's first retrieved passage from a gold evidence article?"
  doc: rag.pdf
  evidence: "top retrieved document is from a gold article"
  kind: prose
- id: r05
  question: "In the human evaluation of Jeopardy questions, what share of cases were judged bad for both BART and RAG?"
  doc: rag.pdf
  evidence: "Both poor"
  kind: table
