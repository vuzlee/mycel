# A partial summary that does not say it is partial reads exactly like a complete one.
# `notes` is where the cut declares itself; this case fails a model that quietly drops the
# NOTE line out of the prompt.
prompt: |
  Project MYC, 2026-09-01 to 2026-09-20

  NOTE: 140 older items were dropped to fit. This summary covers the most recent ones
  only, and must say so.

  Totals — done: 2, doing: 1, todo: 0

  Work, by epic:
    MYC-5 — Agents
      key=MYC-51  status=done  kind=story  title=Orchestrator splits the task  who=vu le  estimated=4.0d  spent=4.2d
      key=MYC-52  status=done  kind=task  title=Analyst reads gold  who=mai tran  estimated=2.0d  spent=1.9d
      key=MYC-53  status=doing  kind=story  title=Reviewer checks the sources  who=vu le  estimated=3.0d  spent=1.0d  due=2026-10-15

  Nothing is past its due date.

  Per person — items, done, estimated vs spent (days):
    vu le — 2 items, 1 done, estimated 7.0d, spent 5.2d (1.8d under)
    mai tran — 1 items, 1 done, estimated 2.0d, spent 1.9d (0.1d under)

expect:
  health: on_track
  shipped_keys: [MYC-51, MYC-52]
  notes_contain: ["dropped"]
  load_people: [vu le, mai tran]
