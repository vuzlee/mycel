[project]
name = "mycel"
version = "0.1.0"
description = "Multi-agent system that builds reports and dashboards from multiple data sources"
requires-python = ">=3.11"
dependencies = [
  # pydantic-ai-slim, not the full package: full pulls in every provider plus Logfire.
  "pydantic-ai-slim[anthropic,google,openai]>=2.44,<3",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27",
]

# Dev tooling: CI runs on a clean runner, so anything not declared here does not exist.
[dependency-groups]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8.0", "anyio>=4.4", "types-pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mycel"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
