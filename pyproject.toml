[project]
name = "mycel"
version = "0.1.0"
description = "Chat with agents over your team's Jira, mail, calendar and documents"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  # slim: the full package pulls in every provider and Logfire.
  "pydantic-ai-slim[google,mcp,openai]>=2.44,<3",
  "pydantic-settings>=2.4",
  # Imported directly, so declared even though pydantic-ai brings it.
  "httpx2>=2.13",
  "pyyaml>=6.0",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "aio-pika>=9.4",
  "redis>=5.0",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "prometheus-client>=0.20",
  # Fernet for stored Google and Jira refresh tokens.
  "cryptography>=43.0",
  "qdrant-client>=1.12",
  # ONNX embeddings without PyTorch.
  "fastembed>=0.5",
  "aioboto3>=13.0",
  "filetype>=1.2",
  "python-multipart>=0.0.9",
]

# torch from the CPU index: the default wheel brings ~3 GB of CUDA.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.0",
  "anyio>=4.4",
  "types-pyyaml>=6.0",
  "python-dotenv>=1.0",
  "asyncpg-stubs>=0.29",
  "pytest-cov>=5.0",
]
# The ingest worker only (~2.5 GB). A default group so a plain `uv sync` keeps it.
ingest = [
  "docling>=2.15",
  "torch",
  "torchvision",
]

[tool.uv]
default-groups = ["dev", "ingest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mycel"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# B008 flags Depends() in argument defaults, which is how FastAPI works.
"src/mycel/api/routes/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "evals"]

[[tool.mypy.overrides]]
module = [
  "aioboto3", "aioboto3.*", "botocore.*", "filetype",
  # ingest group; CI type-checks without it.
  "docling.*", "docling_core.*", "transformers",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mycel.infra.documents.*"]
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/mycel"]
branch = true

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]
# A floor: raise it when coverage climbs, never lower it to pass.
fail_under = 70
show_missing = true
