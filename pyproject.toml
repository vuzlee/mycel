[project]
name = "mycel"
version = "0.1.0"
description = "Multi-agent system that builds reports and dashboards from multiple data sources"
requires-python = ">=3.11"
dependencies = [
  # pydantic-ai-slim, not the full package: full pulls in every provider plus Logfire.
  "pydantic-ai-slim[anthropic,google,mcp,openai]>=2.44,<3",
  "pydantic-settings>=2.4",
  # Arrives with pydantic-ai anyway, declared because `tools/web_search.py` imports it
  # directly: a transitive dependency is a fact about today's lockfile, not a promise.
  "httpx2>=2.13",
  "pyyaml>=6.0",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  # The HTTP shell. `fastapi`, not `fastapi[standard]`: the latter pulls in a CLI, an
  # email validator and httpx, none of which this service uses.
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  # The job queue. `aio-pika` over the raw `pika` client because everything downstream of a
  # job is async — the orchestrator, its tools, httpx — and a blocking AMQP client would
  # have to be driven from a thread to coexist with them.
  "aio-pika>=9.4",
  # Where a finished report waits until someone asks for it. Not durable storage: a result
  # has to be readable from a second process, and the data layer that will own it properly
  # is a later branch.
  "redis>=5.0",
]

# Dev tooling: CI runs on a clean runner, so anything not declared here does not exist.
[dependency-groups]
dev = [
  "ruff>=0.6", "mypy>=1.11", "pytest>=8.0", "anyio>=4.4", "types-pyyaml>=6.0",
  # Drives the app in tests without a running server.
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mycel"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# B008 forbids a call in an argument default, which is exactly how FastAPI declares a
# dependency. The rule is right in general and wrong for this one framework idiom, so it
# is turned off where routes live rather than silenced line by line.
"src/mycel/api/routes/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
